<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OMS Lagerliste</title>
<style>
:root { --bg:#101418; --card:#1b222b; --fg:#f2f5f8; --dim:#8fa0b0; --acc:#33b5ff; --ok:#2ecc71; --warn:#f5a623; --line:#2a3542; --old:#ff3b30; --oldbg:#4d1210; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
body { padding-bottom:132px; }
header { position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 10px 6px; border-bottom:1px solid var(--line); }
.tourrow { display:flex; justify-content:space-between; align-items:baseline; }
.tour { font-size:15px; font-weight:700; color:var(--acc); }
.agebadge { display:none; margin-left:7px; padding:3px 8px; border-radius:8px; font-size:11px; font-weight:800; letter-spacing:.6px; vertical-align:middle; }
.agebadge.fresh { display:inline-block; background:#12331f; color:var(--ok); border:1px solid var(--ok); }
.agebadge.warn { display:inline-block; background:#3a2f14; color:var(--warn); border:1px solid var(--warn); }
.agebadge.old { display:inline-block; background:var(--oldbg); color:#ffe2e0; border:1px solid var(--old); }
.agebadge.pruef { display:inline-block; background:#3a2f14; color:var(--warn); border:1px solid var(--warn); }
.agebadge.none { display:inline-block; background:var(--card); color:var(--dim); border:1px solid var(--line); }
#agebar { display:none; margin:7px -10px 0; padding:11px 12px; font-size:15px; font-weight:800; line-height:1.35; text-align:center; }
#agebar.warn { display:block; background:#3a2f14; color:var(--warn); border-top:2px solid var(--warn); border-bottom:2px solid var(--warn); }
#agebar.old { display:block; background:var(--oldbg); color:#ffe2e0; border-top:3px solid var(--old); border-bottom:3px solid var(--old); animation:oldpulse 1.6s ease-in-out infinite; }
#agebar .sub { display:block; margin-top:3px; font-size:13px; font-weight:600; opacity:.9; }
@keyframes oldpulse { 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.5); } }
@media (prefers-reduced-motion: reduce) { #agebar.old { animation:none; } }
body.veraltet header { background:var(--oldbg); border-bottom:3px solid var(--old); }
body.veraltet .tour { color:#fff; }
.prog { font-size:14px; color:var(--dim); font-variant-numeric:tabular-nums; }
.prog b { color:var(--ok); } .prog i { color:var(--warn); font-style:normal; }
.tabs { display:flex; gap:6px; overflow-x:auto; padding:8px 0 4px; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab { flex:0 0 auto; padding:9px 13px; border-radius:20px; background:var(--card); color:var(--dim); font-size:14px; font-weight:600; border:1px solid var(--line); }
.tab.act { background:var(--acc); color:#04283d; border-color:var(--acc); }
.tab.done { color:var(--ok); border-color:var(--ok); }
.tab.warn { color:var(--warn); border-color:var(--warn); }
.tab.warn.act { background:var(--warn); color:#3a2a00; }
.bar { height:5px; background:var(--card); border-radius:3px; overflow:hidden; margin-top:4px; }
.bar>div { height:100%; background:var(--ok); width:0%; transition:width .25s; }
.now { margin:10px; padding:14px 14px 12px; background:var(--card); border:2px solid var(--acc); border-radius:16px; }
.now .lbl { font-size:12px; letter-spacing:1.5px; color:var(--acc); font-weight:700; }
.mhead { display:flex; align-items:baseline; gap:9px; margin:0 0 9px; padding-bottom:9px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.kbadge { flex:0 0 auto; background:var(--acc); color:#04283d; font-size:14px; font-weight:800; padding:4px 10px; border-radius:9px; font-variant-numeric:tabular-nums; }
.mname { font-size:17px; font-weight:800; line-height:1.25; color:var(--fg); word-break:break-word; }
.nowrow { display:flex; align-items:center; gap:14px; margin-top:6px; }
.nowsel { font-size:56px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; min-width:92px; }
.nowqty { font-size:46px; font-weight:800; color:var(--ok); margin-left:auto; white-space:nowrap; }

.pickrow { display:flex; align-items:center; justify-content:center; gap:16px; margin:12px 0 6px; }
.stepbtn { width:58px; height:58px; font-size:32px; font-weight:800; border-radius:14px; border:1.5px solid var(--acc); background:var(--card); color:var(--acc); line-height:1; }

.vbtn.mic.on { border-color:#ff5a5a; background:#3a1414; animation:pulse 1.4s infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 #ff5a5a55} 50%{box-shadow:0 0 0 7px #ff5a5a00} }
.heard { font-size:11px; color:var(--dim); max-width:46vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nx { flex:1; min-width:0; }

.nrow { display:flex; align-items:center; gap:10px; padding:4px 2px 0; font-size:14px; color:var(--dim); }
.nrow b { color:var(--fg); font-size:17px; min-width:44px; font-variant-numeric:tabular-nums; }
.nrow .q { margin-left:auto; color:var(--ok); font-weight:700; font-size:16px; white-space:nowrap; }
.nrow .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#pinov { position:fixed; inset:0; z-index:99; display:none; align-items:center; justify-content:center; background:var(--bg); }
.pinbox { width:min(86vw,340px); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; text-align:center; }
.pinbox h2 { margin:0 0 4px; font-size:19px; }
.pinbox p { margin:0 0 14px; font-size:13px; color:var(--dim); }
.pinbox input { width:100%; padding:14px; font-size:26px; text-align:center; letter-spacing:6px; border-radius:11px; border:1.5px solid var(--line); background:var(--bg); color:var(--fg); font-variant-numeric:tabular-nums; }
.pinbox button { width:100%; margin-top:12px; padding:14px; font-size:17px; font-weight:800; border:0; border-radius:11px; background:var(--acc); color:#04283d; }
#pinmsg { min-height:18px; margin-top:9px; font-size:13px; color:var(--warn); }
.nodata { margin:40px 16px; text-align:center; color:var(--dim); font-size:16px; line-height:1.5; }
/* --- Ablauf-Modus --- */
.stepcard { margin:10px; padding:14px; background:var(--card); border:2px solid var(--acc); border-radius:16px; }
.stepcard .shead { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.stepcard .stitle { font-size:19px; font-weight:800; line-height:1.25; }
.stepcard .ssub { width:100%; font-size:14px; color:var(--dim); margin-top:3px; line-height:1.3; }
.tmrrow { display:flex; align-items:baseline; gap:14px; margin-top:10px; }
.tmr { font-size:50px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; color:var(--ok); }
.tmr.w { color:var(--warn); } .tmr.o { color:var(--old); }
.soll { margin-left:auto; text-align:right; font-size:13px; color:var(--dim); line-height:1.4; }
.soll b { color:var(--fg); font-size:16px; }
.stepbtns { display:flex; gap:10px; margin-top:12px; }
.skipbtn { flex:1; padding:13px 8px; font-size:15px; font-weight:800; border-radius:12px; background:var(--card); color:var(--dim); border:1.5px solid var(--line); }
.steps { margin:6px 10px; }

.srow .szeit { flex:0 0 auto; font-variant-numeric:tabular-nums; font-size:13px; }
.srow.cur { color:var(--fg); background:#12202e; border-left:3px solid var(--acc); border-radius:6px; }
.srow.cur .snr { color:var(--acc); border-color:var(--acc); }
.srow.ok { opacity:.55; } .srow.ok .snr { color:var(--ok); border-color:var(--ok); }
.srow.sk { opacity:.4; } .srow.sk .snm { text-decoration:line-through; }
.sgroup { margin:14px 12px 2px; font-size:13px; font-weight:800; color:var(--acc); letter-spacing:.4px; }
.navtabs { display:flex; gap:6px; padding:8px 0 4px; }
.navtab { flex:1; text-align:center; padding:9px 8px; border-radius:12px; background:var(--card); color:var(--dim); font-size:14px; font-weight:700; border:1px solid var(--line); }
.navtab.act { background:var(--acc); color:#04283d; border-color:var(--acc); }
.navtab.warn { color:var(--warn); border-color:var(--warn); }
.navtab.warn.act { background:var(--warn); color:#3a2a00; }
.stepback { flex:0 0 auto; align-self:center; padding:13px 12px; font-size:15px; font-weight:800; border-radius:12px; border:1.5px solid var(--dim); background:var(--card); color:var(--fg); }
.stepback:disabled { opacity:.35; }
.stepback.pause.on { border-color:var(--warn); color:var(--warn); background:#3a2f14; }
.pausenote { margin-top:8px; padding:8px 10px; border-radius:10px; background:#3a2f14; color:var(--warn); font-weight:800; font-size:14px; text-align:center; }
.z3 { flex:0 0 auto; min-width:52px; text-align:right; font-variant-numeric:tabular-nums; font-size:13px; }
.srow.kopf { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.5px; border-bottom:1.5px solid var(--dim); }

.fillhint { margin:10px 2px 2px; font-size:13px; color:var(--dim); line-height:1.45; }
</style>

<body>
<div id="pinov"><div class="pinbox"><h2>&#128230; OMS Lagerliste</h2><p>Bitte PIN eingeben (einmalig)</p>
<input id="pin" inputmode="numeric" autocomplete="off" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;">
<button onclick="pinGo()">&Ouml;ffnen</button><div id="pinmsg"></div></div></div>
<header>
  <div class="tourrow"><span><span class="tour" id="ttl">&#128230; Lagerliste</span><span class="agebadge" id="agebadge"></span></span>
    <span class="vbtns"><span class="heard" id="heard"></span><button class="vbtn" id="vb" onclick="toggleVoice()">&#128266;</button><button class="vbtn mic" id="mb" onclick="toggleMic()">&#127908;</button></span></div>
  <div id="agebar" role="alert"></div>
  <div class="tourrow"><span class="prog" id="zeitges"></span><span class="prog" id="prog"></span></div>
  <div id="navzone"></div>
  <div class="bar"><div id="bar"></div></div>
</header>
<div id="main"></div>
<div class="next" id="botbar"><button class="undo" id="undo" onclick="undo()">&#8617; Zur&uuml;ck</button><div class="nx" id="nx"></div></div>
<script>
const LS=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return localStorage;}catch(e){const m={};return{getItem:k=>(k in m?m[k]:null),setItem:(k,v)=>{m[k]=String(v);},clear:()=>{for(const k in m)delete m[k];}};}})();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pin, salt) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function tryPin(pin) {
  const r = await fetch('data.enc.json?t=' + Date.now(), {cache:'no-store'});
  if (!r.ok) throw new Error('load');
  const enc = await r.json();
  const key = await deriveKey(pin, b64(enc.salt));
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(enc.iv)}, key, b64(enc.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
window.pinGo = async () => {
  const pin = document.getElementById('pin').value.trim();
  const msg = document.getElementById('pinmsg');
  msg.textContent = 'Pr\u00fcfe \u2026';
  try { const d = await tryPin(pin); LS.setItem('packliste_pin', pin); document.getElementById('pinov').remove(); startApp(d); }
  catch(e) { msg.textContent = 'PIN falsch oder Daten nicht erreichbar.'; }
};
document.addEventListener('keydown', e => { if (e.key === 'Enter' && document.getElementById('pinov')) pinGo(); });
(async () => {
  const saved = LS.getItem('packliste_pin');
  if (saved) { try { const d = await tryPin(saved); document.getElementById('pinov').remove(); startApp(d); return; } catch(e){} }
  document.getElementById('pinov').style.display = 'flex';
})();

// ==================== Gemeinsames: Alters-Kennzeichnung ====================
function kennzeichneAlter(DATA, listArt) {
  document.getElementById('ttl').innerHTML = '&#128230; ' + listArt + ' ' + DATA.tour + ' &middot; ' + (DATA.datum || '&#8211;');
  document.title = listArt + ' ' + DATA.tour + ' ' + (DATA.datum || '');
  const alterTage = (() => {
    const s = String(DATA.datum || '');
    if (s.length === 0) return '';
    if (s.length !== 10 || s.charAt(4) !== '-' || s.charAt(7) !== '-') return null;
    const nurZiffern = x => { for (let i = 0; i < x.length; i++) { const c = x.charCodeAt(i); if (c < 48 || c > 57) return false; } return x.length > 0; };
    const jS = s.slice(0, 4), mS = s.slice(5, 7), tS = s.slice(8, 10);
    if (!nurZiffern(jS) || !nurZiffern(mS) || !nurZiffern(tS)) return null;
    const j = Number(jS), m = Number(mS), t = Number(tS);
    if (j < 2000 || j > 2999 || m < 1 || m > 12 || t < 1 || t > 31) return null;
    const ms = Date.UTC(j, m - 1, t);
    const roundtrip = new Date(ms);
    if (roundtrip.getUTCFullYear() !== j || roundtrip.getUTCMonth() !== m - 1 || roundtrip.getUTCDate() !== t) return null;
    const jetzt = new Date();
    const tage = Math.round((Date.UTC(jetzt.getFullYear(), jetzt.getMonth(), jetzt.getDate()) - ms) / 86400000);
    return Number.isFinite(tage) ? tage : null;
  })();
  const bd = document.getElementById('agebadge'), br = document.getElementById('agebar');
  const setBanner = (klasse, haupt, sub) => {
    br.textContent = '';
    br.className = klasse;
    br.appendChild(document.createTextNode('\u26A0\uFE0F ' + haupt));
    const s = document.createElement('span');
    s.className = 'sub'; s.textContent = sub;
    br.appendChild(s);
  };
  const dstr = typeof alterTage === 'number'
    ? String(DATA.datum).slice(8, 10) + '.' + String(DATA.datum).slice(5, 7) + '.' + String(DATA.datum).slice(0, 4)
    : '';
  if (alterTage === '') { bd.className = 'agebadge none'; bd.textContent = 'KEINE LISTE'; return; }
  if (alterTage === null) {
    bd.className = 'agebadge pruef'; bd.textContent = 'DATUM PR\u00dcFEN';
    setBanner('warn', 'Das Datum dieser Liste ist unbrauchbar.', 'Stand nicht bestimmbar - vor dem Packen den aktuellen Stand pr\u00fcfen.');
    document.title = 'DATUM PR\u00dcFEN - ' + document.title;
    return;
  }
  if (alterTage < 0) {
    bd.className = 'agebadge pruef'; bd.textContent = 'DATUM PR\u00dcFEN';
    setBanner('warn', 'Das Datum dieser Liste liegt in der Zukunft (' + dstr + ').',
      'Stand nicht plausibel - vor dem Packen den aktuellen Stand pr\u00fcfen.');
    document.title = 'DATUM PR\u00dcFEN - ' + document.title;
    return;
  }
  if (alterTage === 0) { bd.className = 'agebadge fresh'; bd.textContent = 'HEUTE'; return; }
  if (alterTage === 1) {
    bd.className = 'agebadge warn'; bd.textContent = 'VON GESTERN';
    setBanner('warn', 'Diese Liste ist von GESTERN (' + dstr + ')',
      'Pr\u00fcfen, ob inzwischen eine neue Liste ver\u00f6ffentlicht wurde.');
    document.title = '(gestern) ' + document.title;
    return;
  }
  bd.className = 'agebadge old'; bd.textContent = alterTage + ' TAGE ALT';
  setBanner('old', 'VERALTETE LISTE \u00b7 ' + alterTage + ' Tage alt (' + dstr + ')',
    'Nicht nach dieser Liste arbeiten, bevor der aktuelle Stand gepr\u00fcft ist.');
  document.body.classList.add('veraltet');
  document.title = 'VERALTET (' + alterTage + ' Tage) - ' + document.title;
}

function startApp(DATA) {
  if (DATA.plan && DATA.machines && DATA.machines.length) { flowApp(DATA); }
  else { legacyApp(DATA); }
}

// ==================== Ablauf-Modus (Lagerliste) ====================
// Gefuehrte Schritte mit Timern. Schritt-Titel und Sollwerte kommen aus den
// verschluesselten Daten; hier steht nur neutrale Ablauf-Mechanik.
function flowApp(DATA) {
  kennzeichneAlter(DATA, 'Lagerliste');
  const P = DATA.plan;
  const KEY = 'lagerliste_' + DATA.datum + '_' + DATA.tour;
  let state = JSON.parse(LS.getItem(KEY) || 'null') || {};
  if (!state.items) {
    // Uebernahme eines evtl. schon begonnenen Stands der klassischen Packliste desselben Tages,
    // damit beim Umstieg auf die Lagerliste kein Pack-Fortschritt verloren geht.
    try {
      const alt = JSON.parse(LS.getItem('packliste_' + DATA.datum + '_' + DATA.tour) || 'null');
      if (alt && alt.items) { state.items = alt.items; state.part = alt.part || {}; }
    } catch(e) {}
  }
  if (!state.items) state.items = {};
  if (!state.part) state.part = {};
  if (!state.hist) state.hist = [];
  if (!state.done) state.done = {};
  if (!state.skipd) state.skipd = {};
  if (!state.zeit) state.zeit = {};
  if (typeof state.tab !== 'number') state.tab = 0;      // Kisten-Tab im Pack-Schritt
  if (typeof state.step !== 'number') state.step = 0;    // Index in STEPS
  if (typeof state.view !== 'number') state.view = 0;    // 0 = Ablauf, 1 = Fehlt, 2 = Zeit
  if (typeof state.pauseSum !== 'number') state.pauseSum = 0;  // Pausen-Sekunden gesamt
  const save = () => LS.setItem(KEY, JSON.stringify(state));

  // ---- Schritt-Liste aufbauen ----
  // Schritt-Titel kommen aus den entschluesselten Daten (P.taet[nr].n), nichts steht statisch hier.
  const T = n => (P.taet || {})[String(n)] || null;
  const titel = n => { const t = T(n); return t && t.n ? String(t.n).replace(/\s*\([^)]*\)\s*$/, '') : 'Schritt ' + n; };
  const sollMin = (n, menge) => { const t = T(n); if (!t) return 0; let v = t.s * menge; if (String(t.e).charAt(0) === 's') v /= 60; return v; };
  const pufVon = n => { const t = T(n); return (t && typeof t.p === 'number') ? t.p : 0.1; };
  const M_BY_DEV = {}; DATA.machines.forEach((m, i) => { M_BY_DEV[m.device] = i; });
  const stkVon = m => m.items.reduce((a, it) => a + it.qty, 0);
  const stkGes = DATA.machines.reduce((a, m) => a + stkVon(m), 0);
  const STEPS = [];
  let fahrtN = 0;
  const autoBlock = (dev) => {
    const mi = M_BY_DEV[dev]; if (mi == null) return;
    const m = DATA.machines[mi];
    const add = (nr, o) => STEPS.push(Object.assign({id: 'a' + dev + '_' + nr, nr, t: titel(nr), sub: m.label, dev, mi}, o || {}));
    add(5, {soll: sollMin(5, 1)});
    add(6, {soll: sollMin(6, 1)});
    add(7, {soll: sollMin(7, 1)});
    // Bedarfs-Schritte: Sollzeit gilt JE EREIGNIS (ev:1) und zaehlt nicht je Automat in die
    // Gesamt-Sollzeit; dort gehen stattdessen die Mengen-Annahmen der Tour ein (s. sollGesMin).
    add(8, {skip: 1, ev: 1, soll: sollMin(8, 1)});
    add(9, {skip: 1, ev: 1, soll: sollMin(9, 1)});
    add(10, {mode: 'fill', soll: sollMin(10, stkVon(m))});
    add(11, {soll: sollMin(11, 1)});
    add(12, {soll: sollMin(12, 1)});
    add(14, {soll: sollMin(14, 1)});
  };
  STEPS.push({id: 't1', nr: 1, t: titel(1), sub: 'Alle Kisten dieser Tour', mode: 'pack', soll: sollMin(1, stkGes)});
  if ((P.todos || 0) > 0) STEPS.push({id: 't2', nr: 2, t: titel(2), sub: 'Nur bei Bedarf', skip: 1, soll: sollMin(2, P.todos)});
  STEPS.push({id: 't3', nr: 3, t: titel(3), soll: sollMin(3, 1)});
  // Fester Kontroll-Schritt ohne Soll (nicht Teil der Soll-Tabelle): vor der Abfahrt
  // pruefen, dass alles verschlossen ist und das Licht aus ist.
  STEPS.push({id: 't3a', nr: '3a', t: 'Lager abschlie\u00dfen', sub: 'Alles zu? Licht aus?', soll: 0});
  const seen = {};
  (P.standorte || []).forEach((st, si) => {
    const devs = (st.devs || []).filter(d => M_BY_DEV[d] != null);
    if (!devs.length) return;
    fahrtN++; STEPS.push({id: 'f' + fahrtN, nr: 4, t: titel(4), sub: '\u2192 ' + st.name, fahrt: 1});
    devs.forEach(dev => { seen[dev] = 1; autoBlock(dev); });
    // st.ohne: Taetigkeits-Nummern, die an diesem Standort entfallen (aus den Tour-Daten).
    const ohne = st.ohne || [];
    if (ohne.indexOf(13) < 0) STEPS.push({id: 's' + si + '_13', nr: 13, t: titel(13), sub: st.name, soll: sollMin(13, 1)});
    if (ohne.indexOf(15) < 0) STEPS.push({id: 's' + si + '_15', nr: 15, t: titel(15), sub: st.name, soll: sollMin(15, 1)});
    if (st.kiosk && ohne.indexOf(16) < 0) STEPS.push({id: 's' + si + '_16', nr: 16, t: titel(16), sub: st.name, soll: sollMin(16, 1)});
    // Vor der Weiterfahrt: Kisten zurueck ins Auto. Kontroll-Schritt ohne eigenes Soll
    // (die zugehoerige Sollzeit ist je Tour bemessen und steckt in Nr. 3).
    STEPS.push({id: 's' + si + '_3b', nr: '3b', t: titel(3), sub: st.name, ort: 1, soll: 0});
  });
  // Sicherheitsnetz: Automaten, die in keiner Gruppe auftauchen, bekommen trotzdem ihren Block.
  DATA.machines.forEach(m => {
    if (seen[m.device]) return;
    fahrtN++; STEPS.push({id: 'f' + fahrtN, nr: 4, t: titel(4), sub: '\u2192 ' + m.label, fahrt: 1});
    autoBlock(m.device);
    STEPS.push({id: 'o' + m.device + '_3b', nr: '3b', t: titel(3), sub: m.label, ort: 1, soll: 0});
  });
  fahrtN++; STEPS.push({id: 'f' + fahrtN, nr: 4, t: titel(4), sub: '\u2192 zur\u00fcck', fahrt: 1});
  STEPS.push({id: 't17', nr: 17, t: titel(17), soll: sollMin(17, 1)});
  STEPS.push({id: 't18', nr: 18, t: titel(18), soll: sollMin(18, 1)});
  if (state.step >= STEPS.length) state.step = 0;
  // Wurde am selben Tag ein geaenderter Plan veroeffentlicht, kann eine gespeicherte
  // Schritt-ID nicht mehr existieren -> Timer sauber loslassen, Auto-Start unten greift.
  const STEP_IDS = {}; STEPS.forEach(s => { STEP_IDS[s.id] = 1; });
  if (state.aktiv && !STEP_IDS[state.aktiv]) { state.aktiv = null; state.seit = null; }
  // Existiert die aktive Schritt-ID noch, den (index-basierten) state.step darauf
  // ausrichten - neu eingefuegte Schritte verschieben sonst gespeicherte Indizes.
  if (state.aktiv) {
    const i = STEPS.findIndex(s => s.id === state.aktiv);
    if (i >= 0) state.step = i;
  }

  // ---- Timer ----
  const ist = id => (state.zeit[id] || 0) + (state.aktiv === id && state.seit ? (Date.now() - state.seit) / 1000 : 0);
  const istGes = () => STEPS.reduce((a, s) => a + ist(s.id), 0);
  const fahrtIst = () => STEPS.filter(s => s.fahrt).reduce((a, s) => a + ist(s.id), 0);
  // Gesamt-Soll: feste Schritte je Vorkommen; Fahrten als Tour-Budget; Bedarfs-Schritte (ev)
  // NICHT je Automat, sondern ueber die Mengen-Annahmen der Tour (todos/muenz).
  const sollGesMin = STEPS.reduce((a, s) => a + ((s.ev || s.fahrt) ? 0 : (s.soll || 0)), 0)
    + (P.fahrzeit || 0) + (P.muenz || 0) * sollMin(8, 1) + (P.todos || 0) * sollMin(9, 1);
  function stopTimer() {
    if (state.aktiv && state.seit) state.zeit[state.aktiv] = (state.zeit[state.aktiv] || 0) + (Date.now() - state.seit) / 1000;
    state.aktiv = null; state.seit = null;
  }
  // Pause: haelt den Schritt-Timer an, die Pausenzeit laeuft separat mit (fuers Protokoll).
  function endePause() {
    if (state.pausiert && state.pauseSeit) state.pauseSum += (Date.now() - state.pauseSeit) / 1000;
    state.pausiert = 0; state.pauseSeit = null;
  }
  const pauseIst = () => (state.pauseSum || 0) + (state.pausiert && state.pauseSeit ? (Date.now() - state.pauseSeit) / 1000 : 0);
  window.togglePause = () => {
    // Eine fertige Tour laesst sich nicht (unsichtbar) pausieren - nur noch fortsetzen.
    if (!state.pausiert && naechsterOffen(0) < 0) return;
    if (state.pausiert) {
      endePause();
      const s = STEPS[state.step];
      if (!state.done[s.id] && !state.skipd[s.id]) { state.aktiv = s.id; state.seit = Date.now(); }
    } else {
      stopTimer();
      state.pausiert = 1; state.pauseSeit = Date.now();
    }
    if (navigator.vibrate) navigator.vibrate(20);
    save(); render();
  };
  function laufe(i) {
    endePause();
    stopTimer();
    state.step = i;
    const s = STEPS[i];
    delete state.done[s.id]; delete state.skipd[s.id];
    state.aktiv = s.id; state.seit = Date.now();
    state.view = 0;
    springTop = true;
    save(); render(); ansageSchritt();
  }
  const naechsterOffen = from => {
    for (let i = from; i < STEPS.length; i++) if (!state.done[STEPS[i].id] && !state.skipd[STEPS[i].id]) return i;
    for (let i = 0; i < from; i++) if (!state.done[STEPS[i].id] && !state.skipd[STEPS[i].id]) return i;
    return -1;
  };
  window.springe = i => laufe(i);
  window.stepZurueck = () => { if (state.step > 0) laufe(state.step - 1); };
  const offenPack = () => DATA.machines.reduce((n, m) => n + m.items.filter(it => !st(k(m, it))).length, 0);
  window.fertig = () => {
    const s = STEPS[state.step];
    if (s.mode === 'pack' && offenPack() > 0) return;
    endePause(); stopTimer(); state.done[s.id] = 1;
    if (navigator.vibrate) navigator.vibrate(30);
    const n = naechsterOffen(state.step + 1);
    if (n < 0) { state.aktiv = null; springTop = true; save(); render(); speak('Tour komplett. Stark!'); }
    else laufe(n);
  };
  window.skipStep = () => {
    const s = STEPS[state.step];
    endePause(); stopTimer(); state.skipd[s.id] = 1;
    const n = naechsterOffen(state.step + 1);
    if (n < 0) { state.aktiv = null; springTop = true; save(); render(); }
    else laufe(n);
  };
  // Automatischer Timer-Start beim Oeffnen (nicht waehrend einer Pause).
  if (!state.aktiv && !state.pausiert && naechsterOffen(0) >= 0) {
    const first = (!state.done[STEPS[state.step].id] && !state.skipd[STEPS[state.step].id]) ? state.step : naechsterOffen(0);
    state.step = first; state.aktiv = STEPS[first].id; state.seit = Date.now();
  }

  // ---- Positions-Mechanik (wie Packliste; Status 0 offen / 1 gepackt / 2 fehlt / 3 Teilmenge) ----
  const k = (m, it) => m.device + '_' + it.id;
  const selTxt = it => it.sel.join('+') || '\u2013';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const st = key => state.items[key] || 0;
  const partOf = key => state.part[key] || 0;
  const missQty = (m, it) => { const s = st(k(m, it)); return s === 2 ? it.qty : s === 3 ? Math.max(0, it.qty - partOf(k(m, it))) : 0; };
  const missList = () => DATA.machines.flatMap((m, i) => m.items.filter(it => missQty(m, it) > 0).map(it => ({m, i, it, miss: missQty(m, it)})));
  let ui = {pickKey: null, pickVal: 0};
  // Scroll-Verhalten: Nach dem Abhaken springt die Ansicht zum NAECHSTEN OFFENEN Punkt
  // (#nextitem); bei sonstigen Korrekturen bleibt sie stehen; nur Schritt-, Kisten-
  // oder Ansichtswechsel springen an den Seitenanfang.
  let springTop = true, scrollZiel = null;
  function scrollNach(y0) {
    if (springTop) { window.scrollTo(0, 0); springTop = false; scrollZiel = null; return; }
    if (scrollZiel === 'next') {
      scrollZiel = null;
      const el = document.getElementById('nextitem');
      if (el) {
        const kopf = (document.querySelector('header') || {}).offsetHeight || 0;
        window.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + window.scrollY - kopf - 8));
        return;
      }
    }
    scrollZiel = null;
    window.scrollTo(0, y0);
  }
  // Kisten-/Automatenleiste: aktiven Reiter sichtbar halten (die Leiste wird je Render neu
  // aufgebaut und stuende sonst wieder ganz links).
  function leisteZentrieren() {
    const tb = document.querySelector('.tabs');
    const akt = tb && tb.querySelector('.tab.act');
    if (tb && akt) tb.scrollLeft = Math.max(0, akt.offsetLeft - (tb.clientWidth - akt.offsetWidth) / 2);
  }
  // Ist die aktuelle Kiste im Pack-Schritt komplett, automatisch zur naechsten Kiste mit
  // offenen Positionen wechseln (nach dem letzten Punkt geht direkt das naechste
  // Produkt der naechsten Kiste auf).
  function packWeiter() {
    const s = STEPS[state.step];
    if (!s || s.mode !== 'pack') return '';
    const m = DATA.machines[state.tab];
    if (!m || m.items.some(it => !st(k(m, it)))) return '';
    for (let d = 1; d < DATA.machines.length; d++) {
      const j = (state.tab + d) % DATA.machines.length;
      if (DATA.machines[j].items.some(it => !st(k(DATA.machines[j], it)))) {
        state.tab = j;
        return 'Kiste ' + (j + 1) + '. ';
      }
    }
    return '';
  }
  window.mark = (key, val) => {
    const prev = st(key), prevPart = state.part[key];
    ui.pickKey = null;
    let ansage = '';
    if (val === 0) { delete state.items[key]; delete state.part[key]; }
    else { state.items[key] = val; if (val !== 3) delete state.part[key]; scrollZiel = 'next'; ansage = packWeiter(); }
    state.hist.push({key, prev, prevPart});
    if (state.hist.length > 200) state.hist.shift();
    render();
    if (navigator.vibrate) navigator.vibrate(val === 2 ? [40,60,40] : val === 3 ? [30,40,30] : 30);
    ansageItem((val === 2 ? 'Als fehlend markiert. ' : val === 3 ? 'Teilmenge gebucht. ' : '') + ansage);
  };
  window.markPart = (key, n) => {
    const prev = st(key), prevPart = state.part[key];
    ui.pickKey = null;
    state.items[key] = 3; state.part[key] = n;
    scrollZiel = 'next';
    const ansage = packWeiter();
    state.hist.push({key, prev, prevPart});
    if (state.hist.length > 200) state.hist.shift();
    render();
    if (navigator.vibrate) navigator.vibrate([30,40,30]);
    ansageItem('Teilmenge gebucht. ' + ansage);
  };
  window.startPart = (key, qty) => { ui.pickKey = key; ui.pickVal = qty > 1 ? qty - 1 : 0; render(); };
  window.pickAdj = (delta, qty) => { ui.pickVal = Math.max(0, Math.min(qty, ui.pickVal + delta)); render(); };
  window.pickCancel = () => { ui.pickKey = null; render(); };
  window.pickOk = (key, qty) => { const v = ui.pickVal; if (v >= qty) mark(key, 1); else if (v <= 0) mark(key, 2); else markPart(key, v); };
  window.undo = () => {
    const a = state.hist.pop();
    if (!a) return;
    ui.pickKey = null;
    if (a.prev === 0) delete state.items[a.key]; else state.items[a.key] = a.prev;
    if (a.prevPart == null) delete state.part[a.key]; else state.part[a.key] = a.prevPart;
    // Zurueck zur Kiste der zurueckgenommenen Position (falls der Autowechsel schon weiter ist).
    const s = STEPS[state.step];
    if (s && s.mode === 'pack') {
      const mi = DATA.machines.findIndex(m => String(a.key).indexOf(m.device + '_') === 0);
      if (mi >= 0) state.tab = mi;
    }
    render();
    if (navigator.vibrate) navigator.vibrate(15);
  };
  window.go = i => { state.tab = i; ui.pickKey = null; springTop = true; render(); ansageItem(); };
  window.zeigeView = v => { state.view = v; springTop = true; save(); render(); };

  // ---- Formatierung ----
  const fmtM = x => (Math.round(x * 10) / 10).toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1});
  const fmtClock = sec => {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s2 = sec % 60;
    const p = n => (n < 10 ? '0' : '') + n;
    return (h ? h + ':' + p(m) : m) + ':' + p(s2);
  };
  const tmrKlasse = s => {
    if (s.fahrt) {
      const b = P.fahrzeit || 0;
      if (!b) return 'tmr';
      const m = fahrtIst() / 60;
      if (m > b * (1 + pufVon(4))) return 'tmr o';
      if (m > b) return 'tmr w';
      return 'tmr';
    }
    if (!s.soll) return 'tmr';
    const m = ist(s.id) / 60;
    if (m > s.soll * (1 + pufVon(s.nr))) return 'tmr o';
    if (m > s.soll) return 'tmr w';
    return 'tmr';
  };

  function row(m, it, cls, boxTxt, withX, qtyHtml, sub) {
    const key = k(m, it);
    const x = withX ? `<button class="xbtn" onclick="event.stopPropagation();mark('${key}',2)">\u2717 fehlt</button>` : '';
    const subH = sub ? `<span class="psub">${esc(sub)}</span>` : '';
    const q = qtyHtml != null ? qtyHtml : ('\u00d7 ' + it.qty);
    return `<li class="${cls}" onclick="mark('${key}',${cls ? 0 : 1})"><span class="box">${boxTxt}</span><span class="sel">${selTxt(it)}</span><span class="nm">${esc(it.name)}<span class="art">${esc(it.art)}</span>${subH}</span>${x}<span class="qty">${q}</span></li>`;
  }
  function partPicker(it, key) {
    const v = ui.pickVal, mv = it.qty - v;
    return `<div class="partpick">
      <div class="pq">Wie viele <b>tats\u00e4chlich</b>? (Bedarf ${it.qty})</div>
      <div class="pickrow"><button class="stepbtn" ${v <= 0 ? 'disabled' : ''} onclick="pickAdj(-1,${it.qty})">\u2212</button><span class="pickval">${v}</span><button class="stepbtn" ${v >= it.qty ? 'disabled' : ''} onclick="pickAdj(1,${it.qty})">+</button></div>
      <div class="pickmiss">${mv > 0 ? ('\u26a0 ' + mv + ' fehlt \u2013 wird gemeldet') : '\u2705 alles vorhanden'}</div>
      <div class="pickact"><button class="pickok" onclick="pickOk('${key}',${it.qty})">\u2713 \u00dcbernehmen</button><button class="pickcancel" onclick="pickCancel()">Abbrechen</button></div>
    </div>`;
  }

  // ---- Renderer ----
  function timerStreifen(s) {
    const sollTxt = s.fahrt
      ? `Fahrzeit gesamt<br><b>${fmtM(fahrtIst() / 60)}</b> / ${fmtM(P.fahrzeit || 0)} min`
      : (s.soll ? (s.ev ? `Soll je Ereignis<br><b>${fmtM(s.soll)} min</b>` : `Soll<br><b>${fmtM(s.soll)} min</b>`) : '');
    const pauseH = state.pausiert
      ? `<div class="pausenote" id="pausenote">\u23f8 PAUSE \u2013 Timer angehalten (${fmtM(pauseIst() / 60)} min) \u00b7 \u25b6 zum Weitermachen</div>`
      : '';
    return `<div class="tmrrow"><span class="${tmrKlasse(s)}" id="tmr">${fmtClock(ist(s.id))}</span><span class="soll">${sollTxt}</span></div>${pauseH}`;
  }
  function packUI(h) {
    const FEHLTN = DATA.machines.length;
    if (state.tab >= FEHLTN) state.tab = 0;
    h += '<div class="tabs">' + DATA.machines.map((mm, i) => {
      const r = mm.items.filter(it => !st(k(mm, it))).length;
      const rStk = mm.items.reduce((a, it) => a + (st(k(mm, it)) ? 0 : it.qty), 0);
      const cls = 'tab' + (i === state.tab ? ' act' : '') + (r === 0 ? ' done' : '');
      return `<div class="${cls}" onclick="go(${i})">${i + 1}\u00b7${esc(mm.label)}${r === 0 ? ' \u2713' : ' (' + rStk + ' Stk.)'}</div>`;
    }).join('') + '</div>';
    const m = DATA.machines[state.tab];
    const open = m.items.filter(it => !st(k(m, it)));
    const miss = m.items.filter(it => st(k(m, it)) === 2);
    const partial = m.items.filter(it => st(k(m, it)) === 3);
    const done = m.items.filter(it => st(k(m, it)) === 1);
    if (open.length) {
      const it = open[0], key = k(m, it);
      h += `<div class="now" id="nextitem">
        <div class="mhead"><span class="kbadge">Kiste ${state.tab + 1}</span><span class="mname">${esc(m.label)}</span></div>
        <div class="lbl">JETZT PACKEN</div>
        <div class="nowrow"><span class="nowsel">${selTxt(it)}</span><span class="nowqty">\u00d7 ${it.qty}</span></div>
        <div class="nowname">${esc(it.name)}</div><div class="nowart">${esc(it.art)}</div>`;
      if (ui.pickKey === key) h += partPicker(it, key);
      else h += `<div class="btnrow"><button class="nowbtn" onclick="mark('${key}',1)">\u2713 Gepackt</button></div>
        <div class="btnrow2"><button class="partbtn" onclick="startPart('${key}',${it.qty})">\u2248 Teilmenge</button><button class="missbtn" onclick="mark('${key}',2)">\u2717 Nicht vorr\u00e4tig</button></div>`;
      h += `</div>`;
    } else {
      const fehltN = miss.length + partial.length;
      h += fehltN
        ? `<div class="alldone w">\u26a0 Kiste ${state.tab + 1} fertig \u2013 ${fehltN} Position(en) mit Fehlmenge (siehe \u201eFehlt\u201c)</div>`
        : `<div class="alldone">\u2705 Kiste ${state.tab + 1} \u201e${esc(m.label)}\u201c komplett!</div>`;
    }
    if (open.length > 1)
      h += '<h3>Noch offen</h3><ul>' + open.slice(1).map(it => row(m, it, '', '', true)).join('') + '</ul>';
    if (partial.length)
      h += '<h3 class="warn">Teilweise gepackt</h3><ul>' + partial.map(it => row(m, it, 'miss', '\u00bd', false, '\u00d7 ' + missQty(m, it), partOf(k(m, it)) + ' gepackt \u00b7 Rest fehlt')).join('') + '</ul>';
    if (miss.length)
      h += '<h3 class="warn">Nicht vorr\u00e4tig</h3><ul>' + miss.map(it => row(m, it, 'miss', '!', false)).join('') + '</ul>';
    if (done.length)
      h += '<h3>Gepackt</h3><ul>' + done.map(it => row(m, it, 'done', '\u2713', false)).join('') + '</ul>';
    return h;
  }
  function fillUI(h, s) {
    const m = DATA.machines[s.mi];
    h += `<div class="fillhint">Alles rein wie gepackt. Passt etwas <b>nicht rein</b> oder stimmt der Bestand nicht? Direkt hier korrigieren: \u2248 = Teilmenge, \u2717 = fehlt komplett \u2013 die Abweichung landet in der Fehlt-Meldung und der Bestand wird korrigiert.</div>`;
    let nextFrei = true;
    h += '<ul>' + m.items.map(it => {
      const key = k(m, it), s2 = st(key);
      if (ui.pickKey === key) return `<li style="display:block">${partPicker(it, key)}</li>`;
      if (s2 === 2) return row(m, it, 'miss', '!', false);
      if (s2 === 3) return row(m, it, 'miss', '\u00bd', false, '\u00d7 ' + missQty(m, it), partOf(key) + ' \u00b7 Rest fehlt');
      const btns = `<button class="xbtn" onclick="event.stopPropagation();startPart('${key}',${it.qty})">\u2248</button><button class="xbtn" onclick="event.stopPropagation();mark('${key}',2)">\u2717</button>`;
      const cls = s2 === 1 ? 'done' : '';
      const idH = (s2 === 0 && nextFrei) ? ' id="nextitem"' : '';
      if (s2 === 0 && nextFrei) nextFrei = false;
      return `<li class="${cls}"${idH} onclick="mark('${key}',${s2 ? 0 : 1})"><span class="box">${s2 === 1 ? '\u2713' : ''}</span><span class="sel">${selTxt(it)}</span><span class="nm">${esc(it.name)}<span class="art">${esc(it.art)}</span></span>${btns}<span class="qty">\u00d7 ${it.qty}</span></li>`;
    }).join('') + '</ul>';
    return h;
  }
  function ablaufListe(h) {
    let grp = null;
    h += '<h3>Ablauf</h3><div class="steps">';
    STEPS.forEach((s, i) => {
      const g = s.dev != null ? s.sub : ((s.ort || (s.nr >= 13 && s.nr <= 16)) ? s.sub : (s.fahrt ? null : 'Lager'));
      if (g !== grp && g !== null) { h += `</div><div class="sgroup">${esc(g)}</div><div class="steps">`; grp = g; }
      const sec = ist(s.id);
      const cls = 'srow' + (i === state.step ? ' cur' : '') + (state.done[s.id] ? ' ok' : '') + (state.skipd[s.id] ? ' sk' : '');
      const zeit = sec >= 1 ? fmtClock(sec) : (s.soll ? '~' + fmtM(s.soll) + "'" : '');
      h += `<div class="${cls}" onclick="springe(${i})"><span class="snr">${s.nr}</span><span class="snm">${esc(s.t)}${s.dev == null && s.sub ? '<small>' + esc(s.sub) + '</small>' : ''}</span><span class="szeit">${zeit}</span></div>`;
    });
    h += '</div>';
    h += '<button class="report z" onclick="reportZeit()">\u23f1 Zeit-Protokoll teilen</button>';
    return h;
  }

  // Zeit-Uebersicht je Punkt: Ist, Soll ohne Puffer, Soll mit Puffer (Selbstkontrolle).
  function zeitZeilen() {
    const zeilen = [];
    for (let nr = 1; nr <= 18; nr++) {
      const t = T(nr); if (!t) continue;
      const steps = STEPS.filter(s => s.nr === nr);
      if (!steps.length) continue;
      const istM = steps.reduce((a, s) => a + ist(s.id), 0) / 60;
      let soll;
      if (nr === 4) soll = P.fahrzeit || 0;
      else if (nr === 8) soll = (P.muenz || 0) * sollMin(8, 1);
      else if (nr === 9) soll = (P.todos || 0) * sollMin(9, 1);
      else soll = steps.reduce((a, s) => a + (s.soll || 0), 0);
      zeilen.push({nr, name: titel(nr), anz: steps.length, ist: istM,
                   soll, mp: soll * (1 + pufVon(nr)), annahme: (nr === 8 || nr === 9)});
    }
    // Feste Kontroll-Schritte ohne Soll (String-Nr., z. B. "3a"/"3b") aggregiert einreihen.
    const extra = {};
    STEPS.forEach(s => {
      if (typeof s.nr !== 'string') return;
      if (!extra[s.nr]) extra[s.nr] = {nr: s.nr, name: s.t, anz: 0, ist: 0, soll: 0, mp: 0, annahme: false, ohneSoll: true};
      extra[s.nr].anz++;
      extra[s.nr].ist += ist(s.id) / 60;
    });
    Object.keys(extra).sort().forEach(k => {
      const zeile = extra[k];
      const pos = zeilen.findIndex(z => typeof z.nr === 'number' && z.nr > parseInt(zeile.nr, 10));
      if (pos < 0) zeilen.push(zeile); else zeilen.splice(pos, 0, zeile);
    });
    return zeilen;
  }
  function zeitUebersicht() {
    const zeilen = zeitZeilen();
    const sollOhne = zeilen.reduce((a, z) => a + z.soll, 0);
    const sollMit = zeilen.reduce((a, z) => a + z.mp, 0);
    const istM = istGes() / 60;
    const istKl = m => m > sollMit ? 'istover' : m > sollOhne ? 'istwarn' : 'istok';
    let h = '<h3>Zeit-\u00dcbersicht \u2013 Selbstkontrolle</h3><div class="steps">';
    h += `<div class="srow kopf"><span class="snr"></span><span class="snm">T\u00e4tigkeit</span><span class="z3">Ist</span><span class="z3">Soll</span><span class="z3">+Puffer</span></div>`;
    for (const z of zeilen) {
      const kl = z.ohneSoll ? (z.ist > 0 ? 'istok' : '') : (z.ist > z.mp ? 'istover' : z.ist > z.soll ? 'istwarn' : (z.ist > 0 ? 'istok' : ''));
      h += `<div class="srow"><span class="snr">${z.nr}</span><span class="snm">${esc(z.name)}${z.annahme ? '<small>Soll = Tour-Annahme</small>' : (z.anz > 1 ? '<small>' + z.anz + ' Schritte</small>' : '')}</span>` +
        `<span class="z3 ${kl}">${fmtM(z.ist)}</span><span class="z3">${z.ohneSoll ? '\u2013' : fmtM(z.soll)}</span><span class="z3">${z.ohneSoll ? '\u2013' : fmtM(z.mp)}</span></div>`;
    }
    h += `<div class="srow summe"><span class="snr">\u03a3</span><span class="snm">GESAMT (min)</span>` +
      `<span class="z3 ${istKl(istM)}">${fmtM(istM)}</span><span class="z3">${fmtM(sollOhne)}</span><span class="z3">${fmtM(sollMit)}</span></div>`;
    h += `<div class="srow"><span class="snr">\u23f8</span><span class="snm">Pausen<small>laufen separat, z\u00e4hlen nicht ins Ist</small></span>` +
      `<span class="z3">${fmtM(pauseIst() / 60)}</span><span class="z3">\u2013</span><span class="z3">\u2013</span></div>`;
    h += '</div>';
    h += '<div class="hint">Ist gr\u00fcn = im Soll \u00b7 gelb = \u00fcber Soll \u00b7 rot = \u00fcber Soll + Puffer. Soll = Sollzeit je T\u00e4tigkeit \u00d7 heutige Mengen; Nr. 4 = Fahrzeit-Budget der Tour; Nr. 8/9 nach Tour-Annahme.</div>';
    h += '<button class="report z" onclick="reportZeit()">\u23f1 Zeit-Protokoll teilen</button>';
    return h;
  }

  function render() {
    const y0 = window.scrollY || 0;
    const mc = missList().length;
    document.getElementById('navzone').innerHTML =
      `<div class="navtabs"><div class="navtab${state.view === 0 ? ' act' : ''}" onclick="zeigeView(0)">Ablauf</div>` +
      `<div class="navtab${state.view === 2 ? ' act' : ''}" onclick="zeigeView(2)">\u23f1 Zeit</div>` +
      `<div class="navtab warn${state.view === 1 ? ' act' : ''}" onclick="zeigeView(1)">\u26a0 Fehlt (${mc})</div></div>`;
    const stkGep = DATA.machines.reduce((n, m) => n + m.items.reduce((a, it) => { const s2 = st(k(m, it)); return a + (s2 === 1 ? it.qty : s2 === 3 ? Math.min(partOf(k(m, it)), it.qty) : 0); }, 0), 0);
    const stkFehlt = missList().reduce((a, e) => a + e.miss, 0);
    document.getElementById('prog').innerHTML = `<b>${stkGep}</b> / ${stkGes} St\u00fcck${stkFehlt ? ` \u00b7 <i>${stkFehlt} \u26a0</i>` : ''}`;
    document.getElementById('zeitges').innerHTML = `${state.pausiert ? '\u23f8 ' : '\u23f1 '}<b>${fmtM(istGes() / 60)}</b> / ${fmtM(sollGesMin)} min`;
    const doneN = STEPS.filter(s => state.done[s.id] || state.skipd[s.id]).length;
    document.getElementById('bar').style.width = (doneN / STEPS.length * 100) + '%';

    let h = '';
    if (state.view === 1) {
      const ml = missList();
      h += '<h3 class="warn">Fehlmengen \u2013 bitte melden</h3>';
      if (ml.length) {
        let lastI = -1;
        for (const e of ml) {
          if (e.i !== lastI) { if (lastI >= 0) h += '</ul>'; h += `<div class="mgroup">Kiste ${e.i + 1} \u00b7 ${esc(e.m.label)} <span class="dev">#${esc(e.m.device)}</span></div><ul>`; lastI = e.i; }
          const s2 = st(k(e.m, e.it));
          h += row(e.m, e.it, 'miss', s2 === 3 ? '\u00bd' : '!', false, '\u00d7 ' + e.miss, s2 === 3 ? (partOf(k(e.m, e.it)) + ' gepackt \u00b7 Rest fehlt') : '');
        }
        h += '</ul><button class="report" onclick="reportFehlt()">\ud83d\udce4 Fehlt-Liste melden</button>';
        h += '<div class="hint">\u201eMelden\u201c \u00f6ffnet das Teilen-Men\u00fc \u2013 die Liste bitte wie besprochen senden, damit der Bestand korrigiert wird. Antippen macht eine Markierung r\u00fcckg\u00e4ngig.</div>';
      } else {
        h += '<div class="alldone">\u2705 Nichts fehlt!</div>';
      }
      document.getElementById('main').innerHTML = h;
      document.getElementById('botbar').innerHTML = `<button class="stepback" onclick="zeigeView(0)">\u2039 Ablauf</button><div class="nx"><div class="lbl">FEHLT-\u00dcBERSICHT</div></div>`;
      save(); scrollNach(y0);
      return;
    }
    if (state.view === 2) {
      document.getElementById('main').innerHTML = zeitUebersicht();
      document.getElementById('botbar').innerHTML = `<button class="stepback" onclick="zeigeView(0)">\u2039 Ablauf</button><div class="nx"><div class="lbl">ZEIT-\u00dcBERSICHT</div></div>`;
      save(); scrollNach(y0);
      return;
    }
    const alleFertig = naechsterOffen(0) < 0;
    if (alleFertig) {
      h += `<div class="alldone">\u2705 Tour komplett! \u23f1 ${fmtM(istGes() / 60)} min (Soll ${fmtM(sollGesMin)} min)</div>`;
      h += '<button class="report z" onclick="reportZeit()">\u23f1 Zeit-Protokoll teilen</button>';
      if (mc) h += '<button class="report" onclick="zeigeView(1)">\u26a0 Fehlt-Liste offen (' + mc + ')</button>';
      h = ablaufListe(h);
      document.getElementById('main').innerHTML = h;
      document.getElementById('botbar').innerHTML = `<button class="stepback" onclick="stepZurueck()">\u2039 Schritt</button><div class="nx"><div class="lbl">TOUR FERTIG \ud83c\udf89</div></div>`;
      save(); scrollNach(y0);
      return;
    }
    const s = STEPS[state.step];
    h += `<div class="stepcard"><div class="shead"><span class="kbadge">Nr ${s.nr}</span><span class="stitle">${esc(s.t)}</span><span class="ssub">${esc(s.sub || '')}</span></div>${timerStreifen(s)}</div>`;
    if (s.mode === 'pack') h = packUI(h);
    else if (s.mode === 'fill') h = fillUI(h, s);
    h = ablaufListe(h);
    document.getElementById('main').innerHTML = h;

    const offen = s.mode === 'pack' ? offenPack() : 0;
    const fBtn = s.mode === 'pack' && offen > 0
      ? `<button class="fertigbtn" disabled>Noch ${offen} Positionen \u2026</button>`
      : `<button class="fertigbtn" onclick="fertig()">\u2713 Fertig \u2013 weiter</button>`;
    const sBtn = s.skip ? `<button class="skipbtn" style="flex:0 0 auto" onclick="skipStep()">\u00dcberspringen</button>` : '';
    const uBtn = (s.mode === 'pack' || s.mode === 'fill') ? `<button class="undo" id="undo" onclick="undo()" ${state.hist.length ? '' : 'disabled'}>\u21a9</button>` : '';
    const pBtn = `<button class="stepback pause${state.pausiert ? ' on' : ''}" onclick="togglePause()">${state.pausiert ? '\u25b6' : '\u23f8'}</button>`;
    document.getElementById('botbar').innerHTML = `<button class="stepback" onclick="stepZurueck()" ${state.step ? '' : 'disabled'}>\u2039</button>${pBtn}${uBtn}${sBtn}${fBtn}`;
    save();
    leisteZentrieren();
    scrollNach(y0);
  }

  // Sekunden-Tick: nur Timer-Anzeigen aktualisieren (kein Voll-Render), alle 10 s speichern.
  let tickN = 0;
  setInterval(() => {
    if (state.view !== 0) return;
    const s = STEPS[state.step];
    const el = document.getElementById('tmr');
    if (el && state.aktiv === s.id) { el.textContent = fmtClock(ist(s.id)); el.className = tmrKlasse(s); }
    const zg = document.getElementById('zeitges');
    if (zg) zg.innerHTML = `${state.pausiert ? '\u23f8 ' : '\u23f1 '}<b>${fmtM(istGes() / 60)}</b> / ${fmtM(sollGesMin)} min`;
    const pn = document.getElementById('pausenote');
    if (pn && state.pausiert) pn.textContent = '\u23f8 PAUSE \u2013 Timer angehalten (' + fmtM(pauseIst() / 60) + ' min) \u00b7 \u25b6 zum Weitermachen';
    if ((++tickN % 10) === 0) save();
  }, 1000);

  // ---- Meldungen ----
  window.reportFehlt = async () => {
    const ml = missList();
    if (!ml.length) return;
    let txt = 'FEHLT-MELDUNG Packliste ' + DATA.tour + ' ' + DATA.datum + '\n';
    let lastI = -1;
    for (const e of ml) {
      if (e.i !== lastI) { txt += '\nKiste ' + (e.i + 1) + ' \u00b7 ' + e.m.label + ' (Device ' + e.m.device + '):\n'; lastI = e.i; }
      txt += '- Anwahl ' + e.it.sel.join('+') + ' \u00b7 ' + e.miss + '\u00d7 ' + e.it.name + ' \u00b7 ' + e.it.art + ' \u00b7 [id ' + e.it.id + ']\n';
    }
    txt += '\nGesamt: ' + ml.length + ' Position(en) mit Fehlmenge \u2013 bitte Bestand korrigieren.';
    await teile('Fehlt-Meldung Packliste ' + DATA.tour, txt);
  };
  window.reportZeit = async () => {
    let txt = 'ZEIT-PROTOKOLL Lagerliste ' + DATA.tour + ' ' + DATA.datum + '\n';
    txt += 'Sollzeiten: ' + (P.quelle || '?') + ' \u00b7 Blatt ' + (P.blatt || '?') + ' \u00b7 Mengen aus dem Run des Tages\n\n';
    for (const s of STEPS) {
      const sec = ist(s.id);
      if (sec < 1 && !state.done[s.id] && !state.skipd[s.id]) continue;
      txt += '- Nr ' + s.nr + ' \u00b7 ' + s.t + (s.sub ? ' \u00b7 ' + s.sub : '') + ' \u00b7 Ist ' + fmtM(sec / 60) + ' min'
        + (s.soll ? ' \u00b7 Soll ' + fmtM(s.soll) + ' min' + (s.ev ? ' je Ereignis' : '') : '')
        + (state.skipd[s.id] ? ' \u00b7 \u00fcbersprungen' : (state.done[s.id] ? '' : ' \u00b7 offen')) + '\n';
    }
    txt += '\nBedarfs-Annahmen je Tour (im Gesamt-Soll): Nr 8 \u00d7 ' + (P.muenz || 0) + ' = ' + fmtM((P.muenz || 0) * sollMin(8, 1))
      + ' min \u00b7 Nr 9 \u00d7 ' + (P.todos || 0) + ' = ' + fmtM((P.todos || 0) * sollMin(9, 1)) + ' min\n';
    txt += 'Fahrzeit gesamt: Ist ' + fmtM(fahrtIst() / 60) + ' min \u00b7 Soll ' + fmtM(P.fahrzeit || 0) + ' min\n';
    txt += 'Pausen gesamt: ' + fmtM(pauseIst() / 60) + ' min (nicht in den Schritt-Zeiten enthalten)\n';
    txt += 'GESAMT: Ist ' + fmtM(istGes() / 60) + ' min \u00b7 Soll ' + fmtM(sollGesMin) + ' min\n';
    await teile('Zeit-Protokoll Lagerliste ' + DATA.tour, txt);
  };
  async function teile(titel, txt) {
    try { await navigator.share({title: titel, text: txt}); }
    catch(e) {
      try { await navigator.clipboard.writeText(txt); document.getElementById('heard').textContent = 'Meldung kopiert \u2013 in Chat/Mail einf\u00fcgen'; }
      catch(e2) { document.getElementById('heard').textContent = 'Teilen nicht m\u00f6glich \u2013 bitte Screenshot senden'; }
    }
  }

  // ---- Sprachausgabe / -steuerung ----
  let voiceOn = !!state.voiceOn, micOn = false, recog = null, speaking = false;
  let recLive = false, sprachEnde = 0, uGen = 0;
  const synth = window.speechSynthesis;
  const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const RATE = IOS ? 1.05 : 1.25;
  function speak(txt) {
    if (!voiceOn || !synth) return;
    try {
      // iOS spielt bei JEDEM Start der Spracherkennung einen Systemton. Deshalb laeuft die
      // Erkennung dort waehrend der Ansage weiter (Eigenecho wird per speaking/sprachEnde
      // ignoriert) statt sie zu stoppen und neu zu starten.
      if (recog && !IOS) { try { recog.abort(); } catch(e){} }
      speaking = true;
      synth.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = 'de-DE'; u.rate = RATE;
      // Generationszaehler: Callbacks einer per cancel() verworfenen Ansage duerfen die
      // Echo-Sperre der laufenden Ansage nicht vorzeitig aufheben.
      const g = ++uGen;
      u.onend = u.onerror = () => { if (g !== uGen) return; speaking = false; sprachEnde = Date.now(); if (micOn && !recLive) startRecog(); };
      synth.speak(u);
    } catch(e) { speaking = false; }
  }
  const sprich = it => it.qty + ' mal ' + it.name.replace(/\(.*?\)/g, ' ').replace(/\s+/g, ' ').trim();
  const aktuelleMaschine = () => {
    const s = STEPS[state.step];
    if (s.mode === 'pack') return DATA.machines[state.tab];
    if (s.mode === 'fill') return DATA.machines[s.mi];
    return null;
  };
  function ansageItem(prefix) {
    if (!voiceOn || state.view !== 0) return;
    const m = aktuelleMaschine();
    if (!m) return;
    const open = m.items.filter(it => !st(k(m, it)));
    speak((prefix || '') + (open.length ? sprich(open[0]) : 'Fertig hier.'));
  }
  function ansageSchritt() {
    if (!voiceOn) return;
    const s = STEPS[state.step];
    if (s.mode === 'pack' || s.mode === 'fill') { speak('Nummer ' + s.nr + '. ' + s.t + '. '); setTimeout(() => ansageItem(), 50); }
    else speak('Nummer ' + s.nr + '. ' + s.t + (s.sub ? '. ' + s.sub : '') + '.');
  }
  window.toggleVoice = () => {
    voiceOn = !voiceOn; state.voiceOn = voiceOn; save(); updVB();
    if (voiceOn) ansageSchritt(); else if (synth) synth.cancel();
  };
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function startRecog() {
    if (!SR || !micOn) return;
    try {
      recog = new SR();
      recog.lang = 'de-DE'; recog.continuous = true; recog.interimResults = false;
      recog.onstart = () => { recLive = true; };
      recog.onresult = ev => {
        // Eigene Ansage (und deren Nachlauf) nicht als Kommando werten.
        if (speaking || Date.now() - sprachEnde < 1000) return;
        const t = ev.results[ev.results.length - 1][0].transcript.toLowerCase().trim();
        document.getElementById('heard').textContent = '\u201e' + t + '\u201c';
        handleVoice(t);
      };
      recog.onend = () => { recLive = false; if (micOn && !speaking) { try { recog.start(); recLive = true; } catch(e){} } };
      recog.onerror = e => {
        recLive = false;
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          micOn = false; updVB();
          document.getElementById('heard').textContent = 'Mikrofon nicht erlaubt';
        }
      };
      recog.start();
      recLive = true;
    } catch(e) {
      // Synchroner Startfehler: sichtbar machen statt still ein "aktives" Mikro anzuzeigen.
      recLive = false; micOn = false; updVB();
      document.getElementById('heard').textContent = 'Mikro-Start fehlgeschlagen \u2013 \ud83c\udfa4 erneut antippen';
    }
  }
  function handleVoice(t) {
    if (state.view !== 0) { if (/zur\u00fcck/.test(t)) zeigeView(0); return; }
    if (/\bpause\b/.test(t)) { if (!state.pausiert) togglePause(); return; }
    if (state.pausiert) { if (/weiter|fortsetzen/.test(t)) togglePause(); return; }
    const s = STEPS[state.step];
    const m = aktuelleMaschine();
    if (/schritt fertig|fertig weiter|weiter jetzt/.test(t)) { fertig(); return; }
    if (/\u00fcberspringen/.test(t)) { if (s.skip) skipStep(); return; }
    if (m) {
      const open = m.items.filter(it => !st(k(m, it)));
      if (/zur\u00fcck|r\u00fcckg\u00e4ngig/.test(t)) undo();
      else if (/fehlt|nicht da|nicht vorr\u00e4tig|nicht verf\u00fcgbar|leer/.test(t)) { if (open.length) mark(k(m, open[0]), 2); }
      else if (/gepackt|weiter|okay|erledigt|\bok\b|hab ich/.test(t)) { if (open.length) mark(k(m, open[0]), 1); else fertig(); }
      else if (/wiederhol|noch ?mal|was war das/.test(t)) ansageItem();
      else if (/n\u00e4chste kiste/.test(t)) { if (s.mode === 'pack' && state.tab < DATA.machines.length - 1) go(state.tab + 1); }
    } else {
      // Kurz-Aeusserungen verlangen: eine (echote) lange Schritt-Ansage wie
      // "Nummer 18. Abschliessen und fertig." darf den Schritt nicht abschliessen.
      if (/zur\u00fcck/.test(t)) stepZurueck();
      else if (t.length < 20 && /fertig|erledigt|weiter|okay|\bok\b/.test(t)) fertig();
      else if (/wiederhol|noch ?mal/.test(t)) ansageSchritt();
    }
  }
  window.toggleMic = () => {
    const heard = document.getElementById('heard');
    if (!SR) { heard.textContent = 'Spracherkennung hier nicht verf\u00fcgbar'; return; }
    if (!window.isSecureContext) { heard.textContent = 'Mikro braucht HTTPS-Seite'; return; }
    micOn = !micOn; updVB();
    if (micOn) {
      if (!voiceOn) { voiceOn = true; state.voiceOn = true; save(); }
      heard.textContent = 'H\u00f6re zu \u2026 (\u201egepackt\u201c, \u201efehlt\u201c, \u201efertig\u201c)';
      startRecog(); updVB();
    } else { heard.textContent = ''; if (recog) { try { recog.abort(); } catch(e){} } }
  };
  function updVB() {
    document.getElementById('vb').className = 'vbtn' + (voiceOn ? ' on' : '');
    document.getElementById('mb').className = 'vbtn mic' + (micOn ? ' on' : '');
  }
  updVB();
  if ('wakeLock' in navigator) { const wl = () => navigator.wakeLock.request('screen').catch(()=>{}); wl(); document.addEventListener('visibilitychange', () => { if (!document.hidden) wl(); }); }
  save();
  render();
}

// ==================== Klassische Packliste (Fallback ohne Ablauf-Daten) ====================
function legacyApp(DATA) {
kennzeichneAlter(DATA, 'Packliste');
const KEY = 'packliste_' + DATA.datum + '_' + DATA.tour;
let state = JSON.parse(LS.getItem(KEY) || '{"items":{},"part":{},"hist":[],"tab":0}');
if (!state.items) state = {items:{},part:{},hist:[],tab:0};
if (!state.part) state.part = {};
const FEHLT = DATA.machines.length;
if (typeof state.tab !== 'number' || state.tab < 0 || state.tab > FEHLT) state.tab = 0;
const save = () => LS.setItem(KEY, JSON.stringify(state));
const k = (m,it) => m.device + '_' + it.id;
const selTxt = it => it.sel.join('+') || '\u2013';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Status je Position: 0 offen, 1 komplett gepackt, 2 nichts vorraetig, 3 Teilmenge gepackt.
const st = key => state.items[key] || 0;
const partOf = key => state.part[key] || 0;
// Fehlmenge (fuer Fehlt-Tab + Meldung + Korrektur): status 2 = ganze Menge, status 3 = Rest.
const missQty = (m,it) => { const s = st(k(m,it)); return s===2 ? it.qty : s===3 ? Math.max(0, it.qty - partOf(k(m,it))) : 0; };
const rest = m => m.items.filter(it => !st(k(m,it))).length;
const missList = () => DATA.machines.flatMap((m,i) => m.items.filter(it => missQty(m,it) > 0).map(it => ({m, i, it, miss: missQty(m,it)})));
let ui = {pickKey:null, pickVal:0};
// Scroll-Verhalten: nach dem Abhaken zum naechsten offenen Punkt (#nextitem),
// sonst Position halten; nur Kisten-/Tab-Wechsel springt nach oben.
let springTop = true, scrollZiel = null;

function row(m, it, cls, boxTxt, withX, qtyHtml, sub) {
  const key = k(m,it);
  const x = withX ? `<button class="xbtn" onclick="event.stopPropagation();mark('${key}',2)">\u2717 fehlt</button>` : '';
  const subH = sub ? `<span class="psub">${esc(sub)}</span>` : '';
  const q = qtyHtml != null ? qtyHtml : ('\u00d7 ' + it.qty);
  return `<li class="${cls}" onclick="mark('${key}',${cls?0:1})"><span class="box">${boxTxt}</span><span class="sel">${selTxt(it)}</span><span class="nm">${esc(it.name)}<span class="art">${esc(it.art)}</span>${subH}</span>${x}<span class="qty">${q}</span></li>`;
}

function render() {
  const y0 = window.scrollY || 0;
  if (!DATA.machines.length) {
    document.getElementById('main').innerHTML = '<div class="nodata">F\u00fcr die ' + esc(DATA.tour) + ' ist noch keine Liste ver\u00f6ffentlicht.<br>Sie erscheint hier automatisch nach der n\u00e4chsten Bef\u00fcllung.</div>';
    document.getElementById('prog').textContent = ''; document.getElementById('navzone').innerHTML = '';
    document.getElementById('nx').innerHTML = ''; document.getElementById('undo').disabled = true;
    if (springTop) { window.scrollTo(0,0); springTop = false; }
    return;
  }
  const mc = missList().length;
  document.getElementById('navzone').innerHTML = '<div class="tabs" id="tabs"></div>';
  document.getElementById('tabs').innerHTML = DATA.machines.map((mm,i) => {
    const r = rest(mm);
    // Offene Stueck je Kiste (passend zur Stueckzahl im Kopf).
    const rStk = mm.items.reduce((a,it)=>a+(st(k(mm,it))?0:it.qty),0);
    const cls = 'tab' + (i===state.tab?' act':'') + (r===0?' done':'');
    return `<div class="${cls}" onclick="go(${i})">${i+1}\u00b7${esc(mm.label)}${r===0?' \u2713':' ('+rStk+' Stk.)'}</div>`;
  }).join('') + `<div class="tab warn${state.tab===FEHLT?' act':''}" onclick="go(${FEHLT})">\u26a0 Fehlt (${mc})</div>`;

  const allT = DATA.machines.reduce((n,m)=>n+m.items.length,0);
  const offen = DATA.machines.reduce((n,m)=>n+m.items.filter(it=>!st(k(m,it))).length,0);
  // Stueckzahl oben rechts: gepackte Stueck / Bedarf gesamt.
  // Status 1 = ganze Menge, Status 3 = Teilmenge, Status 2 = nichts gepackt.
  const stkGes = DATA.machines.reduce((n,m)=>n+m.items.reduce((a,it)=>a+it.qty,0),0);
  const stkGep = DATA.machines.reduce((n,m)=>n+m.items.reduce((a,it)=>{const s=st(k(m,it));return a+(s===1?it.qty:s===3?Math.min(partOf(k(m,it)),it.qty):0);},0),0);
  // Fehlende Stueck = Summe der Fehlmengen (wie Fehlt-Tab/Meldung), nur anzeigen wenn > 0.
  const stkFehlt = missList().reduce((a,e)=>a+e.miss,0);
  document.getElementById('prog').innerHTML = `<b>${stkGep}</b> / ${stkGes} St\u00fcck${stkFehlt?` \u00b7 <i>${stkFehlt} \u26a0</i>`:''}`;
  document.getElementById('bar').style.width = allT ? ((allT-offen)/allT*100)+'%' : '100%';
  document.getElementById('undo').disabled = !state.hist.length;

  let h = '';
  if (state.tab === FEHLT) {
    const ml = missList();
    h += '<h3 class="warn">Fehlmengen \u2013 bitte melden</h3>';
    if (ml.length) {
      let lastI = -1;
      for (const e of ml) {
        if (e.i !== lastI) { if (lastI >= 0) h += '</ul>'; h += `<div class="mgroup">Kiste ${e.i+1} \u00b7 ${esc(e.m.label)} <span class="dev">#${esc(e.m.device)}</span></div><ul>`; lastI = e.i; }
        const s = st(k(e.m,e.it));
        h += row(e.m, e.it, 'miss', s===3?'\u00bd':'!', false, '\u00d7 ' + e.miss, s===3 ? (partOf(k(e.m,e.it)) + ' gepackt \u00b7 Rest fehlt') : '');
      }
      h += '</ul><button class="report" onclick="reportFehlt()">\ud83d\udce4 Fehlt-Liste melden</button>';
      h += '<div class="hint">\u201eMelden\u201c \u00f6ffnet das Teilen-Men\u00fc \u2013 die Liste bitte wie besprochen senden, damit der Bestand korrigiert wird. Antippen macht eine Markierung r\u00fcckg\u00e4ngig.</div>';
    } else {
      h += '<div class="alldone">\u2705 Nichts fehlt!</div>';
    }
  } else {
    const m = DATA.machines[state.tab];
    const open = m.items.filter(it => !st(k(m,it)));
    const miss = m.items.filter(it => st(k(m,it))===2);
    const partial = m.items.filter(it => st(k(m,it))===3);
    const done = m.items.filter(it => st(k(m,it))===1);
    if (open.length) {
      const it = open[0], key = k(m,it);
      h += `<div class="now" id="nextitem">
        <div class="mhead"><span class="kbadge">Kiste ${state.tab+1}</span><span class="mname">${esc(m.label)}</span></div>
        <div class="lbl">JETZT PACKEN</div>
        <div class="nowrow"><span class="nowsel">${selTxt(it)}</span><span class="nowqty">\u00d7 ${it.qty}</span></div>
        <div class="nowname">${esc(it.name)}</div><div class="nowart">${esc(it.art)}</div>`;
      if (ui.pickKey === key) {
        const v = ui.pickVal, mv = it.qty - v;
        h += `<div class="partpick">
          <div class="pq">Wie viele <b>gepackt</b>? (Bedarf ${it.qty})</div>
          <div class="pickrow"><button class="stepbtn" ${v<=0?'disabled':''} onclick="pickAdj(-1,${it.qty})">\u2212</button><span class="pickval">${v}</span><button class="stepbtn" ${v>=it.qty?'disabled':''} onclick="pickAdj(1,${it.qty})">+</button></div>
          <div class="pickmiss">${mv>0?('\u26a0 '+mv+' fehlt \u2013 wird gemeldet'):'\u2705 alles vorhanden'}</div>
          <div class="pickact"><button class="pickok" onclick="pickOk('${key}',${it.qty})">\u2713 \u00dcbernehmen</button><button class="pickcancel" onclick="pickCancel()">Abbrechen</button></div>
        </div>`;
      } else {
        h += `<div class="btnrow"><button class="nowbtn" onclick="mark('${key}',1)">\u2713 Gepackt</button></div>
          <div class="btnrow2"><button class="partbtn" onclick="startPart('${key}',${it.qty})">\u2248 Teilmenge</button><button class="missbtn" onclick="mark('${key}',2)">\u2717 Nicht vorr\u00e4tig</button></div>`;
      }
      h += `</div>`;
    } else {
      const fehltN = miss.length + partial.length;
      h += fehltN
        ? `<div class="alldone w">\u26a0 Kiste ${state.tab+1} fertig \u2013 ${fehltN} Position(en) mit Fehlmenge (siehe \u201eFehlt\u201c)</div>`
        : `<div class="alldone">\u2705 Kiste ${state.tab+1} \u201e${esc(m.label)}\u201c komplett!</div>`;
    }
    if (open.length > 1)
      h += '<h3>Noch offen</h3><ul>' + open.slice(1).map(it => row(m,it,'','',true)).join('') + '</ul>';
    if (partial.length)
      h += '<h3 class="warn">Teilweise gepackt</h3><ul>' + partial.map(it => row(m,it,'miss','\u00bd',false,'\u00d7 '+missQty(m,it),partOf(k(m,it))+' gepackt \u00b7 Rest fehlt')).join('') + '</ul>';
    if (miss.length)
      h += '<h3 class="warn">Nicht vorr\u00e4tig</h3><ul>' + miss.map(it => row(m,it,'miss','!',false)).join('') + '</ul>';
    if (done.length)
      h += '<h3>Gepackt</h3><ul>' + done.map(it => row(m,it,'done','\u2713',false)).join('') + '</ul>';
  }
  document.getElementById('main').innerHTML = h;

  let nh = '';
  if (state.tab !== FEHLT) {
    const m = DATA.machines[state.tab];
    const open = m.items.filter(it => !st(k(m,it)));
    const nx = open.slice(1,4);
    nh = nx.length
      ? '<div class="lbl">DANACH</div>' + nx.map(it => `<div class="nrow"><b>${selTxt(it)}</b><span class="n">${esc(it.name)}</span><span class="q">\u00d7 ${it.qty}</span></div>`).join('')
      : (open.length ? '<div class="lbl">DANACH</div><div class="nrow"><span class="n">\u2014 letzte Position dieser Kiste \u2014</span></div>' : '<div class="lbl">KISTE FERTIG \ud83c\udf89</div>');
  } else {
    nh = '<div class="lbl">FEHLT-\u00dcBERSICHT</div>';
  }
  document.getElementById('nx').innerHTML = nh;
  save();
  // Kisten-Leiste: aktiven Reiter sichtbar halten (wird je Render neu aufgebaut).
  const tb = document.querySelector('.tabs');
  const akt = tb && tb.querySelector('.tab.act');
  if (tb && akt) tb.scrollLeft = Math.max(0, akt.offsetLeft - (tb.clientWidth - akt.offsetWidth) / 2);
  if (springTop) { window.scrollTo(0,0); springTop = false; scrollZiel = null; }
  else if (scrollZiel === 'next' && document.getElementById('nextitem')) {
    scrollZiel = null;
    const el = document.getElementById('nextitem');
    const kopf = (document.querySelector('header') || {}).offsetHeight || 0;
    window.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + window.scrollY - kopf - 8));
  }
  else { scrollZiel = null; window.scrollTo(0, y0); }
}
window.go = i => { state.tab = i; ui.pickKey = null; springTop = true; render(); announce(); };
// Kiste komplett -> automatisch zur naechsten Kiste mit offenen Positionen.
function packWeiter() {
  if (state.tab >= FEHLT) return '';
  const m = DATA.machines[state.tab];
  if (!m || m.items.some(it => !st(k(m, it)))) return '';
  for (let d = 1; d < DATA.machines.length; d++) {
    const j = (state.tab + d) % DATA.machines.length;
    if (DATA.machines[j].items.some(it => !st(k(DATA.machines[j], it)))) {
      state.tab = j;
      return 'Kiste ' + (j + 1) + '. ';
    }
  }
  return '';
}
window.mark = (key, val) => {
  const prev = st(key), prevPart = state.part[key];
  ui.pickKey = null;
  let ansage = '';
  if (val === 0) { delete state.items[key]; delete state.part[key]; }
  else { state.items[key] = val; if (val !== 3) delete state.part[key]; scrollZiel = 'next'; ansage = packWeiter(); }
  state.hist.push({key, prev, prevPart});
  if (state.hist.length > 200) state.hist.shift();
  render();
  if (navigator.vibrate) navigator.vibrate(val===2 ? [40,60,40] : val===3 ? [30,40,30] : 30);
  announce((val===2 ? 'Als fehlend markiert. ' : val===3 ? 'Teilmenge gebucht. ' : '') + ansage);
};
window.markPart = (key, n) => {
  const prev = st(key), prevPart = state.part[key];
  ui.pickKey = null;
  state.items[key] = 3; state.part[key] = n;
  scrollZiel = 'next';
  const ansage = packWeiter();
  state.hist.push({key, prev, prevPart});
  if (state.hist.length > 200) state.hist.shift();
  render();
  if (navigator.vibrate) navigator.vibrate([30,40,30]);
  announce('Teilmenge gebucht. ' + ansage);
};
window.startPart = (key, qty) => { ui.pickKey = key; ui.pickVal = qty > 1 ? qty - 1 : 0; render(); };
window.pickAdj = (delta, qty) => { ui.pickVal = Math.max(0, Math.min(qty, ui.pickVal + delta)); render(); };
window.pickCancel = () => { ui.pickKey = null; render(); };
window.pickOk = (key, qty) => { const v = ui.pickVal; if (v >= qty) mark(key, 1); else if (v <= 0) mark(key, 2); else markPart(key, v); };
window.undo = () => {
  const a = state.hist.pop();
  if (!a) return;
  ui.pickKey = null;
  if (a.prev === 0) delete state.items[a.key]; else state.items[a.key] = a.prev;
  if (a.prevPart == null) delete state.part[a.key]; else state.part[a.key] = a.prevPart;
  // Zurueck zur Kiste der zurueckgenommenen Position (falls der Autowechsel schon weiter ist).
  if (state.tab < FEHLT) {
    const mi = DATA.machines.findIndex(m => String(a.key).indexOf(m.device + '_') === 0);
    if (mi >= 0) state.tab = mi;
  }
  render();
  if (navigator.vibrate) navigator.vibrate(15);
  // "Ruecknahme" statt "Zurueckgenommen": das Echo der eigenen Ansage darf nicht
  // das Sprachkommando /zurueck/ ausloesen.
  announce('R\u00fccknahme. ');
};
window.reportFehlt = async () => {
  const ml = missList();
  if (!ml.length) return;
  let txt = 'FEHLT-MELDUNG Packliste ' + DATA.tour + ' ' + DATA.datum + '\n';
  let lastI = -1;
  for (const e of ml) {
    if (e.i !== lastI) { txt += '\nKiste ' + (e.i+1) + ' \u00b7 ' + e.m.label + ' (Device ' + e.m.device + '):\n'; lastI = e.i; }
    txt += '- Anwahl ' + e.it.sel.join('+') + ' \u00b7 ' + e.miss + '\u00d7 ' + e.it.name + ' \u00b7 ' + e.it.art + ' \u00b7 [id ' + e.it.id + ']\n';
  }
  txt += '\nGesamt: ' + ml.length + ' Position(en) mit Fehlmenge \u2013 bitte Bestand korrigieren.';
  try { await navigator.share({title: 'Fehlt-Meldung Packliste ' + DATA.tour, text: txt}); }
  catch(e) {
    try { await navigator.clipboard.writeText(txt); document.getElementById('heard').textContent = 'Meldung kopiert \u2013 in Chat/Mail einf\u00fcgen'; }
    catch(e2) { document.getElementById('heard').textContent = 'Teilen nicht m\u00f6glich \u2013 bitte Screenshot senden'; }
  }
};

let voiceOn = !!state.voiceOn, micOn = false, recog = null, speaking = false;
let recLive = false, sprachEnde = 0, uGen = 0;
const synth = window.speechSynthesis;
// iOS spricht beim gleichen rate-Wert schneller als Android -> geraeteabhaengiges Tempo
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const RATE = IOS ? 1.05 : 1.25;
function speak(txt) {
  if (!voiceOn || !synth) return;
  try {
    // iOS spielt bei jedem Start der Spracherkennung einen Systemton -> dort nicht stoppen/neu starten.
    if (recog && !IOS) { try { recog.abort(); } catch(e){} }
    speaking = true;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'de-DE'; u.rate = RATE;
    // Generationszaehler: Callbacks verworfener Ansagen heben die Echo-Sperre nicht vorzeitig auf.
    const g = ++uGen;
    u.onend = u.onerror = () => { if (g !== uGen) return; speaking = false; sprachEnde = Date.now(); if (micOn && !recLive) startRecog(); };
    synth.speak(u);
  } catch(e) { speaking = false; }
}
const sprich = it => it.qty + ' mal ' + it.name.replace(/\(.*?\)/g, ' ').replace(/\s+/g, ' ').trim();
function announce(prefix) {
  if (!voiceOn || state.tab === FEHLT || !DATA.machines.length) return;
  const m = DATA.machines[state.tab];
  const open = m.items.filter(it => !st(k(m,it)));
  speak((prefix||'') + (open.length ? sprich(open[0]) : 'Kiste ' + (state.tab+1) + ' fertig.'));
}
window.toggleVoice = () => {
  voiceOn = !voiceOn; state.voiceOn = voiceOn; save(); updVB();
  if (voiceOn) announce('Vorlesen an. '); else if (synth) synth.cancel();
};
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function startRecog() {
  if (!SR || !micOn) return;
  try {
    recog = new SR();
    recog.lang = 'de-DE'; recog.continuous = true; recog.interimResults = false;
    recog.onstart = () => { recLive = true; };
    recog.onresult = ev => {
      if (speaking || Date.now() - sprachEnde < 1000) return;
      const t = ev.results[ev.results.length-1][0].transcript.toLowerCase().trim();
      document.getElementById('heard').textContent = '\u201e' + t + '\u201c';
      handleVoice(t);
    };
    recog.onend = () => { recLive = false; if (micOn && !speaking) { try { recog.start(); recLive = true; } catch(e){} } };
    recog.onerror = e => {
      recLive = false;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        micOn = false; updVB();
        document.getElementById('heard').textContent = 'Mikrofon nicht erlaubt';
      }
    };
    recog.start();
    recLive = true;
  } catch(e) {
    recLive = false; micOn = false; updVB();
    document.getElementById('heard').textContent = 'Mikro-Start fehlgeschlagen \u2013 \ud83c\udfa4 erneut antippen';
  }
}
function handleVoice(t) {
  if (state.tab === FEHLT) { if (/zur\u00fcck/.test(t)) undo(); return; }
  const m = DATA.machines[state.tab]; if (!m) return;
  const open = m.items.filter(it => !st(k(m,it)));
  if (/zur\u00fcck|r\u00fcckg\u00e4ngig/.test(t)) undo();
  else if (/fehlt|nicht da|nicht vorr\u00e4tig|nicht verf\u00fcgbar|leer/.test(t)) { if (open.length) mark(k(m,open[0]),2); }
  else if (/gepackt|weiter|okay|erledigt|\bok\b|hab ich/.test(t)) { if (open.length) mark(k(m,open[0]),1); }
  else if (/wiederhol|noch ?mal|was war das/.test(t)) announce();
  else if (/n\u00e4chste kiste/.test(t)) { if (state.tab < DATA.machines.length-1) go(state.tab+1); }
}
window.toggleMic = () => {
  const heard = document.getElementById('heard');
  if (!SR) { heard.textContent = 'Spracherkennung hier nicht verf\u00fcgbar'; return; }
  if (!window.isSecureContext) { heard.textContent = 'Mikro braucht HTTPS-Seite'; return; }
  micOn = !micOn; updVB();
  if (micOn) {
    if (!voiceOn) { voiceOn = true; state.voiceOn = true; save(); }
    heard.textContent = 'H\u00f6re zu \u2026 (\u201egepackt\u201c, \u201efehlt\u201c, \u201ezur\u00fcck\u201c)';
    startRecog(); updVB();
  } else { heard.textContent = ''; if (recog) { try { recog.abort(); } catch(e){} } }
};
function updVB() {
  document.getElementById('vb').className = 'vbtn' + (voiceOn ? ' on' : '');
  document.getElementById('mb').className = 'vbtn mic' + (micOn ? ' on' : '');
}
updVB();
if ('wakeLock' in navigator) { const wl = () => navigator.wakeLock.request('screen').catch(()=>{}); wl(); document.addEventListener('visibilitychange', () => { if (!document.hidden) wl(); }); }
render();
}
</script>
