  }
  function packUI(h) {
    const FEHLTN = DATA.machines.length;
    if (state.tab >= FEHLTN) state.tab = 0;
    h += '<div class="tabs">' + DATA.machines.map((mm, i) => {
      const r = mm.items.filter(it => !st(k(mm, it))).length;
      const rStk = mm.items.reduce((a, it) => a + (st(k(mm, it)) ? 0 : it.qty), 0);
      const cls = 'tab' + (i === state.tab ? ' act' : '') + (r === 0 ? ' done' : '');
      return `<div class="${cls}" onclick="go(${i})">${i + 1}\u00b7${esc(mm.label)}${r === 0 ? ' \u2713' : ' (' + rStk + ' Stk.)'}</div>`;
    }).join('') + '</div>';
    const m = DATA.machines[state.tab];
    const open = m.items.filter(it => !st(k(m, it)));
    const miss = m.items.filter(it => st(k(m, it)) === 2);
    const partial = m.items.filter(it => st(k(m, it)) === 3);
    const done = m.items.filter(it => st(k(m, it)) === 1);
    if (open.length) {
      const it = open[0], key = k(m, it);
      h += `<div class="now" id="nextitem">
        <div class="mhead"><span class="kbadge">Kiste ${state.tab + 1}</span><span class="mname">${esc(m.label)}</span></div>
        <div class="lbl">JETZT PACKEN</div>
        <div class="nowrow"><span class="nowsel">${selTxt(it)}</span><span class="nowqty">\u00d7 ${it.qty}</span></div>
        <div class="nowname">${esc(it.name)}</div><div class="nowart">${esc(it.art)}</div>`;
      if (ui.pickKey === key) h += partPicker(it, key);
      else h += `<div class="btnrow"><button class="nowbtn" onclick="mark('${key}',1)">\u2713 Gepackt</button></div>
        <div class="btnrow2"><button class="partbtn" onclick="startPart('${key}',${it.qty})">\u2248 Teilmenge</button><button class="missbtn" onclick="mark('${key}',2)">\u2717 Nicht vorr\u00e4tig</button></div>`;
      h += `</div>`;
    } else {
      const fehltN = miss.length + partial.length;
      h += fehltN
        ? `<div class="alldone w">\u26a0 Kiste ${state.tab + 1} fertig \u2013 ${fehltN} Position(en) mit Fehlmenge (siehe \u201eFehlt\u201c)</div>`
        : `<div class="alldone">\u2705 Kiste ${state.tab + 1} \u201e${esc(m.label)}\u201c komplett!</div>`;
    }
    if (open.length > 1)
      h += '<h3>Noch offen</h3><ul>' + open.slice(1).map(it => row(m, it, '', '', true)).join('') + '</ul>';
    if (partial.length)
      h += '<h3 class="warn">Teilweise gepackt</h3><ul>' + partial.map(it => row(m, it, 'miss', '\u00bd', false, '\u00d7 ' + missQty(m, it), partOf(k(m, it)) + ' gepackt \u00b7 Rest fehlt')).join('') + '</ul>';
    if (miss.length)
      h += '<h3 class="warn">Nicht vorr\u00e4tig</h3><ul>' + miss.map(it => row(m, it, 'miss', '!', false)).join('') + '</ul>';
    if (done.length)
      h += '<h3>Gepackt</h3><ul>' + done.map(it => row(m, it, 'done', '\u2713', false)).join('') + '</ul>';
    return h;
  }
  function fillUI(h, s) {
    const m = DATA.machines[s.mi];
    h += `<div class="fillhint">Alles rein wie gepackt. Passt etwas <b>nicht rein</b> oder stimmt der Bestand nicht? Direkt hier korrigieren: \u2248 = Teilmenge, \u2717 = fehlt komplett \u2013 die Abweichung landet in der Fehlt-Meldung und der Bestand wird korrigiert.</div>`;
    let nextFrei = true;
    h += '<ul>' + m.items.map(it => {
      const key = k(m, it), s2 = st(key);
      if (ui.pickKey === key) return `<li style="display:block">${partPicker(it, key)}</li>`;
      if (s2 === 2) return row(m, it, 'miss', '!', false);
      if (s2 === 3) return row(m, it, 'miss', '\u00bd', false, '\u00d7 ' + missQty(m, it), partOf(key) + ' \u00b7 Rest fehlt');
      const btns = `<button class="xbtn" onclick="event.stopPropagation();startPart('${key}',${it.qty})">\u2248</button><button class="xbtn" onclick="event.stopPropagation();mark('${key}',2)">\u2717</button>`;
      const cls = s2 === 1 ? 'done' : '';
      const idH = (s2 === 0 && nextFrei) ? ' id="nextitem"' : '';
      if (s2 === 0 && nextFrei) nextFrei = false;
      return `<li class="${cls}"${idH} onclick="mark('${key}',${s2 ? 0 : 1})"><span class="box">${s2 === 1 ? '\u2713' : ''}</span><span class="sel">${selTxt(it)}</span><span class="nm">${esc(it.name)}<span class="art">${esc(it.art)}</span></span>${btns}<span class="qty">\u00d7 ${it.qty}</span></li>`;
    }).join('') + '</ul>';
    return h;
  }
  function ablaufListe(h) {
    let grp = null;
    h += '<h3>Ablauf</h3><div class="steps">';
    STEPS.forEach((s, i) => {
      const g = s.dev != null ? s.sub : ((s.ort || (s.nr >= 13 && s.nr <= 16) || s.nr === 19) ? s.sub : (s.fahrt ? null : 'Lager'));
      if (g !== grp && g !== null) { h += `</div><div class="sgroup">${esc(g)}</div><div class="steps">`; grp = g; }
      const sec = ist(s.id);
      const cls = 'srow' + (i === state.step ? ' cur' : '') + (state.done[s.id] ? ' ok' : '') + (state.skipd[s.id] ? ' sk' : '');
      // Bedarfs-Schritte mit bekannter Zahl offener Aufgaben: Soll = Anzahl x Soll je Ereignis.
      const bnZ = s.ev && typeof s.bn === 'number';
      const sollAnz = bnZ ? s.soll * s.bn : s.soll;
      const zeit = sec >= 1 ? fmtClock(sec) : (sollAnz ? '~' + fmtM(sollAnz) + "'" : (bnZ ? '\u2013' : ''));
      h += `<div class="${cls}" onclick="springe(${i})"><span class="snr">${s.nr}</span><span class="snm">${esc(s.t)}${s.dev == null && s.sub ? '<small>' + esc(s.sub) + '</small>' : ''}</span><span class="szeit">${zeit}</span></div>`;
    });
    h += '</div>';
    h += '<button class="report z" onclick="reportZeit()">\u23f1 Zeit-Protokoll senden</button>';
    return h;
  }

  // Zeit-Uebersicht je Punkt: Ist, Soll ohne Puffer, Soll mit Puffer (Selbstkontrolle).
  function zeitZeilen() {
    const zeilen = [];
    // Obergrenze = hoechste Nummer der Tour-Daten (mindestens 20), damit neue Nummern nie fehlen.
    const nrMax = Object.keys(P.taet || {}).reduce((a, k) => { const n = parseInt(k, 10); return (isFinite(n) && n > a) ? n : a; }, 20);
    for (let nr = 1; nr <= nrMax; nr++) {
      const t = T(nr); if (!t) continue;
      const steps = STEPS.filter(s => s.nr === nr);
      if (!steps.length) continue;
      const istM = steps.reduce((a, s) => a + ist(s.id), 0) / 60;
      let soll;
      if (nr === 4) soll = P.fahrzeit || 0;
      else if (nr === 8) soll = (P.muenz || 0) * sollMin(8, 1);
      else if (nr === 9) soll = (P.todos || 0) * sollMin(9, 1);
      else soll = steps.reduce((a, s) => a + (s.soll || 0), 0);
      zeilen.push({nr, name: titel(nr), anz: steps.length, ist: istM,
                   soll, mp: soll * (1 + pufVon(nr)), annahme: (nr === 8 || nr === 9),
                   ohneSoll: NE && (nr === 2 || nr === 8 || nr === 9)});
    }
    // Feste Kontroll-Schritte ohne Soll (String-Nr., z. B. "3a"/"3b") aggregiert einreihen.
    const extra = {};
    STEPS.forEach(s => {
      if (typeof s.nr !== 'string') return;
      if (!extra[s.nr]) extra[s.nr] = {nr: s.nr, name: s.t, anz: 0, ist: 0, soll: 0, mp: 0, annahme: false, ohneSoll: true};
      extra[s.nr].anz++;
      extra[s.nr].ist += ist(s.id) / 60;
    });
    Object.keys(extra).sort().forEach(k => {
      const zeile = extra[k];
      const pos = zeilen.findIndex(z => typeof z.nr === 'number' && z.nr > parseInt(zeile.nr, 10));
      if (pos < 0) zeilen.push(zeile); else zeilen.splice(pos, 0, zeile);
    });
    return zeilen;
  }
  function zeitUebersicht() {
    const zeilen = zeitZeilen();
    const sollOhne = zeilen.reduce((a, z) => a + z.soll, 0);
    const sollMit = zeilen.reduce((a, z) => a + z.mp, 0);
    const istM = istGes() / 60;
    const istKl = m => m > sollMit ? 'istover' : m > sollOhne ? 'istwarn' : 'istok';
    let h = '<h3>Zeit-\u00dcbersicht \u2013 Selbstkontrolle</h3><div class="steps">';
    h += `<div class="srow kopf"><span class="snr"></span><span class="snm">T\u00e4tigkeit</span><span class="z3">Ist</span><span class="z3">Soll</span><span class="z3">+Puffer</span></div>`;
    for (const z of zeilen) {
      const kl = z.ohneSoll ? (z.ist > 0 ? 'istok' : '') : (z.ist > z.mp ? 'istover' : z.ist > z.soll ? 'istwarn' : (z.ist > 0 ? 'istok' : ''));
      h += `<div class="srow"><span class="snr">${z.nr}</span><span class="snm">${esc(z.name)}${z.annahme ? (BD ? '<small>Soll = offene Aufgaben heute</small>' : NE ? '<small>ToDos nicht erfasst \u2013 Soll 0</small>' : '<small>Soll = Tour-Annahme</small>') : (z.anz > 1 ? '<small>' + z.anz + ' Schritte</small>' : '')}</span>` +
        `<span class="z3 ${kl}">${fmtM(z.ist)}</span><span class="z3">${z.ohneSoll ? '\u2013' : fmtM(z.soll)}</span><span class="z3">${z.ohneSoll ? '\u2013' : fmtM(z.mp)}</span></div>`;
    }
    h += `<div class="srow summe"><span class="snr">\u03a3</span><span class="snm">GESAMT (min)</span>` +
      `<span class="z3 ${istKl(istM)}">${fmtM(istM)}</span><span class="z3">${fmtM(sollOhne)}</span><span class="z3">${fmtM(sollMit)}</span></div>`;
    h += `<div class="srow"><span class="snr">\u23f8</span><span class="snm">Pausen<small>laufen separat, z\u00e4hlen nicht ins Ist</small></span>` +
      `<span class="z3">${fmtM(pauseIst() / 60)}</span><span class="z3">\u2013</span><span class="z3">\u2013</span></div>`;
    h += '</div>';
    h += '<div class="hint">Ist gr\u00fcn = im Soll \u00b7 gelb = \u00fcber Soll \u00b7 rot = \u00fcber Soll + Puffer. Soll = Sollzeit je T\u00e4tigkeit \u00d7 heutige Mengen; Nr. 4 = Fahrzeit-Budget der Tour; Nr. 8/9 ' + (BD ? 'nach den heute offenen Aufgaben' : NE ? 'mit 0 (offene Aufgaben heute nicht erfasst)' : 'nach Tour-Annahme') + '.</div>';
    h += '<button class="report z" onclick="reportZeit()">\u23f1 Zeit-Protokoll senden</button>';
    return h;
  }

  // ---- Punkte (Selbstkontrolle; reine Anzeige auf dem Geraet) ----
  // Bewertet werden nur Pflicht-Schritte (ueberspringbare zaehlen nicht). Stueck zaehlen,
  // sobald die Position bearbeitet ist - egal ob gepackt, Teilmenge oder als fehlend
  // gemeldet -, damit ehrliches Melden keine Punkte kostet.
  const PKT = {soll: 10, puffer: 5, fahrt: 20, schritt: 2, tour: 50, meld: 25};
  // Stand, zu dem gemeldet wurde: aendert sich danach etwas (andere Fehlmengen, weitere
  // Schritte), gilt die Meldung nicht mehr als aktuell und muss erneut gesendet werden.
  // Signaturen = alles, was im jeweiligen Bericht steht (sonst bliebe "gesendet" nach einer Aenderung
  // stehen): Fehlt = Fehlpositionen + Zahl nicht abgehakter Positionen; Zeit = Pruefsumme ueber den
  // vollstaendigen Berichtstext (Omsdex Runde 3).
  const textSig = t => { let h = 5381; for (let i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0; return 'v2-' + h.toString(16) + '-' + t.length; };
  const fehltSig = () => missList().map(e => k(e.m, e.it) + ':' + e.miss).join('|') + '#' + offenPack();
  const zeitSig = () => textSig(zeitBericht());
  function punkte() {
    const pflicht = STEPS.filter(s => !s.skip);
    const zeitS = pflicht.filter(s => !s.fahrt && s.soll > 0);
    let zeit = 0, imSoll = 0, imPuffer = 0;
    zeitS.forEach(s => {
      if (!state.done[s.id]) return;
      const m = ist(s.id) / 60;
      if (m <= s.soll) { zeit += PKT.soll; imSoll++; }
      else if (m <= s.soll * (1 + pufVon(s.nr))) { zeit += PKT.puffer; imPuffer++; }
    });
    const rows = [{t: 'Zeit im Soll', sub: imSoll + ' im Soll \u00b7 ' + imPuffer + ' im Puffer \u00b7 ' + zeitS.length + ' Schritte', p: zeit, max: zeitS.length * PKT.soll}];
    const fahrten = STEPS.filter(s => s.fahrt);
    if (fahrten.length && (P.fahrzeit || 0) > 0) {
      const alle = fahrten.every(s => state.done[s.id]);
      const ok = alle && fahrtIst() / 60 <= P.fahrzeit;
      rows.push({t: 'Fahrzeit im Budget', sub: alle ? (fmtM(fahrtIst() / 60) + ' / ' + fmtM(P.fahrzeit) + ' min') : 'z\u00e4hlt nach der letzten Fahrt', p: ok ? PKT.fahrt : 0, max: PKT.fahrt});
    }
    const stk = DATA.machines.reduce((n, m) => n + m.items.reduce((a, it) => a + (st(k(m, it)) ? it.qty : 0), 0), 0);
    rows.push({t: 'Bearbeitete St\u00fcck', sub: stk + ' von ' + stkGes, p: stk, max: stkGes});
    const erledigt = pflicht.filter(s => state.done[s.id]).length;
    rows.push({t: 'Erledigte Schritte', sub: erledigt + ' von ' + pflicht.length, p: erledigt * PKT.schritt, max: pflicht.length * PKT.schritt});
    const tourFertig = naechsterOffen(0) < 0;
    rows.push({t: 'Tour komplett', sub: tourFertig ? 'geschafft' : 'noch offen', p: tourFertig ? PKT.tour : 0, max: PKT.tour});
    const fehltN = missList().length;
    const fehltOk = fehltN ? state.meld.fehlt === fehltSig() : tourFertig;
    rows.push({t: 'Fehlt-Liste gemeldet', sub: fehltN ? (fehltOk ? 'gesendet' : (state.meld.fehlt ? 'ge\u00e4ndert \u2013 erneut senden (' : 'noch senden (') + fehltN + ')') : (tourFertig ? 'nichts fehlt' : 'z\u00e4hlt am Tour-Ende'), p: fehltOk ? PKT.meld : 0, max: PKT.meld});
    const zeitOk = !!state.meld.zeit && state.meld.zeit === zeitSig();
    rows.push({t: 'Zeit-Protokoll gesendet', sub: zeitOk ? 'gesendet' : (state.meld.zeit ? 'Stand ge\u00e4ndert \u2013 erneut senden' : 'noch senden'), p: zeitOk ? PKT.meld : 0, max: PKT.meld});
    return {rows, sum: rows.reduce((a, r) => a + r.p, 0), max: rows.reduce((a, r) => a + r.max, 0)};
  }
  // Senden-Ansicht (state.view = 4): beide Meldungen an einer festen, gut sichtbaren Stelle.
  // Senden geht jederzeit - auch mit offenen Schritten/Positionen (stehen im Bericht als "offen").
  function sendenAnsicht() {
    const mo = state.mailOffen;
    const frage = mo ? `<div class="sendinfo frage">\u2709 Hast du die E-Mail <b>${mo.art === 'fehlt' ? 'Fehlt-Liste' : 'Zeit-Protokoll'}</b> abgeschickt?` +
      '<div class="fragebtn"><button class="report" onclick="mailBestaetigt(true)">\u2713 Ja, abgeschickt</button><button class="report z" onclick="mailBestaetigt(false)">Nein</button></div></div>' : '';
    const ml = missList(), mc = ml.length, an = meldeAdresse(DATA);
    const offenS = STEPS.filter(s => !state.done[s.id] && !state.skipd[s.id]).length, offenP = offenPack();
    const fehltOk = mc && state.meld.fehlt === fehltSig();
    const zeitOk = !!state.meld.zeit && state.meld.zeit === zeitSig();
    const alt = fn => an ? `<button class="altlink" onclick="${fn}(true)">andere App \u2026</button>` : '';
    const stand = (ok, alt0) => ok ? '<span class="ok">\u2713 gesendet</span>' : (alt0 ? 'ge\u00e4ndert \u2013 bitte erneut senden' : 'noch nicht gesendet');
    let h = '<h3>Listen senden</h3>' + frage;
    h += `<div class="sendinfo">${sendeHinweis(DATA)}<br><br>Senden geht <b>jederzeit</b> \u2013 auch wenn noch nicht alles abgehakt ist.` +
      (offenS ? ` Gerade offen: <b>${offenS} Schritt${offenS === 1 ? '' : 'e'}</b>${offenP ? ` und <b>${offenP} Position${offenP === 1 ? '' : 'en'}</b>` : ''} \u2013 steht im Bericht als \u201eoffen\u201c.` : '') + '</div>';
    if (mc) {
      h += `<button class="report" onclick="reportFehlt()"${mo ? ' disabled' : ''}>\u26a0 Fehlt-Liste senden (${mc})</button>`;
      h += `<div class="sendst"><span>${stand(fehltOk, state.meld.fehlt)}</span>${mo ? '' : alt('reportFehlt')}</div>`;
    } else {
      h += '<div class="sendinfo">\u2705 Nichts als fehlend markiert \u2013 keine Fehlt-Liste n\u00f6tig.</div>';
    }
    h += `<button class="report z" onclick="reportZeit()"${mo ? ' disabled' : ''}>\u23f1 Zeit-Protokoll senden</button>`;
    h += `<div class="sendst"><span>${stand(zeitOk, state.meld.zeit)}</span>${mo ? '' : alt('reportZeit')}</div>`;
    return h;
  }
  function punkteAnsicht() {
    const pt = punkte();
    let h = `<div class="alldone">\u2605 ${pt.sum} Punkte<div class="pktmax">von ${pt.max} m\u00f6glichen</div></div><div class="steps">`;
    for (const r of pt.rows)
      h += `<div class="srow pkt"><span class="snm">${esc(r.t)}<small>${esc(r.sub || '')}</small></span><span class="z3 ${r.max > 0 && r.p >= r.max ? 'istok' : ''}">${r.p} / ${r.max}</span></div>`;
    h += '</div>';
    h += `<div class="hint">Die Punkte sind eine Spielwertung zur Selbstkontrolle. Je Schritt im Soll ${PKT.soll} Punkte, im Puffer ${PKT.puffer}. Fahrzeit im Budget ${PKT.fahrt}. Je bearbeitetem St\u00fcck 1 Punkt \u2013 auch wenn etwas fehlt und gemeldet wird. Je erledigtem Schritt ${PKT.schritt}, Tour komplett ${PKT.tour}, Fehlt-Liste und Zeit-Protokoll je ${PKT.meld}. \u00dcberspringbare Schritte z\u00e4hlen nicht.</div>`;
    return h;
  }

  // Punktgewinn sofort sichtbar machen: "+N" ploppt auf, der Reiter huepft kurz.
  // Beim Laden (pktAlt === null) und bei Ruecknahmen erscheint nichts.
  let pktAlt = null;
  function pktPop(plus, summe) {
    const alt = document.getElementById('pktpop');
    if (alt) alt.remove();
    document.querySelectorAll('.pktteil').forEach(x => x.remove());
    const gross = plus >= 10, riesig = plus >= 50;
    const el = document.createElement('div');
    el.id = 'pktpop';
    if (gross) el.className = 'gross';
    el.textContent = (riesig ? '\ud83c\udf89 ' : '') + '+' + plus + ' \u2605';
    const sm = document.createElement('small');
    sm.textContent = summe + ' Punkte';
    el.appendChild(sm);
    el.addEventListener('animationend', () => el.remove());
    document.body.appendChild(el);
    setTimeout(() => { if (el.parentNode) el.remove(); }, 1600);
    // Sternen-Regen ab einem groesseren Gewinn (Schritt geschafft), gross am Tour-Ende.
    const n = riesig ? 18 : gross ? 9 : 0;
    const zeichen = ['\u2605', '\u2728', '\u2b50', '\ud83c\udf89'];
    for (let i = 0; i < n; i++) {
      const p = document.createElement('span');
      p.className = 'pktteil';
      p.textContent = zeichen[i % zeichen.length];
      const w = 2 * Math.PI * i / n + Math.random() * 0.5, d = (riesig ? 70 : 45) + Math.random() * 50;
      p.style.setProperty('--dx', Math.round(Math.cos(w) * d) + 'px');
      p.style.setProperty('--dy', Math.round(Math.sin(w) * d - 20) + 'px');
      p.style.setProperty('--rot', Math.round(Math.random() * 360 - 180) + 'deg');
      p.style.color = '#ffd54a';
      p.addEventListener('animationend', () => p.remove());
      document.body.appendChild(p);
      setTimeout(() => { if (p.parentNode) p.remove(); }, 1500);
    }
    pktTon(gross, riesig);
  }
  // Kurzer Belohnungston - nur wenn die Sprachausgabe (Lautsprecher) eingeschaltet ist.
  let tonCtx = null;
  function pktTon(gross, riesig) {
    if (!voiceOn) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      tonCtx = tonCtx || new AC();
      if (tonCtx.state === 'suspended') tonCtx.resume();
      const t0 = tonCtx.currentTime;
      const noten = riesig ? [523, 659, 784, 1047, 1319] : gross ? [659, 880, 1319] : [988, 1319];
      noten.forEach((f, i) => {
        const o = tonCtx.createOscillator(), g = tonCtx.createGain(), t = t0 + i * 0.085;
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
        o.connect(g); g.connect(tonCtx.destination);
        o.start(t); o.stop(t + 0.26);
      });
    } catch(e) {}
  }

  function render() {
    const y0 = window.scrollY || 0;
    const mc = missList().length;
    const pktJetzt = punkte().sum;
    const pktPlus = (pktAlt !== null && pktJetzt > pktAlt) ? pktJetzt - pktAlt : 0;
    pktAlt = pktJetzt;
    if (pktPlus) pktPop(pktPlus, pktJetzt);
    document.getElementById('navzone').innerHTML =
      `<div class="navtabs"><div class="navtab${state.view === 0 ? ' act' : ''}" onclick="zeigeView(0)">Ablauf</div>` +
      `<div class="navtab${state.view === 2 ? ' act' : ''}" onclick="zeigeView(2)">\u23f1 Zeit</div>` +
      `<div class="navtab pkt${state.view === 3 ? ' act' : ''}${pktPlus ? ' neu' : ''}" onclick="zeigeView(3)">\u2605 ${pktJetzt}</div>` +
      `<div class="navtab warn${state.view === 1 ? ' act' : ''}" onclick="zeigeView(1)">\u26a0 Fehlt (${mc})</div>` +
      `<div class="navtab send${state.view === 4 ? ' act' : ''}" onclick="zeigeView(4)">\ud83d\udce4 Senden</div></div>`;
    const stkGep = DATA.machines.reduce((n, m) => n + m.items.reduce((a, it) => { const s2 = st(k(m, it)); return a + (s2 === 1 ? it.qty : s2 === 3 ? Math.min(partOf(k(m, it)), it.qty) : 0); }, 0), 0);
    const stkFehlt = missList().reduce((a, e) => a + e.miss, 0);
    document.getElementById('prog').innerHTML = `<b>${stkGep}</b> / ${stkGes} St\u00fcck${stkFehlt ? ` \u00b7 <i>${stkFehlt} \u26a0</i>` : ''}`;
    document.getElementById('zeitges').innerHTML = `${state.pausiert ? '\u23f8 ' : '\u23f1 '}<b>${fmtM(istGes() / 60)}</b> / ${fmtM(sollGesMin)} min`;
    const doneN = STEPS.filter(s => state.done[s.id] || state.skipd[s.id]).length;
    document.getElementById('bar').style.width = (doneN / STEPS.length * 100) + '%';

    let h = '';
    if (state.view === 1) {
      const ml = missList();
      h += '<h3 class="warn">Fehlmengen \u2013 bitte melden</h3>';
      if (ml.length) {
        let lastI = -1;
        for (const e of ml) {
          if (e.i !== lastI) { if (lastI >= 0) h += '</ul>'; h += `<div class="mgroup">Kiste ${e.i + 1} \u00b7 ${esc(e.m.label)} <span class="dev">#${esc(e.m.device)}</span></div><ul>`; lastI = e.i; }
          const s2 = st(k(e.m, e.it));
          h += row(e.m, e.it, 'miss', s2 === 3 ? '\u00bd' : '!', false, '\u00d7 ' + e.miss, s2 === 3 ? (partOf(k(e.m, e.it)) + ' gepackt \u00b7 Rest fehlt') : '');
        }
        h += '</ul><button class="report" onclick="reportFehlt()">\ud83d\udce4 Fehlt-Liste senden</button>';
        h += '<div class="hint">' + sendeHinweis(DATA) + ' Antippen macht eine Markierung r\u00fcckg\u00e4ngig.</div>';
      } else {
        h += '<div class="alldone">\u2705 Nichts fehlt!</div>';
      }
      document.getElementById('main').innerHTML = h;
      document.getElementById('botbar').innerHTML = `<button class="stepback" onclick="zeigeView(0)">\u2039 Ablauf</button><div class="nx"><div class="lbl">FEHLT-\u00dcBERSICHT</div></div>`;
      save(); scrollNach(y0);
      return;
    }
    if (state.view === 2) {
      document.getElementById('main').innerHTML = zeitUebersicht();
      document.getElementById('botbar').innerHTML = `<button class="stepback" onclick="zeigeView(0)">\u2039 Ablauf</button><div class="nx"><div class="lbl">ZEIT-\u00dcBERSICHT</div></div>`;
      save(); scrollNach(y0);
      return;
    }
    if (state.view === 3) {
      document.getElementById('main').innerHTML = punkteAnsicht();
      document.getElementById('botbar').innerHTML = `<button class="stepback" onclick="zeigeView(0)">\u2039 Ablauf</button><div class="nx"><div class="lbl">PUNKTE</div></div>`;
      save(); scrollNach(y0);
      return;
    }
    if (state.view === 4) {
      document.getElementById('main').innerHTML = sendenAnsicht();
      document.getElementById('botbar').innerHTML = `<button class="stepback" onclick="zeigeView(0)">\u2039 Ablauf</button><div class="nx"><div class="lbl">SENDEN</div></div>`;
      save(); scrollNach(y0);
      return;
    }
    const alleFertig = naechsterOffen(0) < 0;
    if (alleFertig) {
      h += `<div class="alldone">\u2705 Tour komplett! \u23f1 ${fmtM(istGes() / 60)} min (Soll ${fmtM(sollGesMin)} min)</div>`;
      h += '<button class="report z" onclick="reportZeit()">\u23f1 Zeit-Protokoll senden</button>';
      if (mc) h += '<button class="report" onclick="zeigeView(1)">\u26a0 Fehlt-Liste offen (' + mc + ')</button>';
      h = ablaufListe(h);
      document.getElementById('main').innerHTML = h;
      document.getElementById('botbar').innerHTML = `<button class="stepback" onclick="stepZurueck()">\u2039 Schritt</button><div class="nx"><div class="lbl">TOUR FERTIG \ud83c\udf89</div></div>`;
      save(); scrollNach(y0);
      return;
    }
    const s = STEPS[state.step];
    // Schritte ohne Positionsliste: Karte bleibt stehen, die Ablauf-Liste laeuft mit und
    // zeigt immer den aktuellen Punkt. Pack-/Befuell-Schritte behalten ihr Scroll-Verhalten.
    const mitlauf = !s.mode;
    setKopf();
    if (mitlauf) { springTop = false; scrollZiel = 'cur'; }
    h += `<div class="stepcard${mitlauf ? ' fest' : ''}"><div class="shead"><span class="kbadge">Nr ${s.nr}</span><span class="stitle">${esc(s.t)}</span><span class="ssub">${esc(s.sub || '')}</span></div>${timerStreifen(s)}</div>`;
    if (s.mode === 'pack') h = packUI(h);
    else if (s.mode === 'fill') h = fillUI(h, s);
    h = ablaufListe(h);
    document.getElementById('main').innerHTML = h;

    const offen = s.mode === 'pack' ? offenPack() : 0;
    const fBtn = s.mode === 'pack' && offen > 0
      ? `<button class="fertigbtn" disabled>Noch ${offen} Positionen \u2026</button>`
      : `<button class="fertigbtn" onclick="fertig()"><span>\u2713 Fertig</span> <span>\u2013 weiter</span></button>`;
    const sBtn = s.skip ? `<button class="skipbtn ic" style="flex:0 0 auto" onclick="skipStep()"><span>\u21b7</span><small>\u00dcberspringen</small></button>` : '';
    // Rueckgaengig steht in JEDEM Schritt an derselben Stelle (einheitliche Fussleiste). Es nimmt
    // nur Positions-Haken zurueck - ausserhalb der Schritte mit Positionsliste ist es deshalb
    // gesperrt, sonst wuerde unsichtbar ein Haken einer anderen Ansicht zurueckgenommen.
    const uAn = (s.mode === 'pack' || s.mode === 'fill') && state.hist.length;
    const uBtn = `<button class="undo ic" id="undo" onclick="undo()" ${uAn ? '' : 'disabled'}><span>\u21a9</span><small>R\u00fcckg\u00e4ngig</small></button>`;
    const pBtn = `<button class="stepback pause ic${state.pausiert ? ' on' : ''}" onclick="togglePause()"><span>${state.pausiert ? '\u25b6' : '\u23f8'}</span><small>${state.pausiert ? 'Weiter' : 'Pause'}</small></button>`;
    document.getElementById('botbar').classList.add('fl');
    document.getElementById('botbar').innerHTML = `<button class="stepback ic" onclick="stepZurueck()" ${state.step ? '' : 'disabled'}><span>\u2039</span><small>Zur\u00fcck</small></button>${pBtn}${uBtn}${sBtn}${fBtn}`;
    save();
    leisteZentrieren();
    scrollNach(y0);
  }

  // Sekunden-Tick: nur Timer-Anzeigen aktualisieren (kein Voll-Render), alle 10 s speichern.
  let tickN = 0;
  setInterval(() => {
    if (state.view !== 0) return;
    const s = STEPS[state.step];
    const el = document.getElementById('tmr');
    if (el && state.aktiv === s.id) { el.textContent = fmtClock(ist(s.id)); el.className = tmrKlasse(s); }
    const zg = document.getElementById('zeitges');
    if (zg) zg.innerHTML = `${state.pausiert ? '\u23f8 ' : '\u23f1 '}<b>${fmtM(istGes() / 60)}</b> / ${fmtM(sollGesMin)} min`;
    const pn = document.getElementById('pausenote');
    if (pn && state.pausiert) pn.textContent = '\u23f8 PAUSE \u2013 Timer angehalten (' + fmtM(pauseIst() / 60) + ' min) \u00b7 \u25b6 zum Weitermachen';
    if ((++tickN % 10) === 0) save();
  }, 1000);

  // ---- Meldungen ----
  // Hinweiszeile fuer nicht abgehakte Positionen: bewusst ohne "Kiste <n>", "Device", "[id"
  // und "Gesamt:" - die Fehlt-Meldung wird maschinell gelesen, diese Zeile darf dort nichts ausloesen.
  const offenHinweis = () => { const n = offenPack(); return n ? '\nHinweis: ' + n + ' Position(en) noch nicht abgehakt \u2013 nicht in dieser Meldung enthalten.' : ''; };
  window.reportFehlt = async (alt) => {
    if (state.mailOffen) { zeigeView(4); return; }  // erst die offene Rueckfrage beantworten
    const ml = missList();
    if (!ml.length) return;
    let txt = 'FEHLT-MELDUNG Packliste ' + DATA.tour + ' ' + DATA.datum + '\n';
    let lastI = -1;
    for (const e of ml) {
      if (e.i !== lastI) { txt += '\nKiste ' + (e.i + 1) + ' \u00b7 ' + e.m.label + ' (Device ' + e.m.device + '):\n'; lastI = e.i; }
      txt += '- Anwahl ' + e.it.sel.join('+') + ' \u00b7 ' + e.miss + '\u00d7 ' + e.it.name + ' \u00b7 ' + e.it.art + ' \u00b7 [id ' + e.it.id + ']\n';
    }
    txt += '\nGesamt: ' + ml.length + ' Position(en) mit Fehlmenge \u2013 bitte Bestand korrigieren.';
    txt += offenHinweis();
    const sig = fehltSig();
    meldeErgebnis('fehlt', sig, await teile('Fehlt-Meldung Packliste ' + DATA.tour + ' ' + DATA.datum, txt, alt));
  };
  // Text des Zeit-Protokolls (auch Grundlage der Gesendet-Signatur zeitSig, Omsdex Runde 3).
  function zeitBericht() {
    let txt = 'ZEIT-PROTOKOLL Lagerliste ' + DATA.tour + ' ' + DATA.datum + '\n';
    txt += 'Sollzeiten: ' + (P.quelle || '?') + ' \u00b7 Blatt ' + (P.blatt || '?') + ' \u00b7 Mengen aus dem Run des Tages\n';
    const offenS = STEPS.filter(s => !state.done[s.id] && !state.skipd[s.id]).length;
    txt += 'Stand: ' + (offenS ? 'Tour NICHT komplett \u2013 ' + offenS + ' von ' + STEPS.length + ' Schritten offen' : 'Tour komplett') + '\n\n';
    for (const s of STEPS) {
      const sec = ist(s.id);
      if (sec < 1 && !state.done[s.id] && !state.skipd[s.id]) continue;
      txt += '- Nr ' + s.nr + ' \u00b7 ' + s.t + (s.sub ? ' \u00b7 ' + s.sub : '') + ' \u00b7 Ist ' + fmtM(sec / 60) + ' min'
        + (s.soll ? ' \u00b7 Soll ' + fmtM(s.soll) + ' min \u00b7 mit Puffer ' + fmtM(s.soll * (1 + pufVon(s.nr))) + ' min' + (s.ev ? ' je Ereignis' : '') : '')
        + (state.skipd[s.id] ? ' \u00b7 \u00fcbersprungen' : (state.done[s.id] ? '' : ' \u00b7 offen')) + '\n';
    }
    // Nie begonnene Schritte: eigene Liste ohne "- Nr"-Praefix, damit der Einleser sie nicht als
    // Messung (Ist 0 min) uebernimmt.
    const nie = STEPS.filter(s => ist(s.id) < 1 && !state.done[s.id] && !state.skipd[s.id]);
    if (nie.length) {
      txt += '\nNoch nicht begonnen (offen): ' + nie.length + ' Schritt(e)\n';
      // Hoechstens 30 Zeilen, damit die E-Mail kurz bleibt (manche Mail-Apps kuerzen lange mailto-Texte).
      for (const s of nie.slice(0, 30)) txt += '  \u00b7 Nr ' + s.nr + ' \u00b7 ' + s.t + (s.sub ? ' \u00b7 ' + s.sub : '') + '\n';
      if (nie.length > 30) txt += '  \u2026 und ' + (nie.length - 30) + ' weitere\n';
    }
    txt += '\n' + (BD ? 'Bedarfs-Mengen' : NE ? 'ToDos nicht erfasst' : 'Bedarfs-Annahmen') + ' je Tour (im Gesamt-Soll): Nr 8 \u00d7 ' + (P.muenz || 0) + ' = ' + fmtM((P.muenz || 0) * sollMin(8, 1))
      + ' min \u00b7 Nr 9 \u00d7 ' + (P.todos || 0) + ' = ' + fmtM((P.todos || 0) * sollMin(9, 1)) + ' min'
      + ' \u00b7 Quelle: ' + (BD ? 'offene Aufgaben, Stand ' + String(P.bedarf.stand || '?') : NE ? 'ToDos nicht erfasst (0)' : 'Katalog-Annahme') + '\n';
    txt += 'Fahrzeit gesamt: Ist ' + fmtM(fahrtIst() / 60) + ' min \u00b7 Soll ' + fmtM(P.fahrzeit || 0) + ' min \u00b7 mit Puffer ' + fmtM((P.fahrzeit || 0) * (1 + pufVon(4))) + ' min\n';
    txt += 'Pausen gesamt: ' + fmtM(pauseIst() / 60) + ' min (nicht in den Schritt-Zeiten enthalten)\n';
    // Gesamt-Soll mit Puffer = dieselbe Summe wie in der Zeit-Uebersicht (Spalte "+Puffer").
    const sollMitPuffer = zeitZeilen().reduce((a, z) => a + z.mp, 0);
    txt += 'GESAMT: Ist ' + fmtM(istGes() / 60) + ' min \u00b7 Soll ' + fmtM(sollGesMin) + ' min \u00b7 mit Puffer ' + fmtM(sollMitPuffer) + ' min\n';
    return txt;
  }
  window.reportZeit = async (alt) => {
    if (state.mailOffen) { zeigeView(4); return; }  // erst die offene Rueckfrage beantworten
    const txt = zeitBericht();
    meldeErgebnis('zeit', textSig(txt), await teile('Zeit-Protokoll Lagerliste ' + DATA.tour + ' ' + DATA.datum, txt, alt));
  };
  // Nur echtes Teilen zaehlt sofort als gesendet. Nach dem Oeffnen des Mail-Programms fragt die
  // Senden-Ansicht "Abgeschickt?" (state.mailOffen); erst "Ja" zaehlt. Kopieren zaehlt nie.
  function meldeErgebnis(art, sig, r) {
    if (r === 'geteilt') { state.meld[art] = sig; state.mailOffen = null; }
    else if (r === 'mail') { state.mailOffen = {art, sig}; state.view = 4; springTop = true; }
    else return;
    save(); render();
  }
  window.mailBestaetigt = ja => {
    const o = state.mailOffen;
    state.mailOffen = null;
    if (ja && o && (o.art === 'fehlt' || o.art === 'zeit')) state.meld[o.art] = o.sig;
    save(); render();
  };
  // Rueckgabe wie sendeMeldung: 'mail' / 'geteilt' / 'kopiert' / false (Auswertung in meldeErgebnis).
  const teile = (titel, txt, alt) => sendeMeldung(DATA, titel, txt, alt);

  // ---- Sprachausgabe / -steuerung ----
  let voiceOn = !!state.voiceOn, micOn = false, recog = null, speaking = false;
  let recLive = false, sprachEnde = 0, uGen = 0;
  const synth = window.speechSynthesis;
  const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const RATE = IOS ? 1.05 : 1.25;
  function speak(txt) {
    if (!voiceOn || !synth) return;
    try {
      // iOS spielt bei JEDEM Start der Spracherkennung einen Systemton. Deshalb laeuft die
      // Erkennung dort waehrend der Ansage weiter (Eigenecho wird per speaking/sprachEnde
      // ignoriert) statt sie zu stoppen und neu zu starten.
      if (recog && !IOS) { try { recog.abort(); } catch(e){} }
      speaking = true;
      synth.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = 'de-DE'; u.rate = RATE;
      // Generationszaehler: Callbacks einer per cancel() verworfenen Ansage duerfen die
      // Echo-Sperre der laufenden Ansage nicht vorzeitig aufheben.
      const g = ++uGen;
      u.onend = u.onerror = () => { if (g !== uGen) return; speaking = false; sprachEnde = Date.now(); if (micOn && !recLive) startRecog(); };
      synth.speak(u);
    } catch(e) { speaking = false; }
  }
  const sprich = it => it.qty + ' mal ' + it.name.replace(/\(.*?\)/g, ' ').replace(/\s+/g, ' ').trim();
  const aktuelleMaschine = () => {
    const s = STEPS[state.step];
    if (s.mode === 'pack') return DATA.machines[state.tab];
    if (s.mode === 'fill') return DATA.machines[s.mi];
    return null;
  };
  function ansageItem(prefix) {
    if (!voiceOn || state.view !== 0) return;
    const m = aktuelleMaschine();
    if (!m) return;
    const open = m.items.filter(it => !st(k(m, it)));
    speak((prefix || '') + (open.length ? sprich(open[0]) : 'Fertig hier.'));
  }
  function ansageSchritt() {
    if (!voiceOn) return;
    const s = STEPS[state.step];
    if (s.mode === 'pack' || s.mode === 'fill') { speak('Nummer ' + s.nr + '. ' + s.t + '. '); setTimeout(() => ansageItem(), 50); }
    else speak('Nummer ' + s.nr + '. ' + s.t + (s.sub ? '. ' + s.sub : '') + '.');
  }
  window.toggleVoice = () => {
    voiceOn = !voiceOn; state.voiceOn = voiceOn; save(); updVB();
    if (voiceOn) ansageSchritt(); else if (synth) synth.cancel();
  };
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function startRecog() {
    if (!SR || !micOn) return;
    try {
      recog = new SR();
      recog.lang = 'de-DE'; recog.continuous = true; recog.interimResults = false;
      recog.onstart = () => { recLive = true; };
      recog.onresult = ev => {
        // Eigene Ansage (und deren Nachlauf) nicht als Kommando werten.
        if (speaking || Date.now() - sprachEnde < 1000) return;
        const t = ev.results[ev.results.length - 1][0].transcript.toLowerCase().trim();
        document.getElementById('heard').textContent = '\u201e' + t + '\u201c';
        handleVoice(t);
      };
      recog.onend = () => { recLive = false; if (micOn && !speaking) { try { recog.start(); recLive = true; } catch(e){} } };
      recog.onerror = e => {
        recLive = false;
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          micOn = false; updVB();
          document.getElementById('heard').textContent = 'Mikrofon nicht erlaubt';
        }
      };
      recog.start();
      recLive = true;
    } catch(e) {
      // Synchroner Startfehler: sichtbar machen statt still ein "aktives" Mikro anzuzeigen.
      recLive = false; micOn = false; updVB();
      document.getElementById('heard').textContent = 'Mikro-Start fehlgeschlagen \u2013 \ud83c\udfa4 erneut antippen';
    }
  }
  function handleVoice(t) {
    if (state.view !== 0) { if (/zur\u00fcck/.test(t)) zeigeView(0); return; }
    if (/\bpause\b/.test(t)) { if (!state.pausiert) togglePause(); return; }
    if (state.pausiert) { if (/weiter|fortsetzen/.test(t)) togglePause(); return; }
    const s = STEPS[state.step];
    const m = aktuelleMaschine();
    if (/schritt fertig|fertig weiter|weiter jetzt/.test(t)) { fertig(); return; }
    if (/\u00fcberspringen/.test(t)) { if (s.skip) skipStep(); return; }
    if (m) {
      const open = m.items.filter(it => !st(k(m, it)));
      if (/zur\u00fcck|r\u00fcckg\u00e4ngig/.test(t)) undo();
      else if (/fehlt|nicht da|nicht vorr\u00e4tig|nicht verf\u00fcgbar|leer/.test(t)) { if (open.length) mark(k(m, open[0]), 2); }
      else if (/gepackt|weiter|okay|erledigt|\bok\b|hab ich/.test(t)) { if (open.length) mark(k(m, open[0]), 1); else fertig(); }
      else if (/wiederhol|noch ?mal|was war das/.test(t)) ansageItem();
      else if (/n\u00e4chste kiste/.test(t)) { if (s.mode === 'pack' && state.tab < DATA.machines.length - 1) go(state.tab + 1); }
    } else {
      // Kurz-Aeusserungen verlangen: eine (echote) lange Schritt-Ansage wie
      // "Nummer 18. Abschliessen und fertig." darf den Schritt nicht abschliessen.
      if (/zur\u00fcck/.test(t)) stepZurueck();
      else if (t.length < 20 && /fertig|erledigt|weiter|okay|\bok\b/.test(t)) fertig();
      else if (/wiederhol|noch ?mal/.test(t)) ansageSchritt();
    }
  }
  window.toggleMic = () => {
    const heard = document.getElementById('heard');
    if (!SR) { heard.textContent = 'Spracherkennung hier nicht verf\u00fcgbar'; return; }
    if (!window.isSecureContext) { heard.textContent = 'Mikro braucht HTTPS-Seite'; return; }
    micOn = !micOn; updVB();
    if (micOn) {
      if (!voiceOn) { voiceOn = true; state.voiceOn = true; save(); }
      heard.textContent = 'H\u00f6re zu \u2026 (\u201egepackt\u201c, \u201efehlt\u201c, \u201efertig\u201c)';
      startRecog(); updVB();
    } else { heard.textContent = ''; if (recog) { try { recog.abort(); } catch(e){} } }
  };
  function updVB() {
    document.getElementById('vb').className = 'vbtn' + (voiceOn ? ' on' : '');
    document.getElementById('mb').className = 'vbtn mic' + (micOn ? ' on' : '');
  }
  updVB();
  if ('wakeLock' in navigator) { const wl = () => navigator.wakeLock.request('screen').catch(()=>{}); wl(); document.addEventListener('visibilitychange', () => { if (!document.hidden) wl(); }); }
  save();
  render();
}

// ==================== Klassische Packliste (Fallback ohne Ablauf-Daten) ====================
function legacyApp(DATA) {
kennzeichneAlter(DATA, 'Packliste');
const KEY = 'packliste_' + DATA.datum + '_' + DATA.tour;
let state = JSON.parse(LS.getItem(KEY) || '{"items":{},"part":{},"hist":[],"tab":0}');
if (!state.items) state = {items:{},part:{},hist:[],tab:0};
if (!state.part) state.part = {};
const FEHLT = DATA.machines.length;
if (typeof state.tab !== 'number' || state.tab < 0 || state.tab > FEHLT) state.tab = 0;
const save = () => LS.setItem(KEY, JSON.stringify(state));
const k = (m,it) => m.device + '_' + it.id;
const selTxt = it => it.sel.join('+') || '\u2013';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Status je Position: 0 offen, 1 komplett gepackt, 2 nichts vorraetig, 3 Teilmenge gepackt.
const st = key => state.items[key] || 0;
const partOf = key => state.part[key] || 0;
// Fehlmenge (fuer Fehlt-Tab + Meldung + Korrektur): status 2 = ganze Menge, status 3 = Rest.
const missQty = (m,it) => { const s = st(k(m,it)); return s===2 ? it.qty : s===3 ? Math.max(0, it.qty - partOf(k(m,it))) : 0; };
const rest = m => m.items.filter(it => !st(k(m,it))).length;
const missList = () => DATA.machines.flatMap((m,i) => m.items.filter(it => missQty(m,it) > 0).map(it => ({m, i, it, miss: missQty(m,it)})));
let ui = {pickKey:null, pickVal:0};
// Scroll-Verhalten: nach dem Abhaken zum naechsten offenen Punkt (#nextitem),
// sonst Position halten; nur Kisten-/Tab-Wechsel springt nach oben.
let springTop = true, scrollZiel = null;

function row(m, it, cls, boxTxt, withX, qtyHtml, sub) {
  const key = k(m,it);
  const x = withX ? `<button class="xbtn" onclick="event.stopPropagation();mark('${key}',2)">\u2717 fehlt</button>` : '';
  const subH = sub ? `<span class="psub">${esc(sub)}</span>` : '';
  const q = qtyHtml != null ? qtyHtml : ('\u00d7 ' + it.qty);
  return `<li class="${cls}" onclick="mark('${key}',${cls?0:1})"><span class="box">${boxTxt}</span><span class="sel">${selTxt(it)}</span><span class="nm">${esc(it.name)}<span class="art">${esc(it.art)}</span>${subH}</span>${x}<span class="qty">${q}</span></li>`;
}

function render() {
  const y0 = window.scrollY || 0;
  if (!DATA.machines.length) {
    document.getElementById('main').innerHTML = '<div class="nodata">F\u00fcr die ' + esc(DATA.tour) + ' ist noch keine Liste ver\u00f6ffentlicht.<br>Sie erscheint hier automatisch nach der n\u00e4chsten Bef\u00fcllung.</div>';
    document.getElementById('prog').textContent = ''; document.getElementById('navzone').innerHTML = '';
    document.getElementById('nx').innerHTML = ''; document.getElementById('undo').disabled = true;
    if (springTop) { window.scrollTo(0,0); springTop = false; }
    return;
  }
  const mc = missList().length;
  document.getElementById('navzone').innerHTML = '<div class="tabs" id="tabs"></div>';
  document.getElementById('tabs').innerHTML = DATA.machines.map((mm,i) => {
    const r = rest(mm);
    // Offene Stueck je Kiste (passend zur Stueckzahl im Kopf).
    const rStk = mm.items.reduce((a,it)=>a+(st(k(mm,it))?0:it.qty),0);
    const cls = 'tab' + (i===state.tab?' act':'') + (r===0?' done':'');
    return `<div class="${cls}" onclick="go(${i})">${i+1}\u00b7${esc(mm.label)}${r===0?' \u2713':' ('+rStk+' Stk.)'}</div>`;
  }).join('') + `<div class="tab warn${state.tab===FEHLT?' act':''}" onclick="go(${FEHLT})">\u26a0 Fehlt (${mc})</div>`;

  const allT = DATA.machines.reduce((n,m)=>n+m.items.length,0);
  const offen = DATA.machines.reduce((n,m)=>n+m.items.filter(it=>!st(k(m,it))).length,0);
  // Stueckzahl oben rechts: gepackte Stueck / Bedarf gesamt.
  // Status 1 = ganze Menge, Status 3 = Teilmenge, Status 2 = nichts gepackt.
  const stkGes = DATA.machines.reduce((n,m)=>n+m.items.reduce((a,it)=>a+it.qty,0),0);
  const stkGep = DATA.machines.reduce((n,m)=>n+m.items.reduce((a,it)=>{const s=st(k(m,it));return a+(s===1?it.qty:s===3?Math.min(partOf(k(m,it)),it.qty):0);},0),0);
  // Fehlende Stueck = Summe der Fehlmengen (wie Fehlt-Tab/Meldung), nur anzeigen wenn > 0.
  const stkFehlt = missList().reduce((a,e)=>a+e.miss,0);
  document.getElementById('prog').innerHTML = `<b>${stkGep}</b> / ${stkGes} St\u00fcck${stkFehlt?` \u00b7 <i>${stkFehlt} \u26a0</i>`:''}`;
  document.getElementById('bar').style.width = allT ? ((allT-offen)/allT*100)+'%' : '100%';
  document.getElementById('undo').disabled = !state.hist.length;

  let h = '';
  if (state.tab === FEHLT) {
    const ml = missList();
    h += '<h3 class="warn">Fehlmengen \u2013 bitte melden</h3>';
    if (ml.length) {
      let lastI = -1;
      for (const e of ml) {
        if (e.i !== lastI) { if (lastI >= 0) h += '</ul>'; h += `<div class="mgroup">Kiste ${e.i+1} \u00b7 ${esc(e.m.label)} <span class="dev">#${esc(e.m.device)}</span></div><ul>`; lastI = e.i; }
        const s = st(k(e.m,e.it));
        h += row(e.m, e.it, 'miss', s===3?'\u00bd':'!', false, '\u00d7 ' + e.miss, s===3 ? (partOf(k(e.m,e.it)) + ' gepackt \u00b7 Rest fehlt') : '');
      }
      h += '</ul><button class="report" onclick="reportFehlt()">\ud83d\udce4 Fehlt-Liste senden</button>';
      if (meldeAdresse(DATA)) h += '<div class="sendst"><span></span><button class="altlink" onclick="reportFehlt(true)">andere App \u2026</button></div>';
      h += '<div class="hint">' + sendeHinweis(DATA) + ' Senden geht jederzeit, auch wenn noch nicht alles abgehakt ist. Antippen macht eine Markierung r\u00fcckg\u00e4ngig.</div>';
    } else {
      h += '<div class="alldone">\u2705 Nichts fehlt!</div>';
    }
  } else {
    const m = DATA.machines[state.tab];
    const open = m.items.filter(it => !st(k(m,it)));
    const miss = m.items.filter(it => st(k(m,it))===2);
    const partial = m.items.filter(it => st(k(m,it))===3);
    const done = m.items.filter(it => st(k(m,it))===1);
    if (open.length) {
      const it = open[0], key = k(m,it);
      h += `<div class="now" id="nextitem">
        <div class="mhead"><span class="kbadge">Kiste ${state.tab+1}</span><span class="mname">${esc(m.label)}</span></div>
        <div class="lbl">JETZT PACKEN</div>
        <div class="nowrow"><span class="nowsel">${selTxt(it)}</span><span class="nowqty">\u00d7 ${it.qty}</span></div>
        <div class="nowname">${esc(it.name)}</div><div class="nowart">${esc(it.art)}</div>`;
      if (ui.pickKey === key) {
        const v = ui.pickVal, mv = it.qty - v;
        h += `<div class="partpick">
          <div class="pq">Wie viele <b>gepackt</b>? (Bedarf ${it.qty}) \u00b7 Zahl antippen = eintippen</div>
          <div class="pickrow"><button class="stepbtn" id="pickminus" ${v<=0?'disabled':''} onclick="pickAdj(-1,${it.qty})">\u2212</button>${pickFeld(v, key, it.qty)}<button class="stepbtn" id="pickplus" ${v>=it.qty?'disabled':''} onclick="pickAdj(1,${it.qty})">+</button></div>
          <div class="pickmiss" id="pickmiss">${mv>0?('\u26a0 '+mv+' fehlt \u2013 wird gemeldet'):'\u2705 alles vorhanden'}</div>
          <div class="pickact"><button class="pickok" onclick="pickOk('${key}',${it.qty})">\u2713 \u00dcbernehmen</button><button class="pickcancel" onclick="pickCancel()">Abbrechen</button></div>
        </div>`;
      } else {
        h += `<div class="btnrow"><button class="nowbtn" onclick="mark('${key}',1)">\u2713 Gepackt</button></div>
          <div class="btnrow2"><button class="partbtn" onclick="startPart('${key}',${it.qty})">\u2248 Teilmenge</button><button class="missbtn" onclick="mark('${key}',2)">\u2717 Nicht vorr\u00e4tig</button></div>`;
      }
      h += `</div>`;
    } else {
      const fehltN = miss.length + partial.length;
      h += fehltN
        ? `<div class="alldone w">\u26a0 Kiste ${state.tab+1} fertig \u2013 ${fehltN} Position(en) mit Fehlmenge (siehe \u201eFehlt\u201c)</div>`
        : `<div class="alldone">\u2705 Kiste ${state.tab+1} \u201e${esc(m.label)}\u201c komplett!</div>`;
    }
    if (open.length > 1)
      h += '<h3>Noch offen</h3><ul>' + open.slice(1).map(it => row(m,it,'','',true)).join('') + '</ul>';
    if (partial.length)
      h += '<h3 class="warn">Teilweise gepackt</h3><ul>' + partial.map(it => row(m,it,'miss','\u00bd',false,'\u00d7 '+missQty(m,it),partOf(k(m,it))+' gepackt \u00b7 Rest fehlt')).join('') + '</ul>';
    if (miss.length)
      h += '<h3 class="warn">Nicht vorr\u00e4tig</h3><ul>' + miss.map(it => row(m,it,'miss','!',false)).join('') + '</ul>';
    if (done.length)
      h += '<h3>Gepackt</h3><ul>' + done.map(it => row(m,it,'done','\u2713',false)).join('') + '</ul>';
  }
  document.getElementById('main').innerHTML = h;

  let nh = '';
  if (state.tab !== FEHLT) {
    const m = DATA.machines[state.tab];
    const open = m.items.filter(it => !st(k(m,it)));
    const nx = open.slice(1,4);
    nh = nx.length
      ? '<div class="lbl">DANACH</div>' + nx.map(it => `<div class="nrow"><b>${selTxt(it)}</b><span class="n">${esc(it.name)}</span><span class="q">\u00d7 ${it.qty}</span></div>`).join('')
      : (open.length ? '<div class="lbl">DANACH</div><div class="nrow"><span class="n">\u2014 letzte Position dieser Kiste \u2014</span></div>' : '<div class="lbl">KISTE FERTIG \ud83c\udf89</div>');
  } else {
    nh = '<div class="lbl">FEHLT-\u00dcBERSICHT</div>';
  }
  document.getElementById('nx').innerHTML = nh;
  save();
  // Kisten-Leiste: aktiven Reiter sichtbar halten (wird je Render neu aufgebaut).
  const tb = document.querySelector('.tabs');
  const akt = tb && tb.querySelector('.tab.act');
  if (tb && akt) tb.scrollLeft = Math.max(0, akt.offsetLeft - (tb.clientWidth - akt.offsetWidth) / 2);
  if (springTop) { window.scrollTo(0,0); springTop = false; scrollZiel = null; }
  else if (scrollZiel === 'next' && document.getElementById('nextitem')) {
    scrollZiel = null;
    const el = document.getElementById('nextitem');
    const kopf = (document.querySelector('header') || {}).offsetHeight || 0;
    window.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + window.scrollY - kopf - 8));
  }
  else { scrollZiel = null; window.scrollTo(0, y0); }
}
window.go = i => { state.tab = i; ui.pickKey = null; springTop = true; render(); announce(); };
// Kiste komplett -> automatisch zur naechsten Kiste mit offenen Positionen.
function packWeiter() {
  if (state.tab >= FEHLT) return '';
  const m = DATA.machines[state.tab];
  if (!m || m.items.some(it => !st(k(m, it)))) return '';
  for (let d = 1; d < DATA.machines.length; d++) {
    const j = (state.tab + d) % DATA.machines.length;
    if (DATA.machines[j].items.some(it => !st(k(DATA.machines[j], it)))) {
      const alt = state.tab;
      state.tab = j;
      return 'Kiste ' + (alt + 1) + ' fertig. Kiste ' + (j + 1) + '. ';
    }
  }
  return '';
}
window.mark = (key, val) => {
  const prev = st(key), prevPart = state.part[key];
  ui.pickKey = null;
  let ansage = '';
  if (val === 0) { delete state.items[key]; delete state.part[key]; }
  else { state.items[key] = val; if (val !== 3) delete state.part[key]; scrollZiel = 'next'; ansage = packWeiter(); }
  state.hist.push({key, prev, prevPart});
  if (state.hist.length > 200) state.hist.shift();
  render();
  if (navigator.vibrate) navigator.vibrate(val===2 ? [40,60,40] : val===3 ? [30,40,30] : 30);
  announce((val===2 ? 'Als fehlend markiert. ' : val===3 ? 'Teilmenge gebucht. ' : '') + ansage);
};
window.markPart = (key, n) => {
  const prev = st(key), prevPart = state.part[key];
  ui.pickKey = null;
  state.items[key] = 3; state.part[key] = n;
  scrollZiel = 'next';
  const ansage = packWeiter();
  state.hist.push({key, prev, prevPart});
  if (state.hist.length > 200) state.hist.shift();
  render();
  if (navigator.vibrate) navigator.vibrate([30,40,30]);
  announce('Teilmenge gebucht. ' + ansage);
};
window.startPart = (key, qty) => { ui.pickKey = key; ui.pickVal = qty > 1 ? qty - 1 : 0; render(); };
window.pickAdj = (delta, qty) => { ui.pickVal = Math.max(0, Math.min(qty, ui.pickVal + delta)); render(); };
window.pickSet = (el, qty) => { ui.pickVal = pickLesen(el, qty); };
window.pickCancel = () => { ui.pickKey = null; render(); };
window.pickOk = (key, qty) => { const v = ui.pickVal; if (v >= qty) mark(key, 1); else if (v <= 0) mark(key, 2); else markPart(key, v); };
window.undo = () => {
  const a = state.hist.pop();
  if (!a) return;
  ui.pickKey = null;
  if (a.prev === 0) delete state.items[a.key]; else state.items[a.key] = a.prev;
  if (a.prevPart == null) delete state.part[a.key]; else state.part[a.key] = a.prevPart;
  // Zurueck zur Kiste der zurueckgenommenen Position (falls der Autowechsel schon weiter ist).
  if (state.tab < FEHLT) {
    const mi = DATA.machines.findIndex(m => String(a.key).indexOf(m.device + '_') === 0);
    if (mi >= 0) state.tab = mi;
  }
  render();
  if (navigator.vibrate) navigator.vibrate(15);
  // "Ruecknahme" statt "Zurueckgenommen": das Echo der eigenen Ansage darf nicht
  // das Sprachkommando /zurueck/ ausloesen.
  announce('R\u00fccknahme. ');
};
window.reportFehlt = async (alt) => {
  const ml = missList();
  if (!ml.length) return;
  let txt = 'FEHLT-MELDUNG Packliste ' + DATA.tour + ' ' + DATA.datum + '\n';
  let lastI = -1;
  for (const e of ml) {
    if (e.i !== lastI) { txt += '\nKiste ' + (e.i+1) + ' \u00b7 ' + e.m.label + ' (Device ' + e.m.device + '):\n'; lastI = e.i; }
    txt += '- Anwahl ' + e.it.sel.join('+') + ' \u00b7 ' + e.miss + '\u00d7 ' + e.it.name + ' \u00b7 ' + e.it.art + ' \u00b7 [id ' + e.it.id + ']\n';
  }
  txt += '\nGesamt: ' + ml.length + ' Position(en) mit Fehlmenge \u2013 bitte Bestand korrigieren.';
  // Hinweiszeile bewusst ohne "Kiste <n>", "Device", "[id" und "Gesamt:" (maschinell gelesene Meldung).
  const offenN = DATA.machines.reduce((n,m) => n + m.items.filter(it => !st(k(m,it))).length, 0);
  if (offenN) txt += '\nHinweis: ' + offenN + ' Position(en) noch nicht abgehakt \u2013 nicht in dieser Meldung enthalten.';
  await sendeMeldung(DATA, 'Fehlt-Meldung Packliste ' + DATA.tour + ' ' + DATA.datum, txt, alt);
};

let voiceOn = !!state.voiceOn, micOn = false, recog = null, speaking = false;
let recLive = false, sprachEnde = 0, uGen = 0;
const synth = window.speechSynthesis;
// iOS spricht beim gleichen rate-Wert schneller als Android -> geraeteabhaengiges Tempo
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const RATE = IOS ? 1.05 : 1.25;
function speak(txt) {
  if (!voiceOn || !synth) return;
  try {
    // iOS spielt bei jedem Start der Spracherkennung einen Systemton -> dort nicht stoppen/neu starten.
    if (recog && !IOS) { try { recog.abort(); } catch(e){} }
    speaking = true;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'de-DE'; u.rate = RATE;
    // Generationszaehler: Callbacks verworfener Ansagen heben die Echo-Sperre nicht vorzeitig auf.
    const g = ++uGen;
    u.onend = u.onerror = () => { if (g !== uGen) return; speaking = false; sprachEnde = Date.now(); if (micOn && !recLive) startRecog(); };
    synth.speak(u);
  } catch(e) { speaking = false; }
}
const sprich = it => it.qty + ' mal ' + it.name.replace(/\(.*?\)/g, ' ').replace(/\s+/g, ' ').trim();
function announce(prefix) {
  if (!voiceOn || state.tab === FEHLT || !DATA.machines.length) return;
  const m = DATA.machines[state.tab];
  const open = m.items.filter(it => !st(k(m,it)));
  speak((prefix||'') + (open.length ? sprich(open[0]) : 'Kiste ' + (state.tab+1) + ' fertig.'));
}
window.toggleVoice = () => {
  voiceOn = !voiceOn; state.voiceOn = voiceOn; save(); updVB();
  if (voiceOn) announce('Vorlesen an. '); else if (synth) synth.cancel();
};
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function startRecog() {
  if (!SR || !micOn) return;
  try {
    recog = new SR();
    recog.lang = 'de-DE'; recog.continuous = true; recog.interimResults = false;
    recog.onstart = () => { recLive = true; };
    recog.onresult = ev => {
      if (speaking || Date.now() - sprachEnde < 1000) return;
      const t = ev.results[ev.results.length-1][0].transcript.toLowerCase().trim();
      document.getElementById('heard').textContent = '\u201e' + t + '\u201c';
      handleVoice(t);
    };
    recog.onend = () => { recLive = false; if (micOn && !speaking) { try { recog.start(); recLive = true; } catch(e){} } };
    recog.onerror = e => {
      recLive = false;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        micOn = false; updVB();
        document.getElementById('heard').textContent = 'Mikrofon nicht erlaubt';
      }
    };
    recog.start();
    recLive = true;
  } catch(e) {
    recLive = false; micOn = false; updVB();
    document.getElementById('heard').textContent = 'Mikro-Start fehlgeschlagen \u2013 \ud83c\udfa4 erneut antippen';
  }
}
function handleVoice(t) {
  if (state.tab === FEHLT) { if (/zur\u00fcck/.test(t)) undo(); return; }
  const m = DATA.machines[state.tab]; if (!m) return;
  const open = m.items.filter(it => !st(k(m,it)));
  if (/zur\u00fcck|r\u00fcckg\u00e4ngig/.test(t)) undo();
  else if (/fehlt|nicht da|nicht vorr\u00e4tig|nicht verf\u00fcgbar|leer/.test(t)) { if (open.length) mark(k(m,open[0]),2); }
  else if (/gepackt|weiter|okay|erledigt|\bok\b|hab ich/.test(t)) { if (open.length) mark(k(m,open[0]),1); }
  else if (/wiederhol|noch ?mal|was war das/.test(t)) announce();
  else if (/n\u00e4chste kiste/.test(t)) { if (state.tab < DATA.machines.length-1) go(state.tab+1); }
}
window.toggleMic = () => {
  const heard = document.getElementById('heard');
  if (!SR) { heard.textContent = 'Spracherkennung hier nicht verf\u00fcgbar'; return; }
  if (!window.isSecureContext) { heard.textContent = 'Mikro braucht HTTPS-Seite'; return; }
  micOn = !micOn; updVB();
  if (micOn) {
    if (!voiceOn) { voiceOn = true; state.voiceOn = true; save(); }
    heard.textContent = 'H\u00f6re zu \u2026 (\u201egepackt\u201c, \u201efehlt\u201c, \u201ezur\u00fcck\u201c)';
    startRecog(); updVB();
  } else { heard.textContent = ''; if (recog) { try { recog.abort(); } catch(e){} } }
};
function updVB() {
  document.getElementById('vb').className = 'vbtn' + (voiceOn ? ' on' : '');
  document.getElementById('mb').className = 'vbtn mic' + (micOn ? ' on' : '');
}
updVB();
if ('wakeLock' in navigator) { const wl = () => navigator.wakeLock.request('screen').catch(()=>{}); wl(); document.addEventListener('visibilitychange', () => { if (!document.hidden) wl(); }); }
render();
}
</script>
</body>
</html>
