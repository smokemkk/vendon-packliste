<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OMS Lagerliste</title>
<style>
:root { --bg:#101418; --card:#1b222b; --fg:#f2f5f8; --dim:#8fa0b0; --acc:#33b5ff; --ok:#2ecc71; --warn:#f5a623; --line:#2a3542; --old:#ff3b30; --oldbg:#4d1210; }
/* touch-action:manipulation schaltet das Doppeltipp-Zoomen ab (schnelles Tippen
   hintereinander); Scrollen und Zwei-Finger-Zoom bleiben moeglich. */
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
html,body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
body { padding-bottom:132px; }
header { position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 10px 6px; border-bottom:1px solid var(--line); }
.tourrow { display:flex; justify-content:space-between; align-items:baseline; }
.tour { font-size:15px; font-weight:700; color:var(--acc); }
.agebadge { display:none; margin-left:7px; padding:3px 8px; border-radius:8px; font-size:11px; font-weight:800; letter-spacing:.6px; vertical-align:middle; }
.agebadge.fresh { display:inline-block; background:#12331f; color:var(--ok); border:1px solid var(--ok); }
.agebadge.warn { display:inline-block; background:#3a2f14; color:var(--warn); border:1px solid var(--warn); }
.agebadge.old { display:inline-block; background:var(--oldbg); color:#ffe2e0; border:1px solid var(--old); }
.agebadge.pruef { display:inline-block; background:#3a2f14; color:var(--warn); border:1px solid var(--warn); }
.agebadge.none { display:inline-block; background:var(--card); color:var(--dim); border:1px solid var(--line); }
#agebar { display:none; margin:7px -10px 0; padding:11px 12px; font-size:15px; font-weight:800; line-height:1.35; text-align:center; }
#agebar.warn { display:block; background:#3a2f14; color:var(--warn); border-top:2px solid var(--warn); border-bottom:2px solid var(--warn); }
#agebar.old { display:block; background:var(--oldbg); color:#ffe2e0; border-top:3px solid var(--old); border-bottom:3px solid var(--old); animation:oldpulse 1.6s ease-in-out infinite; }
#agebar .sub { display:block; margin-top:3px; font-size:13px; font-weight:600; opacity:.9; }
@keyframes oldpulse { 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.5); } }
@media (prefers-reduced-motion: reduce) { #agebar.old { animation:none; } }
body.veraltet header { background:var(--oldbg); border-bottom:3px solid var(--old); }
body.veraltet .tour { color:#fff; }
.prog { font-size:14px; color:var(--dim); font-variant-numeric:tabular-nums; }
.prog b { color:var(--ok); } .prog i { color:var(--warn); font-style:normal; }
.tabs { display:flex; gap:6px; overflow-x:auto; padding:8px 0 4px; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab { flex:0 0 auto; padding:9px 13px; border-radius:20px; background:var(--card); color:var(--dim); font-size:14px; font-weight:600; border:1px solid var(--line); }
.tab.act { background:var(--acc); color:#04283d; border-color:var(--acc); }
.tab.done { color:var(--ok); border-color:var(--ok); }
.tab.warn { color:var(--warn); border-color:var(--warn); }
.tab.warn.act { background:var(--warn); color:#3a2a00; }
.bar { height:5px; background:var(--card); border-radius:3px; overflow:hidden; margin-top:4px; }
.bar>div { height:100%; background:var(--ok); width:0%; transition:width .25s; }
.now { margin:10px; padding:14px 14px 12px; background:var(--card); border:2px solid var(--acc); border-radius:16px; }
.now .lbl { font-size:12px; letter-spacing:1.5px; color:var(--acc); font-weight:700; }
.mhead { display:flex; align-items:baseline; gap:9px; margin:0 0 9px; padding-bottom:9px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.kbadge { flex:0 0 auto; background:var(--acc); color:#04283d; font-size:14px; font-weight:800; padding:4px 10px; border-radius:9px; font-variant-numeric:tabular-nums; }
.mname { font-size:17px; font-weight:800; line-height:1.25; color:var(--fg); word-break:break-word; }
.nowrow { display:flex; align-items:center; gap:14px; margin-top:6px; }
.nowsel { font-size:56px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; min-width:92px; }
.nowqty { font-size:46px; font-weight:800; color:var(--ok); margin-left:auto; white-space:nowrap; }
.nowname { font-size:19px; font-weight:600; margin-top:8px; line-height:1.3; }
.nowart { font-size:12px; color:var(--dim); margin-top:3px; }
.btnrow { display:flex; gap:10px; margin-top:12px; }
.btnrow2 { display:flex; gap:10px; margin-top:9px; }
.nowbtn { flex:1; padding:15px 8px; font-size:19px; font-weight:800; border:0; border-radius:12px; background:var(--ok); color:#03210f; }
.nowbtn:disabled { opacity:.4; }
.partbtn { flex:1; padding:13px 8px; font-size:15px; font-weight:800; border-radius:12px; background:#12304a; color:var(--acc); border:1.5px solid var(--acc); }
.missbtn { flex:1; padding:13px 8px; font-size:15px; font-weight:800; border-radius:12px; background:#3a2f14; color:var(--warn); border:1.5px solid var(--warn); }
.partpick { margin-top:12px; padding:12px; background:#0f1620; border:1.5px solid var(--acc); border-radius:12px; }
.partpick .pq { font-size:14px; color:var(--dim); text-align:center; }
.partpick .pq b { color:var(--fg); }
.pickrow { display:flex; align-items:center; justify-content:center; gap:16px; margin:12px 0 6px; }
.stepbtn { width:58px; height:58px; font-size:32px; font-weight:800; border-radius:14px; border:1.5px solid var(--acc); background:var(--card); color:var(--acc); line-height:1; }
.stepbtn:disabled { opacity:.3; }
.pickval { font-size:46px; font-weight:800; min-width:80px; text-align:center; font-variant-numeric:tabular-nums; color:var(--ok); }
input.pickval { width:112px; padding:2px 0; font-family:inherit; line-height:1.15; background:var(--bg); border:1.5px solid var(--line); border-radius:12px; -webkit-appearance:none; appearance:none; }
input.pickval:focus { outline:none; border-color:var(--acc); }
.pickmiss { text-align:center; font-size:13px; color:var(--warn); min-height:16px; margin-bottom:6px; }
.pickact { display:flex; gap:10px; }
.pickok { flex:2; padding:14px 8px; font-size:16px; font-weight:800; border:0; border-radius:12px; background:var(--ok); color:#03210f; }
.pickcancel { flex:1; padding:14px 8px; font-size:15px; font-weight:700; border-radius:12px; background:var(--card); color:var(--fg); border:1.5px solid var(--line); }
li .psub { display:block; font-size:11px; color:var(--warn); margin-top:2px; }
.mgroup .dev { color:var(--dim); font-weight:500; font-size:12px; }
.alldone { margin:10px; padding:20px; text-align:center; background:var(--card); border:2px solid var(--ok); border-radius:16px; font-size:20px; font-weight:800; color:var(--ok); }
.alldone.w { border-color:var(--warn); color:var(--warn); font-size:17px; }
.report { display:block; width:calc(100% - 24px); margin:14px 12px; padding:15px; font-size:17px; font-weight:800; border:0; border-radius:12px; background:var(--warn); color:#3a2a00; }
.report.z { background:#12304a; color:var(--acc); border:1.5px solid var(--acc); }
.sendinfo { margin:10px 12px; padding:12px 13px; background:var(--card); border:1px solid var(--line); border-radius:12px; font-size:14px; line-height:1.4; }
.sendst { margin:-6px 14px 14px; font-size:13px; color:var(--dim); display:flex; justify-content:space-between; gap:10px; align-items:center; }
.sendst .ok { color:var(--ok); font-weight:700; }
.sendinfo.frage { border:2px solid var(--ok); font-size:15px; font-weight:700; }
.fragebtn { display:flex; gap:8px; } .fragebtn .report { margin:10px 0 0; flex:1; width:auto; padding:12px; font-size:15px; }
.report:disabled { opacity:.4; }
.altlink { background:none; border:0; padding:4px 0; color:var(--acc); font-size:13px; text-decoration:underline; }
ul { list-style:none; margin:4px 10px; padding:0; }
li { display:flex; align-items:center; gap:11px; padding:13px 11px; border-bottom:1px solid var(--line); font-size:16px; }
li .sel { font-size:23px; font-weight:800; min-width:58px; font-variant-numeric:tabular-nums; }
li .nm { flex:1; line-height:1.25; }
li .art { display:block; font-size:11px; color:var(--dim); }
li .qty { font-size:23px; font-weight:800; color:var(--ok); white-space:nowrap; }
li.done { opacity:.38; }
li.done .nm, li.done .sel { text-decoration:line-through; }
li.miss { background:#2a2210; }
li.miss .qty { color:var(--warn); }
li .box { width:26px; height:26px; border:2px solid var(--dim); border-radius:7px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-weight:800; color:#03210f; }
li.done .box { background:var(--ok); border-color:var(--ok); }
li.miss .box { background:var(--warn); border-color:var(--warn); color:#3a2a00; }
li .xbtn { flex:0 0 auto; padding:8px 10px; font-size:13px; font-weight:800; color:var(--warn); background:transparent; border:1.5px solid var(--warn); border-radius:9px; }
h3 { margin:16px 12px 2px; font-size:13px; color:var(--dim); letter-spacing:1px; text-transform:uppercase; }
h3.warn { color:var(--warn); }
.mgroup { margin:14px 12px 4px; font-size:14px; font-weight:700; color:var(--acc); }
.hint { margin:8px 12px 16px; font-size:13px; color:var(--dim); line-height:1.4; }
.next { position:fixed; left:0; right:0; bottom:0; z-index:6; background:linear-gradient(#141a21f2,#141a21); border-top:1px solid var(--line); padding:7px 10px 10px; display:flex; gap:12px; align-items:stretch; }
.next.fl { gap:6px; }
.undo { flex:0 0 auto; align-self:center; padding:13px 14px; font-size:15px; font-weight:800; border-radius:12px; border:1.5px solid var(--dim); background:var(--card); color:var(--fg); }
.undo:disabled { opacity:.35; }
.vbtns { display:flex; gap:7px; align-items:center; }
.vbtn { padding:7px 11px; font-size:17px; border-radius:11px; border:1.5px solid var(--line); background:var(--card); }
.vbtn.on { border-color:var(--ok); background:#12331f; }
.vbtn.mic.on { border-color:#ff5a5a; background:#3a1414; animation:pulse 1.4s infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 #ff5a5a55} 50%{box-shadow:0 0 0 7px #ff5a5a00} }
.heard { font-size:11px; color:var(--dim); max-width:46vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nx { flex:1; min-width:0; }
.nx .lbl { font-size:11px; letter-spacing:1.5px; color:var(--dim); font-weight:700; }
.nrow { display:flex; align-items:center; gap:10px; padding:4px 2px 0; font-size:14px; color:var(--dim); }
.nrow b { color:var(--fg); font-size:17px; min-width:44px; font-variant-numeric:tabular-nums; }
.nrow .q { margin-left:auto; color:var(--ok); font-weight:700; font-size:16px; white-space:nowrap; }
.nrow .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#pinov { position:fixed; inset:0; z-index:99; display:none; align-items:center; justify-content:center; background:var(--bg); }
.pinbox { width:min(86vw,340px); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; text-align:center; }
.pinbox h2 { margin:0 0 4px; font-size:19px; }
.pinbox p { margin:0 0 14px; font-size:13px; color:var(--dim); }
.pinbox input { width:100%; padding:14px; font-size:26px; text-align:center; letter-spacing:6px; border-radius:11px; border:1.5px solid var(--line); background:var(--bg); color:var(--fg); font-variant-numeric:tabular-nums; }
.pinbox button { width:100%; margin-top:12px; padding:14px; font-size:17px; font-weight:800; border:0; border-radius:11px; background:var(--acc); color:#04283d; }
#pinmsg { min-height:18px; margin-top:9px; font-size:13px; color:var(--warn); }
.nodata { margin:40px 16px; text-align:center; color:var(--dim); font-size:16px; line-height:1.5; }
/* --- Ablauf-Modus --- */
/* Schritt-Karte bewusst kompakt: sie steht fest ueber der Ablauf-Liste und soll ihr Platz lassen. */
.stepcard { margin:6px 10px; padding:8px 12px; background:var(--card); border:2px solid var(--acc); border-radius:14px; }
.stepcard .shead { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.stepcard .kbadge { font-size:12px; padding:3px 8px; border-radius:8px; }
.stepcard .stitle { flex:1; min-width:0; font-size:16px; font-weight:800; line-height:1.2; }
.stepcard .ssub { width:100%; font-size:12px; color:var(--dim); margin-top:1px; line-height:1.25; }
.stepcard .ssub:empty { display:none; }
.tmrrow { display:flex; align-items:center; gap:12px; margin-top:4px; }
.tmr { font-size:30px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; color:var(--ok); }
.tmr.w { color:var(--warn); } .tmr.o { color:var(--old); }
.soll { margin-left:auto; text-align:right; font-size:12px; color:var(--dim); line-height:1.25; }
.soll b { color:var(--fg); font-size:14px; }
.stepbtns { display:flex; gap:10px; margin-top:12px; }
.skipbtn { flex:1; padding:6px 8px; font-size:14px; font-weight:800; border-radius:12px; background:var(--card); color:var(--dim); border:1.5px solid var(--line); }
.steps { margin:6px 10px; }
.srow { display:flex; align-items:center; gap:9px; padding:9px 8px; border-bottom:1px solid var(--line); font-size:14px; color:var(--dim); }
.srow .snr { flex:0 0 auto; min-width:26px; text-align:center; font-weight:800; font-size:12px; color:var(--dim); border:1px solid var(--line); border-radius:7px; padding:3px 4px; }
.srow .snm { flex:1; line-height:1.25; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.srow .snm small { display:block; font-size:11px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.srow .szeit { flex:0 0 auto; font-variant-numeric:tabular-nums; font-size:13px; }
.srow.cur { color:var(--fg); background:#12202e; border-left:3px solid var(--acc); border-radius:6px; }
.srow.cur .snr { color:var(--acc); border-color:var(--acc); }
.srow.ok { opacity:.55; } .srow.ok .snr { color:var(--ok); border-color:var(--ok); }
.srow.sk { opacity:.4; } .srow.sk .snm { text-decoration:line-through; }
.sgroup { margin:14px 12px 2px; font-size:13px; font-weight:800; color:var(--acc); letter-spacing:.4px; }
.navtabs { display:flex; gap:6px; padding:6px 0 4px; }
.navtab { flex:1; text-align:center; padding:7px 4px; border-radius:12px; background:var(--card); color:var(--dim); font-size:13px; font-weight:700; border:1px solid var(--line); white-space:nowrap; }
.navtab.pkt { color:#ffd54a; border-color:#ffd54a; font-size:15px; font-weight:800; }
.navtab.pkt.act { background:#ffd54a; color:#3a2a00; }
.navtab.pkt.neu { animation:pktbump .5s ease-out; }
@keyframes pktbump { 0%{ transform:scale(1); } 40%{ transform:scale(1.25); } 100%{ transform:scale(1); } }
/* Punktgewinn: ploppt klein in der Ecke unten rechts (ueber der Fussleiste) auf und verschwindet von selbst. */
#pktpop { position:fixed; right:10px; bottom:92px; z-index:50; pointer-events:none; text-align:center; padding:8px 14px; border-radius:14px; background:#2b2205f2; border:2px solid #ffd54a; color:#ffd54a; font-size:26px; font-weight:900; line-height:1; white-space:nowrap; box-shadow:0 4px 16px #000c; transform-origin:right bottom; animation:pktpop 1.3s ease-out forwards; }
#pktpop small { display:block; margin-top:4px; font-size:11px; font-weight:700; color:#fff3c4; }
@keyframes pktpop { 0%{ opacity:0; transform:scale(.4); } 15%{ opacity:1; transform:scale(1.15); } 30%{ transform:scale(1); } 75%{ opacity:1; transform:translateY(-6px) scale(1); } 100%{ opacity:0; transform:translateY(-22px) scale(.9); } }
#pktpop.gross { font-size:32px; box-shadow:0 0 0 4px #ffd54a33, 0 4px 18px #000c; }
.pktteil { position:fixed; right:48px; bottom:112px; z-index:49; pointer-events:none; font-size:15px; line-height:1; animation:pktflug 1.1s ease-out forwards; }
@keyframes pktflug { 0%{ opacity:1; transform:scale(.5); } 70%{ opacity:1; } 100%{ opacity:0; transform:translate(var(--dx), var(--dy)) scale(1.2) rotate(var(--rot)); } }
@media (prefers-reduced-motion: reduce) { #pktpop { animation:pktfade 1.3s linear forwards; } .navtab.pkt.neu { animation:none; } .pktteil { display:none; } }
@keyframes pktfade { 0%,80%{ opacity:1; } 100%{ opacity:0; } }
.pktmax { font-size:13px; font-weight:600; color:var(--dim); margin-top:4px; }
.srow.pkt { color:var(--fg); } .srow.pkt .z3 { min-width:84px; font-size:14px; font-weight:800; }
.navtab.act { background:var(--acc); color:#04283d; border-color:var(--acc); }
.navtab.warn { color:var(--warn); border-color:var(--warn); }
.navtab.warn.act { background:var(--warn); color:#3a2a00; }
.navtab.send { color:var(--ok); border-color:var(--ok); }
.navtab.send.act { background:var(--ok); color:#03210f; }
@media (max-width: 400px) { .navtabs { gap:4px; } .navtab { padding:7px 2px; font-size:12px; } .navtab.pkt { font-size:13px; } }
.stepback { flex:0 0 auto; align-self:center; padding:13px 12px; font-size:15px; font-weight:800; border-radius:12px; border:1.5px solid var(--dim); background:var(--card); color:var(--fg); }
.stepback:disabled { opacity:.35; }
.stepback.pause.on { border-color:var(--warn); color:var(--warn); background:#3a2f14; }
/* Knoepfe der Fussleiste mit Beschriftung: Symbol oben, Wort darunter. */
.ic { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-width:46px; padding:6px 4px; line-height:1; }
.skipbtn.ic { flex:0 0 auto; padding:6px 3px; color:var(--fg); border-color:var(--dim); }
.fertigbtn span { white-space:nowrap; }
/* sehr schmale Displays: Knoepfe enger, damit der gruene Knopf lesbar bleibt */
@media (max-width:339px) { .next.fl { gap:4px; padding-left:6px; padding-right:6px; } .ic { min-width:38px; padding:6px 2px; } .ic small { font-size:9px; letter-spacing:0; } .skipbtn.ic { padding:6px 2px; } .fertigbtn { font-size:14px; padding:6px 2px; } }
/* unter 300 px ist fuer die Woerter kein Platz: nur Symbole */
@media (max-width:299px) { .ic small { display:none; } .ic { min-width:34px; } }
.ic span { font-size:19px; line-height:1; }
.ic small { font-size:10px; font-weight:700; letter-spacing:.2px; color:var(--dim); white-space:nowrap; }
.stepback.pause.on small { color:var(--warn); }
.pausenote { margin-top:5px; padding:5px 10px; border-radius:9px; background:#3a2f14; color:var(--warn); font-weight:800; font-size:13px; text-align:center; }
.z3 { flex:0 0 auto; min-width:52px; text-align:right; font-variant-numeric:tabular-nums; font-size:13px; }
.srow.kopf { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.5px; border-bottom:1.5px solid var(--dim); }
.srow.summe { color:var(--fg); font-weight:800; border-top:2px solid var(--line); }
.istwarn { color:var(--warn); } .istover { color:var(--old); } .istok { color:var(--ok); }
.fertigbtn { flex:1; min-width:0; padding:6px 4px; font-size:15px; line-height:1.15; font-weight:800; border:0; border-radius:12px; background:var(--ok); color:#03210f; }
.fertigbtn:disabled { opacity:.45; }
.fillhint { margin:10px 2px 2px; font-size:13px; color:var(--dim); line-height:1.45; }
/* Schritt-Karte (Timer) bleibt unter dem Kopf stehen; die Ablauf-Liste laeuft darunter mit. */
.stepcard.fest { position:sticky; top:var(--kopf,0px); z-index:4; box-shadow:0 -11px 0 0 var(--bg), 0 6px 10px -4px #000a; }
</style>
</head>
<body>
<div id="pinov"><div class="pinbox"><h2>&#128230; OMS Lagerliste</h2><p>Bitte PIN eingeben (einmalig)</p>
<input id="pin" inputmode="numeric" autocomplete="off" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;">
<button onclick="pinGo()">&Ouml;ffnen</button><div id="pinmsg"></div></div></div>
<header>
  <div class="tourrow"><span><span class="tour" id="ttl">&#128230; Lagerliste</span><span class="agebadge" id="agebadge"></span></span>
    <span class="vbtns"><span class="heard" id="heard"></span><button class="vbtn" id="vb" onclick="toggleVoice()">&#128266;</button><button class="vbtn mic" id="mb" onclick="toggleMic()">&#127908;</button></span></div>
  <div id="agebar" role="alert"></div>
  <div class="tourrow"><span class="prog" id="zeitges"></span><span class="prog" id="prog"></span></div>
  <div id="navzone"></div>
  <div class="bar"><div id="bar"></div></div>
</header>
<div id="main"></div>
<div class="next" id="botbar"><button class="undo" id="undo" onclick="undo()">&#8617; Zur&uuml;ck</button><div class="nx" id="nx"></div></div>
<script>
const LS=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return localStorage;}catch(e){const m={};return{getItem:k=>(k in m?m[k]:null),setItem:(k,v)=>{m[k]=String(v);},clear:()=>{for(const k in m)delete m[k];}};}})();
// Schnelles Tippen hintereinander: Das Geraet deutet zwei Tipps als Doppeltipp und zoomt.
// Nur ein zweiter schneller Tipp AN DERSELBEN STELLE (das ist der Doppeltipp) wird
// abgefangen (kein Zoom) und genau einmal als normaler Klick ausgefuehrt, damit kein Tipp
// verloren geht. Tipps an anderer Stelle, Wischen/Scrollen und Zwei-Finger-Gesten bleiben
// unberuehrt; Eingabefelder sind ausgenommen. Ein danach eventuell noch vom Geraet
// nachgelieferter Klick wird verworfen, damit nichts doppelt zaehlt.
(() => {
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!ios) return;
  let letzter = 0, lx = 0, ly = 0, x0 = 0, y0 = 0, bewegt = false, sperreBis = 0;
  document.addEventListener('click', e => {
    // Nur EIN nachgelieferter Klick an der Stelle des abgefangenen Tipps wird verworfen;
    // Klicks an anderer Stelle bleiben unberuehrt.
    if (e.isTrusted && Date.now() < sperreBis && Math.abs(e.clientX - lx) < 45 && Math.abs(e.clientY - ly) < 45) {
      sperreBis = 0; e.preventDefault(); e.stopPropagation();
    }
  }, true);
  document.addEventListener('touchstart', e => {
    if (e.touches.length === 1) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; bewegt = false; }
    else bewegt = true;
  }, {passive: true});
  document.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (!t || Math.abs(t.clientX - x0) > 10 || Math.abs(t.clientY - y0) > 10) bewegt = true;
  }, {passive: true});
  document.addEventListener('touchend', e => {
    if (bewegt || e.touches.length) { letzter = 0; return; }
    const jetzt = Date.now();
    const doppel = jetzt - letzter < 400 && Math.abs(x0 - lx) < 45 && Math.abs(y0 - ly) < 45;
    letzter = jetzt; lx = x0; ly = y0;
    if (!doppel || !e.cancelable) return;
    const t = e.target;
    if (!t || !t.closest || t.closest('input,textarea,select')) return;
    e.preventDefault();
    sperreBis = jetzt + 350;
    const z = t.closest('button,a,[onclick]');
    if (z && z.isConnected && !z.disabled) z.click();
  }, {passive: false});
})();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pin, salt) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function tryPin(pin) {
  const r = await fetch('data.enc.json?t=' + Date.now(), {cache:'no-store'});
  if (!r.ok) throw new Error('load');
  const enc = await r.json();
  const key = await deriveKey(pin, b64(enc.salt));
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(enc.iv)}, key, b64(enc.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
window.pinGo = async () => {
  const pin = document.getElementById('pin').value.trim();
  const msg = document.getElementById('pinmsg');
  msg.textContent = 'Pr\u00fcfe \u2026';
  try { const d = await tryPin(pin); LS.setItem('packliste_pin', pin); document.getElementById('pinov').remove(); startApp(d); }
  catch(e) { msg.textContent = 'PIN falsch oder Daten nicht erreichbar.'; }
};
document.addEventListener('keydown', e => { if (e.key === 'Enter' && document.getElementById('pinov')) pinGo(); });
(async () => {
  const saved = LS.getItem('packliste_pin');
  if (saved) { try { const d = await tryPin(saved); document.getElementById('pinov').remove(); startApp(d); return; } catch(e){} }
  document.getElementById('pinov').style.display = 'flex';
})();

// ==================== Gemeinsames: Alters-Kennzeichnung ====================
function kennzeichneAlter(DATA, listArt) {
  document.getElementById('ttl').innerHTML = '&#128230; ' + listArt + ' ' + DATA.tour + ' &middot; ' + (DATA.datum || '&#8211;');
  document.title = listArt + ' ' + DATA.tour + ' ' + (DATA.datum || '');
  const alterTage = (() => {
    const s = String(DATA.datum || '');
    if (s.length === 0) return '';
    if (s.length !== 10 || s.charAt(4) !== '-' || s.charAt(7) !== '-') return null;
    const nurZiffern = x => { for (let i = 0; i < x.length; i++) { const c = x.charCodeAt(i); if (c < 48 || c > 57) return false; } return x.length > 0; };
    const jS = s.slice(0, 4), mS = s.slice(5, 7), tS = s.slice(8, 10);
    if (!nurZiffern(jS) || !nurZiffern(mS) || !nurZiffern(tS)) return null;
    const j = Number(jS), m = Number(mS), t = Number(tS);
    if (j < 2000 || j > 2999 || m < 1 || m > 12 || t < 1 || t > 31) return null;
    const ms = Date.UTC(j, m - 1, t);
    const roundtrip = new Date(ms);
    if (roundtrip.getUTCFullYear() !== j || roundtrip.getUTCMonth() !== m - 1 || roundtrip.getUTCDate() !== t) return null;
    const jetzt = new Date();
    const tage = Math.round((Date.UTC(jetzt.getFullYear(), jetzt.getMonth(), jetzt.getDate()) - ms) / 86400000);
    return Number.isFinite(tage) ? tage : null;
  })();
  const bd = document.getElementById('agebadge'), br = document.getElementById('agebar');
  const setBanner = (klasse, haupt, sub) => {
    br.textContent = '';
    br.className = klasse;
    br.appendChild(document.createTextNode('\u26A0\uFE0F ' + haupt));
    const s = document.createElement('span');
    s.className = 'sub'; s.textContent = sub;
    br.appendChild(s);
  };
  const dstr = typeof alterTage === 'number'
    ? String(DATA.datum).slice(8, 10) + '.' + String(DATA.datum).slice(5, 7) + '.' + String(DATA.datum).slice(0, 4)
    : '';
  if (alterTage === '') { bd.className = 'agebadge none'; bd.textContent = 'KEINE LISTE'; return; }
  if (alterTage === null) {
    bd.className = 'agebadge pruef'; bd.textContent = 'DATUM PR\u00dcFEN';
    setBanner('warn', 'Das Datum dieser Liste ist unbrauchbar.', 'Stand nicht bestimmbar - vor dem Packen den aktuellen Stand pr\u00fcfen.');
    document.title = 'DATUM PR\u00dcFEN - ' + document.title;
    return;
  }
  if (alterTage < 0) {
    bd.className = 'agebadge pruef'; bd.textContent = 'DATUM PR\u00dcFEN';
    setBanner('warn', 'Das Datum dieser Liste liegt in der Zukunft (' + dstr + ').',
      'Stand nicht plausibel - vor dem Packen den aktuellen Stand pr\u00fcfen.');
    document.title = 'DATUM PR\u00dcFEN - ' + document.title;
    return;
  }
  if (alterTage === 0) { bd.className = 'agebadge fresh'; bd.textContent = 'HEUTE'; return; }
  if (alterTage === 1) {
    bd.className = 'agebadge warn'; bd.textContent = 'VON GESTERN';
    setBanner('warn', 'Diese Liste ist von GESTERN (' + dstr + ')',
      'Pr\u00fcfen, ob inzwischen eine neue Liste ver\u00f6ffentlicht wurde.');
    document.title = '(gestern) ' + document.title;
    return;
  }
  bd.className = 'agebadge old'; bd.textContent = alterTage + ' TAGE ALT';
  setBanner('old', 'VERALTETE LISTE \u00b7 ' + alterTage + ' Tage alt (' + dstr + ')',
    'Nicht nach dieser Liste arbeiten, bevor der aktuelle Stand gepr\u00fcft ist.');
  document.body.classList.add('veraltet');
  document.title = 'VERALTET (' + alterTage + ' Tage) - ' + document.title;
}

// ==================== Gemeinsames: Teilmenge per Tastatur ====================
// Eingabefeld zwischen den Tasten -/+: Zahl antippen und eintippen (Ziffernblock).
function pickFeld(v, key, qty) {
  return `<input class="pickval" id="pickinp" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="done" value="${v}"` +
    ` onfocus="const t=this;setTimeout(()=>{try{t.setSelectionRange(0,9);}catch(e){}},0)" oninput="pickSet(this,${qty})"` +
    ` onblur="if(this.value==='')this.value='0'" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();pickOk('${key}',${qty});}">`;
}
// Ziffern lesen, auf 0..Bedarf begrenzen, Hinweis und Tasten direkt aktualisieren
// (kein Neuaufbau der Seite, sonst verliert das Feld den Fokus und die Tastatur schliesst).
function pickLesen(el, qty) {
  const roh = String(el.value).replace(/[^0-9]/g, '').slice(0, 4);
  let v = roh === '' ? 0 : parseInt(roh, 10);
  if (v > qty) v = qty;
  const soll = roh === '' ? '' : String(v);
  if (el.value !== soll) el.value = soll;
  const mv = qty - v, pm = document.getElementById('pickmiss');
  if (pm) pm.textContent = mv > 0 ? ('\u26a0 ' + mv + ' fehlt \u2013 wird gemeldet') : '\u2705 alles vorhanden';
  const a = document.getElementById('pickminus'), b = document.getElementById('pickplus');
  if (a) a.disabled = v <= 0;
  if (b) b.disabled = v >= qty;
  return v;
}

// ==================== Gemeinsames: Meldungen senden ====================
// Primaer per E-Mail: Das Mail-Programm oeffnet sich mit Empfaenger, Betreff und Text. Die
// Adresse steht nur in den verschluesselten Daten (DATA.mail), nie im oeffentlichen Quelltext.
// Ohne Adresse (aeltere Daten) oder auf Wunsch (alt = true): Teilen-Menue, sonst Zwischenablage.
// Rueckgabe 'mail' = Mail-Programm geoeffnet (ob abgeschickt, ist nicht erkennbar -> Rueckfrage),
// 'geteilt' = ueber das Teilen-Menue versendet, 'kopiert' = nur Zwischenablage, false = abgebrochen.
// Als "gesendet" zaehlt nur 'geteilt' oder 'mail' mit bestaetigter Rueckfrage (Nutzerentscheidung 2026-10-14).
const MAILTO_MAX = 16000;
function meldeAdresse(DATA) {
  return (typeof DATA.mail === 'string' && /^[^\s@<>"?&]+@[^\s@<>"?&]+\.[a-z]{2,}$/i.test(DATA.mail)) ? DATA.mail : '';
}
function sendeHinweis(DATA) {
  const an = meldeAdresse(DATA);
  return an ? '\u201eSenden\u201c \u00f6ffnet dein E-Mail-Programm \u2013 Empf\u00e4nger ' + an + ', Betreff und Text sind schon eingetragen, dort nur noch auf Senden tippen.'
    : '\u201eSenden\u201c \u00f6ffnet das Teilen-Men\u00fc \u2013 die Liste bitte wie besprochen senden.';
}
async function sendeMeldung(DATA, titel, txt, alt) {
  const info = t => { const el = document.getElementById('heard'); if (el) el.textContent = t; };
  const an = meldeAdresse(DATA);
  if (an && !alt) {
    const url = 'mailto:' + an + '?subject=' + encodeURIComponent(titel) +
      '&body=' + encodeURIComponent(txt.replace(/\r?\n/g, '\r\n'));
    // Sehr lange mailto-Links kuerzen manche Mail-Apps still -> dann lieber das Teilen-Menue.
    if (url.length <= MAILTO_MAX) {
      window.location.href = url;
      info('E-Mail ge\u00f6ffnet \u2013 dort auf Senden tippen');
      return 'mail';
    }
    info('Bericht zu lang f\u00fcr den E-Mail-Knopf \u2013 bitte \u00fcber Teilen an ' + an + ' senden');
  }
  try { await navigator.share({title: titel, text: txt}); return 'geteilt'; }
  catch (e) {
    // Bewusst abgebrochenes Teilen-Menue: nichts kopieren, nichts werten.
    if (e && e.name === 'AbortError') return false;
    try { await navigator.clipboard.writeText(txt); info('Meldung kopiert \u2013 in Chat/Mail einf\u00fcgen'); return 'kopiert'; }
    catch (e2) { info('Senden nicht m\u00f6glich \u2013 bitte Screenshot senden'); return false; }
  }
}

function startApp(DATA) {
  if (DATA.plan && DATA.machines && DATA.machines.length) { flowApp(DATA); }
  else { legacyApp(DATA); }
}

// ==================== Ablauf-Modus (Lagerliste) ====================
// Gefuehrte Schritte mit Timern. Schritt-Titel und Sollwerte kommen aus den
// verschluesselten Daten; hier steht nur neutrale Ablauf-Mechanik.
function flowApp(DATA) {
  kennzeichneAlter(DATA, 'Lagerliste');
  const P = DATA.plan;
  const KEY = 'lagerliste_' + DATA.datum + '_' + DATA.tour;
  let state = JSON.parse(LS.getItem(KEY) || 'null') || {};
  if (!state.items) {
    // Uebernahme eines evtl. schon begonnenen Stands der klassischen Packliste desselben Tages,
    // damit beim Umstieg auf die Lagerliste kein Pack-Fortschritt verloren geht.
    try {
      const alt = JSON.parse(LS.getItem('packliste_' + DATA.datum + '_' + DATA.tour) || 'null');
      if (alt && alt.items) { state.items = alt.items; state.part = alt.part || {}; }
    } catch(e) {}
  }
  if (!state.items) state.items = {};
  if (!state.part) state.part = {};
  if (!state.hist) state.hist = [];
  if (!state.done) state.done = {};
  if (!state.skipd) state.skipd = {};
  if (!state.zeit) state.zeit = {};
  if (typeof state.tab !== 'number') state.tab = 0;      // Kisten-Tab im Pack-Schritt
  if (typeof state.step !== 'number') state.step = 0;    // Index in STEPS
  if (typeof state.view !== 'number' || state.view < 0 || state.view > 4) state.view = 0;  // 0 = Ablauf, 1 = Fehlt, 2 = Zeit, 3 = Punkte, 4 = Senden
  if (typeof state.pauseSum !== 'number') state.pauseSum = 0;  // Pausen-Sekunden gesamt
  if (!state.meld || typeof state.meld !== 'object') state.meld = {};  // gesendete Meldungen (fuer die Punkte)
  // state.cur = stabile Kennung des angezeigten Schritts (state.step ist nur ein Index und
  // waere nach einer Neuveroeffentlichung mit anderem Zuschnitt ein anderer Schritt - wichtig
  // in der Pause, in der state.aktiv leer ist).
  const save = () => { try { if (STEPS[state.step]) state.cur = STEPS[state.step].id; } catch (e) {} LS.setItem(KEY, JSON.stringify(state)); };

  // ---- Schritt-Liste aufbauen ----
  // Schritt-Titel kommen aus den entschluesselten Daten (P.taet[nr].n), nichts steht statisch hier.
  const T = n => (P.taet || {})[String(n)] || null;
  // Klammerzusatz am Ende entfaellt - ausser bei Nr. 15/19: dort unterscheidet NUR der Zusatz
  // ("Outdoor-Standort" / "im Kioskladen") die beiden Kehr-Taetigkeiten.
  const titel = n => { const t = T(n); return t && t.n ? ((n === 15 || n === 19) ? String(t.n) : String(t.n).replace(/\s*\([^)]*\)\s*$/, '')) : 'Schritt ' + n; };
  const sollMin = (n, menge) => { const t = T(n); if (!t) return 0; let v = t.s * menge; if (String(t.e).charAt(0) === 's') v /= 60; return v; };
  const pufVon = n => { const t = T(n); return (t && typeof t.p === 'number') ? t.p : 0.1; };
  const M_BY_DEV = {}; DATA.machines.forEach((m, i) => { M_BY_DEV[m.device] = i; });
  const stkVon = m => m.items.reduce((a, it) => a + it.qty, 0);
  const stkGes = DATA.machines.reduce((a, m) => a + stkVon(m), 0);
  const STEPS = [];
  // Tatsaechlich offene Aufgaben je Automat (falls in den Tour-Daten enthalten): Anzahl fuer
  // Nr. 8 (Muenzgeldbefuellungen) bzw. Nr. 9 (ToDos) ueber die genannten Automaten, sonst null.
  const BD = (P.bedarf && P.bedarf.dev) || null;
  // Offene Aufgaben NICHT erfasst: Mengen 0, Nr. 2/8/9 ohne Soll, Hinweis "ToDos nicht erfasst" (seit 2026-10-16).
  const NE = !BD && P.bedarf_fehlt === 1;
  const bedarfN = (nr, devs) => {
    if (!BD) return null;
    let n = 0;
    devs.forEach(d => { const e = BD[String(d)]; if (e) n += (nr === 8 ? e.m : e.t) || 0; });
    return Math.round(n * 100) / 100;
  };
  let fahrtN = 0;
  const autoBlock = (dev, gebuendelt) => {
    const mi = M_BY_DEV[dev]; if (mi == null) return;
    const m = DATA.machines[mi];
    const add = (nr, o) => STEPS.push(Object.assign({id: 'a' + dev + '_' + nr, nr, t: titel(nr), sub: m.label, dev, mi}, o || {}));
    // In Laeden mit mehreren Automaten (gebuendelt) laufen ALLE Punkte ausser dem Befuellen
    // als EIN Schritt fuer den ganzen Laden (siehe Standort-Aufbau) - hier bleibt dann nur Nr. 10.
    if (!gebuendelt) {
      add(5, {soll: sollMin(5, 1)});
      add(6, {soll: sollMin(6, 1)});
      add(7, {soll: sollMin(7, 1)});
      // Bedarfs-Schritte: Sollzeit gilt JE EREIGNIS (ev:1) und zaehlt nicht je Automat in die
      // Gesamt-Sollzeit; dort gehen stattdessen die Mengen-Annahmen der Tour ein (s. sollGesMin).
      add(8, {skip: 1, ev: 1, soll: sollMin(8, 1), bn: bedarfN(8, [dev])});
      add(9, {skip: 1, ev: 1, soll: sollMin(9, 1), bn: bedarfN(9, [dev])});
    }
    add(10, {mode: 'fill', soll: sollMin(10, stkVon(m))});
    if (!gebuendelt) {
      add(11, {soll: sollMin(11, 1)});
      add(12, {soll: sollMin(12, 1)});
      add(14, {soll: sollMin(14, 1)});
    }
  };
  // Tages-Abweichungen aus den Tour-Daten: Punkte, die an diesem Tag vorab anfallen.
  (P.vorab || []).forEach(v => {
    if (!v || typeof v.nr !== 'number' || !T(v.nr)) return;
    STEPS.push({id: 't' + v.nr + 'v', nr: v.nr, t: titel(v.nr), sub: String(v.sub || ''), soll: sollMin(v.nr, 1)});
  });
  STEPS.push({id: 't1', nr: 1, t: titel(1), sub: 'Alle Kisten dieser Tour', mode: 'pack', soll: sollMin(1, stkGes)});
  // Seit Katalog v16: Schritte direkt nach dem Kistenpacken (Nr. 23/24), Reihenfolge wie im Katalog-Blatt.
  (Array.isArray(P.nach_packen) ? P.nach_packen : []).forEach(nr => {
    if (typeof nr !== 'number' || !T(nr)) return;
    STEPS.push({id: 't' + nr, nr, t: titel(nr), sub: 'Nach dem Kistenpacken', soll: sollMin(nr, 1)});
  });
  // Menge fuer Nr. 2: Automaten mit offenen ToDos (falls bekannt), sonst die ToDo-Annahme der Tour.
  const n2 = (typeof P.todos_auto === 'number') ? P.todos_auto : (P.todos || 0);
  if (n2 > 0) STEPS.push({id: 't2', nr: 2, t: titel(2), sub: (typeof P.todos_auto === 'number') ? ('Für ' + n2 + ' Automaten mit offenen ToDos') : 'Nur bei Bedarf', skip: 1, soll: sollMin(2, n2)});
  else if (NE) STEPS.push({id: 't2', nr: 2, t: titel(2), sub: 'ToDos nicht erfasst – nur bei Bedarf (ohne Soll)', skip: 1, soll: 0});
  STEPS.push({id: 't3', nr: 3, t: titel(3), soll: sollMin(3, 1)});
  // Kontrollen vor der Abfahrt mit eigener Sollzeit (aus den Tour-Daten, Reihenfolge wie dort).
  (Array.isArray(P.lager_kontr) ? P.lager_kontr : []).forEach(nr => {
    if (typeof nr !== 'number' || !T(nr)) return;
    STEPS.push({id: 't' + nr, nr, t: titel(nr), sub: 'Vor der Abfahrt', soll: sollMin(nr, 1)});
  });
  // Fester Kontroll-Schritt ohne Soll (nicht Teil der Soll-Tabelle): vor der Abfahrt
  // pruefen, dass alles verschlossen ist und das Licht aus ist.
  // Ab Katalog v11 (P.abschl_vor) ist das Abschliessen vor der Abfahrt die Taetigkeit Nr. 18 mit Sollzeit.
  if (P.abschl_vor && T(18)) STEPS.push({id: 't3a', nr: 18, t: titel(18), sub: 'Vor der Abfahrt: alles zu? Licht aus?', soll: sollMin(18, 1)});
  else STEPS.push({id: 't3a', nr: '3a', t: 'Lager abschlie\u00dfen', sub: 'Alles zu? Licht aus?', soll: 0});
  const seen = {};
  (P.standorte || []).forEach((st, si) => {
    const devs = (st.devs || []).filter(d => M_BY_DEV[d] != null);
    if (!devs.length) return;
    // Stabile Standort-Kennung = erstes Device des Standorts. Frueher der Positions-Index:
    // bei Neuveroeffentlichung am selben Tag mit anderer Reihenfolge waeren gespeicherte
    // Zeiten/Haken sonst still einem anderen Standort zugefallen (Omsdex 2026-10-10).
    // Praefixe 'sd'/'fd' sind bewusst verschieden von den frueheren Positions-Kennungen
    // s<Index>_... / f<n> - eine alte Kennung kann so nie einer neuen gleichen.
    const sk = devs[0];
    fahrtN++; STEPS.push({id: 'fd' + sk, nr: 4, t: titel(4), sub: '\u2192 ' + st.name, fahrt: 1});
    // Standort mit mehreren Automaten: alle Punkte ausser dem Befuellen in einem Rutsch fuer
    // ALLE Automaten - vorab 5/6/7 (+ Bedarfs-Schritte 8/9), dann je Automat NUR das
    // Befuellen in Reihenfolge, danach gebuendelt 11/12/14. Soll = Anzahl x Einzel-Soll.
    // Ausnahme: Standorte mit Zwischenfahrt (zf) - dort liegen die Automaten raeumlich
    // getrennt, ein gemeinsames Oeffnen/Abschliessen ist nicht moeglich.
    const buendel = devs.length > 1 && !st.zf;
    const gsub = st.name + ' \u00b7 alle ' + devs.length + ' Automaten';
    const gpush = (nr, o) => STEPS.push(Object.assign({
      id: 'sd' + sk + '_' + nr + 'g', nr, t: titel(nr), sub: gsub, ort: 1
    }, o));
    if (buendel) {
      [5, 6, 7].forEach(nr => gpush(nr, {soll: sollMin(nr, devs.length)}));
      [8, 9].forEach(nr => gpush(nr, {skip: 1, ev: 1, soll: sollMin(nr, 1), bn: bedarfN(nr, devs)}));
    }
    devs.forEach((dev, di) => {
      // st.zf: gleiche Adresse, aber getrennte Positionen -> eigener Fahrt-Schritt
      // zwischen den Automaten (zaehlt ins Fahrzeit-Budget der Tour).
      if (st.zf && di > 0) {
        const mZiel = DATA.machines[M_BY_DEV[dev]];
        fahrtN++; STEPS.push({id: 'fz' + dev, nr: 4, t: titel(4), sub: '\u2192 ' + (mZiel ? mZiel.label : st.name), fahrt: 1});
      }
      seen[dev] = 1; autoBlock(dev, buendel);
    });
    if (buendel) {
      [11, 12, 14].forEach(nr => gpush(nr, {soll: sollMin(nr, devs.length)}));
    }
    // st.ohne: Nummern der Punkte, die an diesem Standort entfallen (aus den Tour-Daten).
    const ohne = st.ohne || [];
    if (ohne.indexOf(13) < 0) STEPS.push({id: 'sd' + sk + '_13', nr: 13, t: titel(13), sub: st.name, soll: sollMin(13, 1)});
    // Kehren: im Kioskladen Nr. 19, sonst Nr. 15 (Outdoor). "ohne 15" heisst: kein Kehren.
    const kehrNr = (st.kiosk && T(19)) ? 19 : 15;
    if (ohne.indexOf(15) < 0 && ohne.indexOf(kehrNr) < 0) STEPS.push({id: 'sd' + sk + '_' + kehrNr, nr: kehrNr, t: titel(kehrNr), sub: st.name, soll: sollMin(kehrNr, 1)});
    if (st.kiosk && ohne.indexOf(16) < 0) STEPS.push({id: 'sd' + sk + '_16', nr: 16, t: titel(16), sub: st.name, soll: sollMin(16, 1)});
    // Vor der Weiterfahrt: Kisten zurueck ins Auto. Kontroll-Schritt ohne eigenes Soll
    // (die zugehoerige Sollzeit ist je Tour bemessen und steckt in Nr. 3).
    // Ab Katalog v11 hat das Zurueckpacken eine eigene Taetigkeit (Nr. 20, Sollzeit je Standort).
    if (T(20)) STEPS.push({id: 'sd' + sk + '_3b', nr: 20, t: titel(20), sub: st.name, ort: 1, soll: sollMin(20, 1)});
    else STEPS.push({id: 'sd' + sk + '_3b', nr: '3b', t: titel(3), sub: st.name, ort: 1, soll: 0});
  });
  // Sicherheitsnetz: Automaten, die in keiner Gruppe auftauchen, bekommen trotzdem ihren Block.
  DATA.machines.forEach(m => {
    if (seen[m.device]) return;

    autoBlock(m.device);
    if (T(20)) STEPS.push({id: 'o' + m.device + '_3b', nr: 20, t: titel(20), sub: m.label, ort: 1, soll: sollMin(20, 1)});
    else STEPS.push({id: 'o' + m.device + '_3b', nr: '3b', t: titel(3), sub: m.label, ort: 1, soll: 0});
  });
  // Tages-Abweichungen aus den Tour-Daten: Tour endet am letzten Standort bzw. Abschluss-Punkte entfallen.
  const ohneT = Array.isArray(P.ohne_tour) ? P.ohne_tour : [];
  if (!P.ohne_rueck) { fahrtN++; STEPS.push({id: 'frueck', nr: 4, t: titel(4), sub: '\u2192 zur\u00fcck', fahrt: 1}); }
  if (ohneT.indexOf(17) < 0) STEPS.push({id: 't17', nr: 17, t: titel(17), soll: sollMin(17, 1)});
  // Seit Katalog v16: Kontrollen am Tourende direkt nach Nr. 17 (Nr. 25), nur wenn im Katalog-Blatt dort.
  (Array.isArray(P.ende_kontr) ? P.ende_kontr : []).forEach(nr => {
    if (typeof nr !== 'number' || !T(nr)) return;

  if (ohneT.indexOf(18) < 0) STEPS.push({id: 't18', nr: 18, t: titel(18), soll: sollMin(18, 1)});
  if (state.step >= STEPS.length) state.step = 0;
  // Wurde am selben Tag ein geaenderter Plan veroeffentlicht, kann eine gespeicherte
  // Schritt-ID nicht mehr existieren -> Timer sauber loslassen, Auto-Start unten greift.
  // Kennungen muessen eindeutig sein (sonst teilten sich zwei Schritte Haken und Zeit): eine
  // unerwartete Dublette bekommt ein Suffix. Doppelte Automaten lehnt schon das Publish-Skript ab.
  const STEP_IDS = {}; STEPS.forEach(s => { let id = s.id, n = 1; while (STEP_IDS[id]) id = s.id + '~' + (++n); s.id = id; STEP_IDS[id] = 1; });
  // Migration alter Tagesstaende: An gebuendelten Laden-Standorten wandern Zeit und Status
  // fruehrer Einzel-Schritte (a<dev>_<nr>) in den jeweiligen Buendel-Schritt.
  (P.standorte || []).forEach((st, si) => {
    [5, 6, 7, 8, 9, 11, 12, 14].forEach(nr => {
      const sk = (st.devs || []).filter(d => M_BY_DEV[d] != null)[0];
      const gid = 'sd' + sk + '_' + nr + 'g';

      const alt = (st.devs || []).map(d => 'a' + d + '_' + nr);

      if (alt.indexOf(state.aktiv) >= 0 && !STEP_IDS[state.aktiv]) {

      if (alt.indexOf(state.cur) >= 0 && !STEP_IDS[state.cur]) state.cur = gid;
      const hatStatus = alt.some(id => state.done[id] || state.skipd[id] || state.zeit[id]);
      if (!hatStatus) return;

      const alleUebersprungen = alt.every(id => state.skipd[id]);
      let zeitSum = 0;
      alt.forEach(id => {
        if (state.zeit[id]) { zeitSum += state.zeit[id]; }
        delete state.zeit[id]; delete state.done[id]; delete state.skipd[id];
      });
      if (zeitSum) state.zeit[gid] = (state.zeit[gid] || 0) + zeitSum;

  let aktivVerwaist = false;

  // Tour-Schritte (a…, t…) behandelt die Buendel-Migration bzw. bleiben unberuehrt.
  ['zeit', 'done', 'skipd'].forEach(feld => {
    Object.keys(state[feld] || {}).forEach(id => {

  });
  if (state.aktiv && !STEP_IDS[state.aktiv]) { state.aktiv = null; state.seit = null; aktivVerwaist = true; }
  // Existiert die aktive Schritt-ID noch, den (index-basierten) state.step darauf
  // ausrichten - neu eingefuegte Schritte verschieben sonst gespeicherte Indizes.
  if (state.aktiv) {

  }
  // Kein laufender Schritt (z. B. Pause): den angezeigten Schritt ueber seine gespeicherte
  // Kennung wiederfinden; gibt es ihn nicht mehr, am ersten offenen Schritt ankern.
  // Ein pausierter Altstand ohne gespeicherte Kennung gilt ebenfalls als verwaist.
  if (!state.aktiv && (state.cur || state.pausiert)) {
    const i = state.cur ? STEPS.findIndex(s => s.id === state.cur) : -1;
    if (i >= 0) state.step = i;

  }

  // ---- Timer ----
  const ist = id => (state.zeit[id] || 0) + (state.aktiv === id && state.seit ? (Date.now() - state.seit) / 1000 : 0);
  const istGes = () => STEPS.reduce((a, s) => a + ist(s.id), 0);
  const fahrtIst = () => STEPS.filter(s => s.fahrt).reduce((a, s) => a + ist(s.id), 0);
  // Gesamt-Soll: feste Schritte je Vorkommen; Fahrten als Tour-Budget; Bedarfs-Schritte (ev)
  // NICHT je Automat, sondern ueber die Mengen-Annahmen der Tour (todos/muenz).
  const sollGesMin = STEPS.reduce((a, s) => a + ((s.ev || s.fahrt) ? 0 : (s.soll || 0)), 0)
    + (P.fahrzeit || 0) + (P.muenz || 0) * sollMin(8, 1) + (P.todos || 0) * sollMin(9, 1);
  function stopTimer() {
    if (state.aktiv && state.seit) state.zeit[state.aktiv] = (state.zeit[state.aktiv] || 0) + (Date.now() - state.seit) / 1000;
    state.aktiv = null; state.seit = null;
  }
  // Pause: haelt den Schritt-Timer an, die Pausenzeit laeuft separat mit (fuers Protokoll).
  function endePause() {
    if (state.pausiert && state.pauseSeit) state.pauseSum += (Date.now() - state.pauseSeit) / 1000;
    state.pausiert = 0; state.pauseSeit = null;
  }
  const pauseIst = () => (state.pauseSum || 0) + (state.pausiert && state.pauseSeit ? (Date.now() - state.pauseSeit) / 1000 : 0);
  window.togglePause = () => {
    // Eine fertige Tour laesst sich nicht (unsichtbar) pausieren - nur noch fortsetzen.
    if (!state.pausiert && naechsterOffen(0) < 0) return;
    if (state.pausiert) {
      endePause();
      const s = STEPS[state.step];
      if (!state.done[s.id] && !state.skipd[s.id]) { state.aktiv = s.id; state.seit = Date.now(); }
    } else {
      stopTimer();
      state.pausiert = 1; state.pauseSeit = Date.now();
    }
    if (navigator.vibrate) navigator.vibrate(20);
    save(); render();
  };
  function laufe(i) {
    endePause();
    stopTimer();
    state.step = i;
    const s = STEPS[i];
    delete state.done[s.id]; delete state.skipd[s.id];
    state.aktiv = s.id; state.seit = Date.now();
    // Schritte ohne Positionsliste fuehren die Ablauf-Liste selbst mit (siehe render);
    // beim Wechsel in einen Pack-/Befuell-Schritt geht es an den Seitenanfang zur Liste.
    if (state.view !== 0) { state.view = 0; springTop = true; }
    if (s.mode) springTop = true;
    save(); render(); ansageSchritt();
  }
  const naechsterOffen = from => {
    for (let i = from; i < STEPS.length; i++) if (!state.done[STEPS[i].id] && !state.skipd[STEPS[i].id]) return i;
    for (let i = 0; i < from; i++) if (!state.done[STEPS[i].id] && !state.skipd[STEPS[i].id]) return i;
    return -1;
  };
  window.springe = i => laufe(i);
  window.stepZurueck = () => { if (state.step > 0) laufe(state.step - 1); };
  const offenPack = () => DATA.machines.reduce((n, m) => n + m.items.filter(it => !st(k(m, it))).length, 0);
  window.fertig = () => {
    const s = STEPS[state.step];

  const k = (m, it) => m.device + '_' + it.id;
  const selTxt = it => it.sel.join('+') || '\u2013';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const st = key => state.items[key] || 0;
  const partOf = key => state.part[key] || 0;
  const missQty = (m, it) => { const s = st(k(m, it)); return s === 2 ? it.qty : s === 3 ? Math.max(0, it.qty - partOf(k(m, it))) : 0; };
  const missList = () => DATA.machines.flatMap((m, i) => m.items.filter(it => missQty(m, it) > 0).map(it => ({m, i, it, miss: missQty(m, it)})));
  let ui = {pickKey: null, pickVal: 0};
  // Scroll-Verhalten: Nach dem Abhaken springt die Ansicht zum NAECHSTEN OFFENEN Punkt
  // (#nextitem); bei sonstigen Korrekturen bleibt sie stehen; nur Schritt-, Kisten-
  // oder Ansichtswechsel springen an den Seitenanfang.
  let springTop = true, scrollZiel = null;
  // Kopfhoehe fuer die stehende Schritt-Karte; auch bei Drehen/Groessenaenderung nachfuehren.
  const setKopf = () => document.documentElement.style.setProperty('--kopf', ((document.querySelector('header') || {}).offsetHeight || 0) + 'px');
  window.addEventListener('resize', setKopf);
  function scrollNach(y0) {
    if (springTop) { window.scrollTo(0, 0); springTop = false; scrollZiel = null; return; }
    // Ablauf-Liste mitfuehren: der aktuelle Schritt steht direkt unter der (stehenden)
    // Schritt-Karte, die Zeile davor bleibt als Orientierung sichtbar.
    if (scrollZiel === 'cur') {
      scrollZiel = null;
      const el = document.querySelector('.srow.cur'), karte = document.querySelector('.stepcard');

        const kh = karte ? karte.offsetHeight + 20 : 0;

      }
    }
    if (scrollZiel === 'next') {

      const el = document.getElementById('nextitem');
      if (el) {

        window.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + window.scrollY - kopf - 8));
        return;
      }

    window.scrollTo(0, y0);
  }
  // Kisten-/Automatenleiste: aktiven Reiter sichtbar halten (die Leiste wird je Render neu
  // aufgebaut und stuende sonst wieder ganz links).
  function leisteZentrieren() {
    const tb = document.querySelector('.tabs');

  // Ist die aktuelle Kiste im Pack-Schritt komplett, automatisch zur naechsten Kiste mit

  function packWeiter() {
    const s = STEPS[state.step];
    if (!s || s.mode !== 'pack') return '';

    if (!m || m.items.some(it => !st(k(m, it)))) return '';
    for (let d = 1; d < DATA.machines.length; d++) {

      }

  }
  window.mark = (key, val) => {

    const s = STEPS[state.step];

  // ---- Formatierung ----
  const fmtM = x => (Math.round(x * 10) / 10).toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1});
  const fmtClock = sec => {

  function row(m, it, cls, boxTxt, withX, qtyHtml, sub) {

  }

      <div class="pickact"><button class="pickok" onclick="pickOk('${key}',${it.qty})">\u2713 \u00dcbernehmen</button><button class="pickcancel" onclick="pickCancel()">Abbrechen</button></div>
    </div>`;
  }

  // ---- Renderer ----
  function timerStreifen(s) {
    const sollTxt = s.fahrt
      ? `Fahrzeit gesamt<br><b>${fmtM(fahrtIst() / 60)}</b> / ${fmtM(P.fahrzeit || 0)} min`
      : (s.soll ? (s.ev ? (typeof s.bn === 'number'
            ? (s.bn > 0 ? `${Number.isInteger(s.bn) ? s.bn : fmtM(s.bn)} offen \u00b7 Soll<br><b>${fmtM(s.soll * s.bn)} min</b>` : `Nichts offen<br><b>\u00fcberspringen</b>`)
            : (NE ? `ToDos nicht erfasst<br><b>ohne Soll</b>` : `Soll je Ereignis<br><b>${fmtM(s.soll)} min</b>`)) : `Soll<br><b>${fmtM(s.soll)} min</b>`) : '');
    const pauseH = state.pausiert
      ? `<div class="pausenote" id="pausenote">\u23f8 PAUSE \u2013 Timer angehalten (${fmtM(pauseIst() / 60)} min) \u00b7 \u25b6 zum Weitermachen</div>`
      : '';
